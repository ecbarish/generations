name: ac3 notes
on:
  push:
    paths:
      - .github/workflows/ac3-notes.yml
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/ac3-post-merge
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: correct the merged status
        run: |
          python3 - << 'PY'
          from pathlib import Path

          def once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(path + " count " + str(count))
              file.write_text(text.replace(old, new, 1))

          once(
              "README.md",
              ", ready for review, not merged. Hub stays v1.5.1.",
              ", merged (`a7fac81`). Hub stays v1.5.1.",
          )
          once(
              "START-HERE.md",
              "## Session log (newest first; one or two lines each)\n\n",
              "## Session log (newest first; one or two lines each)\n\n"
              "- 2026-10-11 — Grok (Adam / abarish-dev, guest): at Adam's request merged "
              "#160 (AC3 Brisket's Crossing, `a7fac81`). Cabinet v0.1.0, no hub bump. "
              "Ember Bricks stays open. The hit-pause follow-up stays draft #180.\n",
          )
          once(
              "docs/COMMS.md",
              "## Messages\n\n",
              "## Messages\n\n"
              "### 2026-10-11 14:15, Grok (Adam / abarish-dev) to all\n"
              "Brisket's Crossing (AC3) is merged at Adam's request "
              "([PR #160](https://github.com/ecbarish/idle-arcade/pull/160), `a7fac81`). "
              "Cabinet v0.1.0. The hub stays v1.5.1. Ember Bricks is still free, one PR of its own. "
              "The pause-after-a-hit follow-up is already claimed in draft #180; this note does not touch it.\n\n",
          )
          once(
              "docs/DEVELOPMENT-PATH.md",
              "Brisket's Crossing is draft PR #160 (ready for review, not merged). Ember Bricks is still free.",
              "Brisket's Crossing is merged ([PR #160](https://github.com/ecbarish/idle-arcade/pull/160), `a7fac81`). Ember Bricks is still free.",
          )
          once(
              "docs/DEVELOPMENT-PATH.md",
              "- **2026-10-11, the wild bond and the reveal (Claude, Wildbond builder, PR #170):**",
              "- **2026-10-11, AC3 merge:** a status line that still says \"not merged\" after the merge is wrong; "
              "correct it, and leave the checkbox open while the other cabinet on that line is unbuilt.\n\n"
              "- **2026-10-11, the wild bond and the reveal (Claude, Wildbond builder, PR #170):**",
          )
          dev = Path("docs/DEVELOPMENT-PATH.md").read_text()
          if "- [x] AC3" in dev or "- [ ] AC3" not in dev:
              raise SystemExit("AC3 checkbox changed")
          if "ready for review, not merged" in Path("README.md").read_text():
              raise SystemExit("readme still stale")
          print("notes ok")
          PY
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add README.md START-HERE.md docs/COMMS.md docs/DEVELOPMENT-PATH.md
          git commit -m "AC3: record that Brisket's Crossing is merged"
          git push
          git rm .github/workflows/ac3-notes.yml
          git commit -m "AC3: remove the one-shot notes helper"
          git push
