# Additive focused browser review. The existing Checks workflow still runs every aggregate suite.
name: Newcomer guidance review
on:
  pull_request:
    paths:
      - 'shared/onboarding.*'
      - 'games/realmbound/**'
      - 'tests/onboarding-*'
      - '.github/workflows/onboarding-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onboarding-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review real input, responsive guidance and existing saves
        run: node tests/onboarding-browser.cjs . "$RUNNER_TEMP/onboarding-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newcomer-guidance-review
          path: ${{ runner.temp }}/onboarding-review/
          if-no-files-found: error
          retention-days: 30
