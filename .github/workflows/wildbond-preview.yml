name: Wildbond web preview review
on:
  pull_request:
    paths: ['tools/wildbond-preview-*', '.github/workflows/wildbond-preview.yml', 'play/wildbond/**']
  push:
    branches: [main]
    paths: ['play/wildbond/**', '.github/workflows/wildbond-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wildbond-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 183 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'guest/wildbond-preview-door-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 480dfc4acd9799b033d70a250167f9654a29f207
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exporter and browser
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the exact committed pack and retain the previous preview
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          python3 tools/wildbond-preview-manifest.py verify --source "$SOURCE_COMMIT"
          git show "$SOURCE_COMMIT:play/wildbond/index.pck" > "$RUNNER_TEMP/wildbond-before.pck"
      - name: Generate saves with the real pre-WD3 writer
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 26bd1a6f5a3d8c3f7d4160c940b4de0641dd2dcf
          git worktree add "$RUNNER_TEMP/wildbond-legacy" FETCH_HEAD
          cp tools/wildbond-preview-fixtures.gd "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/tests/preview-fixtures.gd"
          timeout 120 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --editor --import --quit
          timeout 60 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --script res://tests/preview-fixtures.gd
          cp -r "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/frames/preview-fixtures" preview-review/fixtures
      - name: Play the committed web pack, load legacy saves, and capture it
        env:
          BEFORE_PACK: ${{ runner.temp }}/wildbond-before.pck
        run: node tools/wildbond-preview-checks.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-web-review
          path: |
            preview-review/
            play/wildbond/index.pck
            play/wildbond/index.html
            play/wildbond/build.json

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the exact reviewed bytes on the official Pages preview
        env:
          LIVE_PREVIEW_URL: https://ecbarish.github.io/generations/play/wildbond/
        run: python3 tools/wildbond-preview-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-live-verification
          path: preview-review/live-verification.json
          if-no-files-found: error
