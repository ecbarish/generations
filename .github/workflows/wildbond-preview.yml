name: Wildbond web preview review
on:
  pull_request:
    paths: ['tools/wildbond-preview-*', '.github/workflows/wildbond-preview.yml', 'play/wildbond/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildbond-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 183 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'guest/wildbond-preview-door-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 480dfc4acd9799b033d70a250167f9654a29f207
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exporter and browser
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Export only the merged game pack, retaining the existing engine
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD:wildbond-godot)" = "$(git rev-parse "$SOURCE_COMMIT:wildbond-godot")"
          "$GODOT" --version | grep '^4.7.2.stable'
          mkdir -p preview-review
          git rev-parse HEAD | tee preview-review/checkout-sha.txt
          cp play/wildbond/index.pck "$RUNNER_TEMP/wildbond-before.pck"
          sha256sum play/wildbond/index.wasm play/wildbond/index.js > preview-review/engine-before.sha256
          timeout 180 "$GODOT" --headless --path wildbond-godot --editor --import --quit
          timeout 180 "$GODOT" --headless --path wildbond-godot --export-pack Web ../play/wildbond/index.pck
          sha256sum -c preview-review/engine-before.sha256
          python3 tools/wildbond-preview-manifest.py stage --source "$SOURCE_COMMIT"
      - name: Generate saves with the real pre-WD3 writer
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 26bd1a6f5a3d8c3f7d4160c940b4de0641dd2dcf
          git worktree add "$RUNNER_TEMP/wildbond-legacy" FETCH_HEAD
          cp tools/wildbond-preview-fixtures.gd "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/tests/preview-fixtures.gd"
          timeout 120 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --editor --import --quit
          timeout 60 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --script res://tests/preview-fixtures.gd
          cp -r "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/frames/preview-fixtures" preview-review/fixtures
      - name: Play the committed web pack, load legacy saves, and capture it
        env:
          BEFORE_PACK: ${{ runner.temp }}/wildbond-before.pck
        run: node tools/wildbond-preview-checks.cjs
      - name: Store the tested pack and selected evidence as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYBLOBS'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          files = [Path('play/wildbond') / name for name in ['index.pck', 'index.html', 'build.json']]
          for size in ['1920x1080', '812x375']:
              files += sorted(Path('preview-review/screens').glob('doors-' + size + '-*-entry.png'))
          files += [Path('preview-review/screens/doors-812x375-gran_home-before.png')]
          manifest = []
          for p in files:
              data = p.read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/ecbarish/idle-arcade/git/blobs', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=120) as response:
                  blob = json.load(response)
              entry = {'path': str(p), 'sha': blob['sha'], 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              manifest.append(entry)
              print('PREVIEW_BLOB ' + json.dumps(entry))
          Path('preview-review/blobs.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYBLOBS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-web-review
          path: |
            preview-review/
            play/wildbond/index.pck
            play/wildbond/index.html
            play/wildbond/build.json

