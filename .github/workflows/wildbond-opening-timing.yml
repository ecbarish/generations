name: Wildbond opening timing
on:
  pull_request:
    paths:
      - 'wildbond-godot/**'
      - 'tools/audit/wildbond_opening_timing.gd'
      - 'tools/audit/validate_wildbond_opening_timing.py'
      - 'tools/audit/test_validate_wildbond_opening_timing.py'
      - '.github/workflows/wildbond-opening-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        method: [keyboard, touch]
        starter: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official Godot and rendered display
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri imagemagick
      - name: Compare rendered baseline and current through normal inputs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENING_METHOD: '${{ matrix.method }}'
          OPENING_STARTER: '${{ matrix.starter }}'
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/wb-baseline" 40fcaf9
          fixture="$PWD/tools/audit/wildbond_opening_timing.gd"
          mkdir -p opening-review
          for variant in baseline current; do
            project="$PWD/wildbond-godot"
            sha="$(git rev-parse HEAD)"
            if [ "$variant" = baseline ]; then
              project="$RUNNER_TEMP/wb-baseline/wildbond-godot"
              sha="$(git -C "$RUNNER_TEMP/wb-baseline" rev-parse HEAD)"
            fi
            export HOME="$RUNNER_TEMP/opening-home-$variant"
            export XDG_DATA_HOME="$HOME/data" XDG_CACHE_HOME="$HOME/cache"
            mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
            timeout 180 "$GODOT" --headless --path "$project" --editor --import --quit
            mkdir -p "opening-review/$variant"
            SOURCE_SHA="$sha" OPENING_OUTPUT="$PWD/opening-review/$variant" timeout 480 xvfb-run -a -s "-screen 0 4000x1800x24" "$GODOT" --path "$project" --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --script "$fixture" |& tee "opening-review/$variant/run.log"
          done
      - name: Validate real-input completion, captures, and timing
        if: always()
        run: |
          python3 tools/audit/test_validate_wildbond_opening_timing.py
          python3 tools/audit/validate_wildbond_opening_timing.py opening-review --require-rendered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-opening-${{ matrix.method }}-${{ matrix.starter }}
          path: opening-review/
          if-no-files-found: error
