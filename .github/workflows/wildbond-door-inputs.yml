name: Wildbond rendered door inputs
on:
  pull_request:
    paths:
      - 'wildbond-godot/**'
      - 'tools/audit/wildbond_door_inputs.gd'
      - 'tools/audit/validate_wildbond_door_inputs.py'
      - '.github/workflows/wildbond-door-inputs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wildbond-door-inputs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rendered-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and rendered display tools
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          if ! command -v xvfb-run >/dev/null || ! command -v import >/dev/null || ! command -v identify >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri imagemagick
          fi
      - name: Record exact source and import Wildbond
        run: |
          set -euo pipefail
          mkdir -p door-input-review
          git rev-parse HEAD | tee door-input-review/source-sha.txt
          "$GODOT" --version | tee door-input-review/engine.txt
          timeout 180 "$GODOT" --headless --path wildbond-godot --editor --import --quit
      - name: Exercise rendered mouse, touch, and keyboard door transitions
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)" DOOR_OUTPUT="$PWD/door-input-review" timeout 720 xvfb-run -a -s "-screen 0 2400x1400x24" "$GODOT" --path wildbond-godot --audio-driver Dummy --rendering-method gl_compatibility --script "$PWD/tools/audit/wildbond_door_inputs.gd" |& tee door-input-review/render.log
      - name: Validate rendered coverage and default phone diagnostics
        if: always()
        run: |
          python3 tools/audit/validate_wildbond_door_inputs.py door-input-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-door-input-review
          path: door-input-review/
          if-no-files-found: error
