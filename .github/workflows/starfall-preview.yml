name: Starfall web preview review
on:
  pull_request:
    paths: ['tools/starfall-preview-*', '.github/workflows/starfall-preview.yml', 'play/starfall/**']
permissions:
  contents: write
concurrency:
  group: starfall-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 206 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'guest/starfall-opening-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 0af5b92cf4ae03fbbb2dd83bf67b0e06332e38fd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official exporter and browser
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          if ! command -v identify >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends imagemagick; fi
      - name: Export only the exact merged Starfall pack
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD:starfall-godot)" = "$(git rev-parse "$SOURCE_COMMIT:starfall-godot")"
          "$GODOT" --version | grep '^4.7.2.stable'
          mkdir -p preview-review
          git rev-parse HEAD > preview-review/checkout-sha.txt
          cp play/starfall/index.pck "$RUNNER_TEMP/starfall-before.pck"
          sha256sum play/starfall/index.wasm play/starfall/index.js > preview-review/engine-before.sha256
          timeout 180 "$GODOT" --headless --path starfall-godot --editor --import --quit
          timeout 180 "$GODOT" --headless --path starfall-godot --export-pack Web ../play/starfall/index.pck
          sha256sum -c preview-review/engine-before.sha256
          python3 tools/starfall-preview-manifest.py stage --source "$SOURCE_COMMIT"
      - name: Generate legacy town with the previous shipped source
        run: |
          set -euo pipefail
          git fetch --depth=1 origin fa44b3ace8aa151ff264af679b3d739342b25a34
          git worktree add "$RUNNER_TEMP/starfall-legacy" FETCH_HEAD
          cp tools/starfall-preview-fixtures.gd "$RUNNER_TEMP/starfall-legacy/starfall-godot/tests/preview-fixtures.gd"
          timeout 120 "$GODOT" --headless --path "$RUNNER_TEMP/starfall-legacy/starfall-godot" --editor --import --quit
          FIXTURE_OUTPUT="$PWD/preview-review/legacy.json" timeout 60 "$GODOT" --headless --path "$RUNNER_TEMP/starfall-legacy/starfall-godot" --script res://tests/preview-fixtures.gd
      - name: Play exact output and verify old-save reloads
        env:
          BEFORE_PACK: ${{ runner.temp }}/starfall-before.pck
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 12m node tools/starfall-preview-checks.cjs |& tee preview-review/runtime.log
          python3 tools/starfall-preview-validate.py
      - name: Store reviewed bytes as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          files = [Path('play/starfall') / n for n in ['index.pck', 'index.html', 'build.json']]
          files += [Path('preview-review/screens') / n for n in ['1920x1080-fresh-ready.png', '812x375-fresh-ready.png', '812x375-legacy-after.png']]
          results = []
          for p in files:
              data = p.read_bytes()
              req = urllib.request.Request('https://api.github.com/repos/ecbarish/idle-arcade/git/blobs', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=120) as response:
                  blob = json.load(response)
              item = {'path': str(p), 'sha': blob['sha'], 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              results.append(item)
              print('PREVIEW_BLOB ' + json.dumps(item))
          Path('preview-review/blobs.json').write_text(json.dumps(results, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfall-web-review
          path: |
            preview-review/
            play/starfall/index.pck
            play/starfall/index.html
            play/starfall/build.json
