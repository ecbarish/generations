name: wd4b apply once

on:
  push:
    branches: [guest/saltmarsh-explore]
    paths:
      - ".github/workflows/wd4b-apply-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/saltmarsh-explore
      - name: Apply WD4b and remove the helper
        run: |
          set -euo pipefail
          echo "c04be830f68e8a9d5aafcc60b3d3065e6a11048429a3dd47dc428d07cb0a10df  tools/wd4b_apply_once.b64" | sha256sum -c
          base64 -d tools/wd4b_apply_once.b64 > tools/wd4b_apply_once.py
          echo "d0c22bf85f2c58a4c51d6c9bf85c2997ab0f89285925bd58f71fa326230836aa  tools/wd4b_apply_once.py" | sha256sum -c
          python3 tools/wd4b_apply_once.py
          git config user.name "abarish-dev"
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add -A
          git rm -f tools/wd4b_apply_once.py tools/wd4b_apply_once.b64 .github/workflows/wd4b-apply-once.yml
          git commit -m "WD4b: Saltmarsh road, settlement kept, Tide-gated Moon Pool"
          git push origin HEAD:guest/saltmarsh-explore
