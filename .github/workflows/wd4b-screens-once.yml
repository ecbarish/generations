name: wd4b screens once

on:
  push:
    paths:
      - .github/workflows/wd4b-screens-once.yml

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/saltmarsh-explore
      - name: Save the three Saltmarsh screens
        run: |
          set -euo pipefail
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          mkdir -p docs/screenshots/wildbond-wd4b
          curl --fail --retry 2 --max-time 60 -fsSL -A "Mozilla/5.0" -o docs/screenshots/wildbond-wd4b/road.png "https://tmpfiles.org/dl/1791827828.9f0d8f7c0c142cab/wWAeKTfLHjUa/road.png"
          curl --fail --retry 2 --max-time 60 -fsSL -A "Mozilla/5.0" -o docs/screenshots/wildbond-wd4b/settlement.png "https://tmpfiles.org/dl/1791827828.8e6c339cf28f1020/wmAUKPfzHpVG/settlement.png"
          curl --fail --retry 2 --max-time 60 -fsSL -A "Mozilla/5.0" -o docs/screenshots/wildbond-wd4b/pool.png "https://tmpfiles.org/dl/1791827828.fd330fb24affc185/wwABKpfqHXLW/pool.png"
          python3 -c 'import hashlib,pathlib; expect={"road":"18e5320808674d139a43c86ac844dc701dd059285f94906ab06ac5f6070ac4c0","settlement":"42306000930701a8482fceb4ffa73e1dcdce361f50ce0f97401a7c3efbf57f0b","pool":"5e2119302ef0ba972dd16c9bf0841ea02cd70d5e1a6591e70a6978d7d02bd0bb"};
          [(_ for _ in ()).throw(SystemExit(n+" "+hashlib.sha256(pathlib.Path("docs/screenshots/wildbond-wd4b/"+n+".png").read_bytes()).hexdigest())) for n,s in expect.items() if hashlib.sha256(pathlib.Path("docs/screenshots/wildbond-wd4b/"+n+".png").read_bytes()).hexdigest()!=s]'
          python3 -c 'open("docs/screenshots/wildbond-wd4b/README.md","w").write("# WD4b Saltmarsh screens\n\nGodot 4.7.2 rendered these from the trial, with the opening skipped and the coast colour restored. Nothing here is a web export.\n\n- [Saltmarsh Road](road.png): the coast road between Thornwood gate and the settlement. Tobin stands by the sign.\n- [Saltmarsh Coast](settlement.png): the original settlement, so an old save still lands on this map.\n- [Moon Pool](pool.png): the return spot a Tide partner can open. Foamglint is easier to find here.\n\nNot a physical-device test. Draft #232.\n")'
          git add docs/screenshots/wildbond-wd4b
          git rm -f .github/workflows/wd4b-screens-once.yml
          git commit -m "WD4b: Saltmarsh road, settlement and Moon Pool screens"
          git push origin HEAD:guest/saltmarsh-explore
