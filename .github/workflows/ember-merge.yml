name: ember merge
on:
  push:
    paths:
      - .github/workflows/ember-merge.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/ember-bricks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: merge main
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git fetch origin main
          if git merge origin/main -m "Merge main into guest/ember-bricks"; then
            echo clean
          else
            python3 - << 'PY'
          import pathlib, re
          files=pathlib.Path('.').read_text() if False else []
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).split()
          pat=re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> [^\n]+\n', re.S)
          for name in files:
              file=pathlib.Path(name)
              text=file.read_text()
              def repl(m):
                  a=m.group(1).strip('\n')
                  b=m.group(2).strip('\n')
                  return a+'\n\n'+b+'\n'
              new=pat.sub(repl, text)
              if '<<<<<<<' in new or '>>>>>>>' in new:
                  raise SystemExit('unresolved '+name)
              file.write_text(new)
              print('resolved', name)
          root=pathlib.Path('README.md').read_text()
          dev=pathlib.Path('docs/DEVELOPMENT-PATH.md').read_text()
          start=pathlib.Path('START-HERE.md').read_text()
          comms=pathlib.Path('docs/COMMS.md').read_text()
          if root.count('Ember Bricks v0.1.0')!=1: raise SystemExit('readme ember')
          if 'WB-DOOR-TAP' not in root: raise SystemExit('readme door')
          if 'Ember Bricks is claimed' not in dev: raise SystemExit('claim')
          if '- [x] AC3' in dev or '- [ ] AC3' not in dev: raise SystemExit('checkbox')
          if 'SF2.9' not in dev or 'SF2.9' not in start: raise SystemExit('starfall path')
          if 'guest/ember-bricks' not in start or 'guest/ember-bricks' not in comms: raise SystemExit('ember note')
          print('merge ok')
          PY
            git add -A
            git commit -m "Merge main into guest/ember-bricks"
          fi
          git push
          git rm .github/workflows/ember-merge.yml
          git commit -m "AC3: remove the one-shot merge helper"
          git push
