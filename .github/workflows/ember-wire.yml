name: ember wire
on:
  push:
    paths:
      - .github/workflows/ember-wire.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/ember-bricks
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: wire the cabinet
        run: |
          python3 tools/ember-wire-once.py
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add launcher/games.js index.html tests/tell-us.html tools/run-all-checks.cjs .github/ISSUE_TEMPLATE README.md docs/DEVELOPMENT-PATH.md docs/COMMS.md START-HERE.md games/ember-bricks/style.css
          git commit -m "AC3: wire Ember Bricks into the arcade"
          git push
          git rm .github/workflows/ember-wire.yml tools/ember-wire-once.py
          git commit -m "AC3: remove the one-shot wiring helper"
          git push
