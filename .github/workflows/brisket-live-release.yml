name: Brisket live release
on:
  pull_request:
    paths:
      - 'docs/playtests/brisket-ac3-1/live-review.cjs'
      - '.github/workflows/brisket-live-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brisket-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Verify public hashes and actual live controls
        run: node docs/playtests/brisket-ac3-1/live-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brisket-live-release
          path: docs/playtests/brisket-ac3-1/live/
          retention-days: 90
