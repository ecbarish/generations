name: Wildbond WB-C2 exact-pack review
on:
  pull_request:
    paths: ['play/wildbond/**', 'tools/wildbond-*', '.github/workflows/wildbond-wbc2-*.yml', 'docs/releases/wildbond-wbc2.md']
permissions:
  contents: read
concurrency:
  group: wildbond-wbc2-review-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  committed-pack:
    if: github.event.pull_request.number == 286 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'guest/wildbond-wbc2-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: c8fa1c8eb2105b32c1c387caa562c67317ede441
      SOURCE_TREE: 2bd2ebab5fa157c9ac5a143a8308e7fd7da54afe
      BEFORE_PACK: preview-review/before.pck
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact committed pack and source before browser work
        run: |
          set -euo pipefail
          mkdir -p preview-review
          git rev-parse HEAD | tee preview-review/release-sha.txt
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT:wildbond-godot")" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD:wildbond-godot)" = "$SOURCE_TREE"
          python3 tools/wildbond-preview-manifest.py verify --source "$SOURCE_COMMIT"
          git ls-files -z play/wildbond/ | xargs -0 sha256sum > preview-review/committed.sha256
          git show "$SOURCE_COMMIT:play/wildbond/index.pck" > "$BEFORE_PACK"
          git rev-parse "$SOURCE_COMMIT:play/wildbond/index.pck" > preview-review/before-blob.txt
          test "$(git hash-object "$BEFORE_PACK")" = "$(cat preview-review/before-blob.txt)"
          sha256sum "$BEFORE_PACK" play/wildbond/index.pck > preview-review/packs.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official legacy-save writer and browser review dependencies
        run: |
          set -euo pipefail
          curl --fail --retry 2 --connect-timeout 15 --max-time 120 -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr imagemagick
      - name: Generate old saves with the actual pre-WD3 writer
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 26bd1a6f5a3d8c3f7d4160c940b4de0641dd2dcf
          git worktree add --detach "$RUNNER_TEMP/wildbond-legacy" FETCH_HEAD
          cp tools/wildbond-preview-fixtures.gd "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/tests/preview-fixtures.gd"
          timeout 180 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --editor --import --quit
          timeout 60 "$GODOT" --headless --path "$RUNNER_TEMP/wildbond-legacy/wildbond-godot" --script res://tests/preview-fixtures.gd
          cp -r "$RUNNER_TEMP/wildbond-legacy/wildbond-godot/frames/preview-fixtures" preview-review/fixtures
      - name: Exercise committed pack through browser inputs and save reloads
        run: |
          set -euo pipefail
          python3 tools/test_wildbond_preview_validate.py
          python3 tools/wildbond-preview-pack.py --source "$SOURCE_COMMIT"
          node --check tools/wildbond-preview-checks.cjs
          timeout --signal=TERM --kill-after=15s 30m node tools/wildbond-preview-checks.cjs |& tee preview-review/runtime.log
          python3 tools/wildbond-preview-validate.py
      - name: Prove review did not mutate any committed preview bytes
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check preview-review/committed.sha256
          sha256sum --check preview-review/packs.sha256
          git diff --exit-code -- play/wildbond/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildbond-wbc2-exact-pack-review
          path: |
            preview-review/
            !preview-review/before.pck
          if-no-files-found: error
