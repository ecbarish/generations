name: wd4b merge main once

on:
  push:
    paths:
      - .github/workflows/wd4b-merge-main-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/saltmarsh-explore
          fetch-depth: 0
      - name: Merge main and keep both notes
        run: |
          set -euo pipefail
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main -m "WD4b: merge main and keep both notes"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path
          for name in ["README.md","START-HERE.md","docs/COMMS.md"]:
            p=Path(name); text=p.read_text()
            if "<<<<<<<" not in text: continue
            start=text.find("<<<<<<<"); mid=text.find("\n=======\n", start); end=text.find("\n>>>>>>>", mid); end_line=text.find("\n", end+1)
            if min(start,mid,end,end_line)<0: raise SystemExit("bad conflict "+name)
            ours=text[start:mid].split("\n",1)[1]; theirs=text[mid+len("\n=======\n"):end]
            text=text[:start]+theirs.rstrip("\n")+"\n"+ours.lstrip("\n")+text[end_line:]
            if "<<<<<<<" in text or ">>>>>>>" in text: raise SystemExit("markers remain "+name)
            p.write_text(text); print("resolved", name)'
            git add README.md START-HERE.md docs/COMMS.md
            if git diff --name-only --diff-filter=U | grep -q .; then git diff --name-only --diff-filter=U; exit 1; fi
            git commit -m "WD4b: merge main and keep both notes"
          fi
          git rm -f .github/workflows/wd4b-merge-main-once.yml
          git commit -m "WD4b: drop the main-merge helper"
          git push origin HEAD:guest/saltmarsh-explore
