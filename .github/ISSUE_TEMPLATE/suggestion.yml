name: Suggestion
description: An idea for a game, a feature, a creature, a story, anything.
title: "[Idea] "
labels: ["suggestion"]
body:
  - type: dropdown
    id: game
    attributes:
      label: For which game?
      options: [Wildbond, Wildbond (Godot preview), Realmbound, Starfall Guild, Starfall (Godot preview), Otherworld, Diamond Career, Diamond Manager, Storm Front, Lighthouse Watch, "Brisket's Crossing", Primordial, The arcade homepage, A new game, The whole arcade]
  - type: input
    id: context
    attributes:
      label: Game version and where you were (filled in automatically)
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would the player see and do? Why would it be fun?
    validations: { required: true }
