name: Playtest feedback
description: Tell us how a game felt to play, what you liked, what confused you.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options: [Wildbond, Wildbond (Godot preview), Realmbound, Starfall Guild, Starfall (Godot preview), Otherworld, Diamond Career, Diamond Manager, Storm Front, Lighthouse Watch, "Brisket's Crossing", Primordial, The arcade homepage, Other]
    validations: { required: true }
  - type: input
    id: context
    attributes:
      label: Game version and where you were (filled in automatically)
  - type: input
    id: time
    attributes:
      label: About how long did you play?
      placeholder: "20 minutes, two evenings, ..."
  - type: textarea
    id: liked
    attributes:
      label: What did you enjoy?
  - type: textarea
    id: confusing
    attributes:
      label: What confused you, felt slow, or made you want to stop?
  - type: textarea
    id: other
    attributes:
      label: Anything else? (device, screenshots welcome)
