<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Night Market checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#161326;color:#f4efe6;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#9ee7ba}.fail{color:#ff9a9a}#summary{font-weight:bold}
  iframe{width:375px;height:700px;border:0;background:#f4efe6}
</style>
<h1>Night Market checks</h1>
<p>Economy, the capped welcome back, and the real stall buttons. No hall entry.</p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<div id="game"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script src="../games/night-market/model.js"></script>
<script src="../tools/night-market-pacing.cjs"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var M = window.NightMarket;
  var KEY = M.SAVE_KEY;
  var before = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function near(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function work(state) {
    for (var i = 0; i < M.STALLS.length; i++) {
      if (!M.unlocked(state, i)) return;
      if (state.stalls[i].hired) continue;
      if (M.canHire(state, i)) { M.hire(state, i); return; }
      M.handSell(state, i);
      if (M.canHire(state, i)) M.hire(state, i);
      return;
    }
  }
  function spend(state) {
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (M.quote(state, i, 'max').count > 0) { M.buy(state, i, 'max'); return; }
    }
  }
  /* One hand action a second, then a second of stall income, then a buy on the cadence.
     Active buys whenever coins allow. Office buys once a minute, the way a tab left open gets a glance. */
  function play(seconds, buyEvery) {
    var state = M.fresh();
    var hireAt = null;
    var tea25 = null;
    var snap = {};
    for (var t = 1; t <= seconds; t++) {
      work(state);
      if (hireAt == null && state.stalls[0].hired) hireAt = t;
      M.addCash(state, M.income(state));
      if (t % buyEvery === 0) spend(state);
      if (tea25 == null && state.stalls[0].owned >= 25) tea25 = t;
      if (t === 600 || t === 1800) snap[t] = { income: M.income(state), owned: state.stalls.map(function (s) { return s.owned; }) };
    }
    return { state: state, hireAt: hireAt, tea25: tea25, snap: snap };
  }
  function frontierSeconds(state) {
    var rate = M.income(state);
    if (!(rate > 0)) return Infinity;
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (!state.stalls[i].hired) continue;
      return Idle.bulkCost(M.STALLS[i].base, M.STALLS[i].growth, state.stalls[i].owned, 1) / rate;
    }
    return Infinity;
  }
  var frame = null;
  try {
    check('six stalls on the shared milestones', M.STALLS.length === 6 && Idle.milestoneMult(25) === 2 && Idle.milestoneMult(50) === 4 && Idle.milestoneMult(100) === 8 && Idle.milestoneMult(24) === 1);
    M.STALLS.forEach(function (s) {
      /* The Story Mat climbs faster than the lane so each chapter is a choice, not a burst. */
      var cap = s.id === 'stories' ? 1.4 : 1.15;
      check(s.name + (s.id === 'stories' ? ' grows steeper than the lane' : ' grows gently'),
        s.growth >= 1.05 && s.growth <= cap && s.base > 0 && s.rate > 0 && s.serves > 0);
    });
    check('tea, dumpling and lantern use the measured NM-FUN-PASS balance',
      M.STALLS[0].base === 6 && M.STALLS[0].growth === 1.07 && M.STALLS[0].rate === 0.45 && M.STALLS[0].serves === 25 && M.STALLS[0].hand === 1 &&
      M.STALLS[1].base === 80 && M.STALLS[1].growth === 1.06 && M.STALLS[1].rate === 0.9 &&
      M.STALLS[2].base === 700 && M.STALLS[2].growth === 1.07 && M.STALLS[2].rate === 5);
    check('offline is four hours at half pay', M.OFFLINE_CAP === 4 * 3600 && M.OFFLINE_RATE === 0.5);
    check('the cash-box line states half pay and the cap', M.awayRule() === 'While away: earns 50%, up to 4h');

    var alone = M.fresh();
    [0, 1, 2].forEach(function (i) { alone.stalls[i].hired = true; });
    function firstPayback(i) { return M.STALLS[i].base / M.STALLS[i].rate; }
    check('the first tea, dumpling and lantern name their own payback',
      near(M.paybackSeconds(alone, 0), firstPayback(0)) && near(M.paybackSeconds(alone, 1), firstPayback(1)) && near(M.paybackSeconds(alone, 2), firstPayback(2)) &&
      M.paybackLine(alone, 0) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(0)) + '.' &&
      M.paybackLine(alone, 1) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(1)) + '.' &&
      M.paybackLine(alone, 2) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(2)) + '.');
    var busy = M.fresh();
    busy.stalls[0].hired = true;
    busy.stalls[0].owned = 100;
    busy.stalls[1].hired = true;
    busy.stalls[2].hired = true;
    var busyIncome = M.income(busy);
    var wrongDumpling = Math.max(1, Math.ceil(M.STALLS[1].base / busyIncome));
    var wrongLantern = Math.max(1, Math.ceil(M.STALLS[2].base / busyIncome));
    check('a busy lane still shows each stall its own payback',
      busyIncome === M.STALLS[0].rate * 100 * Idle.milestoneMult(100) &&
      wrongDumpling < M.paybackSeconds(busy, 1) && wrongLantern < M.paybackSeconds(busy, 2) &&
      near(M.paybackSeconds(busy, 1), firstPayback(1)) && near(M.paybackSeconds(busy, 2), firstPayback(2)) &&
      M.paybackLine(busy, 1) !== M.paybackLine(busy, 2));
    var jump = M.fresh();
    jump.stalls[0].hired = true;
    jump.stalls[0].owned = 24;
    var jumpCost = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 24, 1);
    var jumpAdded = M.STALLS[0].rate * 25 * Idle.milestoneMult(25) - M.STALLS[0].rate * 24 * Idle.milestoneMult(24);
    check('the 25th tea stall counts the income that purchase adds', jumpAdded > M.STALLS[0].rate && near(M.paybackSeconds(jump, 0), jumpCost / jumpAdded));
    check('times show whole seconds: 22.04 reads "22s", never "22.0s"', M.paybackLabel(22.04) === '22s' && M.paybackLabel(21.96) === '22s' && M.paybackLabel(9.6) === '10s' && M.paybackLabel(0.3) === '1s' && !/\.0s/.test(M.paybackLabel(22.0)) && M.paybackLabel(59.4) === '59s' && M.paybackLabel(100) === Arcade.fmtTime(100));
    var mat = M.fresh();
    mat.stalls[5].hired = true;
    check('a long payback uses Arcade.fmtTime', near(M.paybackSeconds(mat, 5), firstPayback(5)) && M.paybackLine(mat, 5) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(5)) + '.' && Arcade.fmtTime(100) === '1m 40s');

    var fresh = M.fresh();
    check('a new lane starts with you pouring, not with a hire', fresh.stalls.every(function (s) { return s.owned === 0 && !s.hired && s.serves === 0; }) && /Hold to pour/.test(M.goal(fresh)) && /Mei/.test(M.goal(fresh)) && /25 more cups/.test(M.goal(fresh)));
    check('the dumpling cart is shuttered', M.handSell(fresh, 1).ok === false && M.hire(fresh, 1).ok === false);
    fresh.cash = 1e9;
    check('coins cannot buy a stall before someone is hired', M.buy(fresh, 0, 'max').ok === false && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    fresh.cash = 0;
    for (var i = 0; i < 24; i++) M.handSell(fresh, 0);
    check('24 cups are not a hire', fresh.stalls[0].serves === 24 && fresh.cash === 24 && M.canHire(fresh, 0) === false && M.hire(fresh, 0).reason === 'serves');
    M.handSell(fresh, 0);
    check('the 25th cup lets Mei take the stall', M.canHire(fresh, 0) && M.hire(fresh, 0).ok && fresh.stalls[0].hired && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    check('the first tea stall costs its base price', near(M.quote(fresh, 0, 1).cost, M.STALLS[0].base) && M.buy(fresh, 0, 1).ok && fresh.stalls[0].owned === 1 && fresh.cash === 25 - M.STALLS[0].base);
    check('one tea stall earns its rate, with no extra bonus', M.production(fresh, 0) === M.STALLS[0].rate && M.income(fresh) === M.STALLS[0].rate);

    var bulk = M.fresh();
    bulk.stalls[0].hired = true;
    bulk.cash = 1000;
    var ten = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 0, 10);
    check('buy 10 uses the shared bulk price', M.buy(bulk, 0, 10).ok && bulk.stalls[0].owned === 10 && near(1000 - bulk.cash, ten));
    var room = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 10, 6);
    bulk.cash = room;
    var bought = M.buy(bulk, 0, 'max');
    check('buy max spends only what the next stalls cost', bought.ok && bought.count === 6 && bulk.stalls[0].owned === 16 && bulk.cash === 0);
    check('ten tea stalls open the dumpling cart', M.unlocked(bulk, 1) && M.handSell(bulk, 1).ok);
    var shut = M.fresh();
    shut.stalls[0].owned = 9;
    shut.stalls[0].hired = true;
    check('nine tea stalls keep the cart shut', M.unlocked(shut, 1) === false);

    [24, 25, 50, 100].forEach(function (owned) {
      var s = M.fresh();
      s.stalls[0].hired = true;
      s.stalls[0].owned = owned;
      var mult = Idle.milestoneMult(owned);
      check(owned + ' tea stalls earn the milestone and nothing else', M.production(s, 0) === M.STALLS[0].rate * owned * mult && M.income(s) === M.production(s, 0));
    });
    var dressed = M.fresh();
    dressed.stalls[0].hired = true;
    dressed.stalls[0].owned = 25;
    check('25 stalls change the lane', /Two lanterns/.test(M.lookLine(dressed, 0)) && /twice as much/.test(M.lookLine(dressed, 0)));
    dressed.stalls[0].owned = 100;
    check('100 stalls bring the crowd', /crowd at the cups/.test(M.lookLine(dressed, 0)) && /eight times as much/.test(M.lookLine(dressed, 0)));
    check('later doublings stay on this lane and the shared list is unchanged',
      Idle.milestoneMult(150) === 8 && Idle.milestoneMult(400) === 8 &&
      M.stallMult(150) === 16 && M.stallMult(200) === 32 && M.stallMult(300) === 64 && M.stallMult(400) === 128);
    var lane = M.fresh();
    lane.stalls.forEach(function (s) { s.hired = true; s.owned = 9; });
    check('nine of every stall leaves the lane dark', M.laneMult(lane) === 1 && M.laneLine(lane) === 'Lane goal: 9/10 on tea through incense.');
    lane.stalls.forEach(function (s) { s.owned = 10; });
    check('ten of every stall lights the whole lane once', M.laneMult(lane) === 2 && M.laneLine(lane) === 'The whole lane is lit. Lane goal: 10/25 on tea through incense.');
    lane.stalls.forEach(function (s) { s.owned = 25; });
    check('twenty-five of every stall lights the lane again', M.laneMult(lane) === 2.5);
    lane.stalls.forEach(function (s) { s.owned = 50; });
    check('fifty of every stall is the last lane light, and the goal names the next doubling', M.laneMult(lane) === 3.2 && M.laneLine(lane) === 'The whole lane is lit. Lane goal: 50/100 on tea through incense.');
    check('a lit lane says so once, on the lane goal', M.laneLine(lane).split('The whole lane is lit').length === 2 && M.lookLine(lane, 0).indexOf('The whole lane is lit') < 0);
    lane.stalls.forEach(function (s) { s.owned = 100; });
    check('past 100 the lane names 150 and does not multiply again', M.laneMult(lane) === 3.2 && M.laneLine(lane) === 'The whole lane is lit. Lane goal: 100/150 on tea through incense.');
    lane.stalls.forEach(function (s) { s.owned = 50; });
    lane.stalls[5].owned = 0;
    check('a new Story Mat does not put the lane back to 0/10', M.lowestOwned(lane) === 50 && M.laneMult(lane) === 3.2 && M.laneLine(lane) === 'The whole lane is lit. Lane goal: 50/100 on tea through incense.');
    var freshLane = M.fresh();
    check('the lane goal is on screen from the first minute', M.laneLine(freshLane) === 'Lane goal: 0/10 on tea through incense.');
    var litTea = M.fresh();
    litTea.stalls.forEach(function (s) { s.hired = true; s.owned = 10; });
    litTea.stalls[0].owned = 150;
    check('a 150th stall stacks its own doubling on the lane light',
      M.production(litTea, 0) === M.STALLS[0].rate * 150 * 16 * 2);
    var toward = M.fresh();
    toward.stalls[0].hired = true;
    toward.stalls[0].owned = 20;
    toward.bulk = 'next';
    toward.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 20, 5);
    check('Next buys exactly the copies to the following doubling',
      M.countToNext(20) === 5 && M.quote(toward, 0, 'next').count === 5 && M.buy(toward, 0, 'next').ok && toward.stalls[0].owned === 25 && toward.cash === 0);
    var partial = M.fresh();
    partial.stalls[0].hired = true;
    partial.stalls[0].owned = 20;
    partial.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 20, 2);
    check('Next buys as many as you can afford toward the goal, and stays quiet when you cannot buy one',
      M.quote(partial, 0, 'next').count === 2 && M.buy(partial, 0, 'next').ok && partial.stalls[0].owned === 22 && partial.cash === 0 &&
      M.quote(partial, 0, 'next').count === 0);
    var capped = M.fresh();
    capped.stalls[0].hired = true; capped.stalls[0].owned = 10;
    capped.stalls[1].hired = true; capped.stalls[1].owned = 10;
    capped.stalls[2].hired = true;
    capped.stalls[2].owned = 25;
    capped.cash = 1e15;
    var cappedQuote = M.quote(capped, 2, 'max');
    check('Max stops at the next doubling, and that buy pays for itself within five minutes (' + cappedQuote.count + ')',
      cappedQuote.count > 0 && cappedQuote.count <= 25 && M.paybackSeconds(capped, 2, cappedQuote.count) <= M.PAYBACK_CAP);
    var teaMax = M.fresh();
    teaMax.stalls[0].hired = true;
    teaMax.stalls[0].owned = 10;
    teaMax.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 10, 6);
    check('Max of a short tea run still buys the six you can afford', M.quote(teaMax, 0, 'max').count === 6);
    var greyNext = M.fresh();
    greyNext.stalls[0].hired = true;
    greyNext.stalls[0].owned = 20;
    greyNext.cash = 0;
    var greyQuote = M.quote(greyNext, 0, 'next');
    check('a greyed Next prices the next single cup, not the whole run to 25',
      greyQuote.count === 0 && greyQuote.cost === Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 20, 1) && M.countToNext(20) === 5);
    var longMax = M.fresh();
    longMax.stalls[0].hired = true;
    longMax.stalls[0].owned = 200;
    longMax.cash = 1e12;
    var longQuote = M.quote(longMax, 0, 'max');
    check('Max names a long payback instead of offering a buy it will not make',
      longQuote.count === 0 && longQuote.blocked === 'payback' && longQuote.cost < longMax.cash);
    var heldCoins = M.fresh();
    heldCoins.stalls[0].hired = true;
    heldCoins.stalls[0].owned = 100;
    var beforeHold = heldCoins.cash;
    var credit = M.holdCredit(1, 0);
    for (var hp = 0; hp < credit.pours; hp++) M.handSell(heldCoins, 0);
    check('one second of holding is a top-up under the stalls (' + Math.round(heldCoins.cash - beforeHold) + ' against ' + Math.round(M.income(heldCoins)) + '/s)',
      credit.pours === Math.floor(M.HOLD_PER_SEC) && heldCoins.cash - beforeHold < M.income(heldCoins) && M.holdCredit(30, 0).pours === Math.floor(M.HOLD_PER_SEC));
    check('every hired stall names its next doubling',
      M.nextGoalLine(toward, 0) === 'Next goal: 50 Tea Stalls, x2.');
    var mats = M.fresh();
    mats.stalls[5].hired = true;
    mats.stalls[5].owned = 9;
    check('nine Story Mats name Old Wen\'s last chapter as the next goal',
      M.CHAPTERS.length === 10 && M.CHAPTERS[9].title === "Old Wen's last chapter" &&
      M.nextGoalLine(mats, 5) === 'Next goal: 10 Story Mats. Old Wen\'s last chapter.' &&
      M.chapterLine(mats) === 'Chapter 9 of 10: The crowd holds still.' && !M.finaleReached(mats));
    mats.stalls[5].owned = 5;
    check('chapter 5 names its own line', M.chapterLine(mats) === 'Chapter 5 of 10: A light on the path.');
    mats.stalls[5].owned = 8;
    check('chapter 8 names its own line', M.chapterLine(mats) === 'Chapter 8 of 10: The paper screen.');
    mats.stalls[5].owned = 10;
    check('the tenth Story Mat is Old Wen\'s last chapter',
      M.finaleReached(mats) && M.finaleCopy().title === "Old Wen's last chapter" &&
      M.finaleCopy().choice === 'Keep the lane open' && /lanterns over the lane go out/.test(M.finaleCopy().lead) &&
      M.chapterLine(mats) === "Old Wen's last chapter is told.");
    mats.stalls[5].owned = 11;
    check('the eleventh Story Mat keeps a short line', M.chapterLine(mats) === 'Old Wen tells it again.');
    mats.stalls[5].owned = 14;
    check('later Story Mats repeat that line', M.chapterLine(mats) === 'Old Wen tells it again.');

    var plain = M.fresh();
    check('a waiting omen leaves the approved prices alone',
      plain.night.offer && plain.night.offer.options.length === 3 && plain.night.omen === null &&
      M.cost(0, 0, 1, plain) === M.STALLS[0].base && M.cost(5, 0, 1, plain) === 2200000 &&
      M.STALLS[5].base === 2200000 && M.STALLS[5].growth === 1.36 && M.STALLS[5].rate === 2200);
    var again = M.fresh();
    M.armNight(again, 1, 4);
    var twin = M.fresh();
    M.armNight(twin, 1, 4);
    check('the same seed offers the same three omens', again.night.offer.options.join(',') === twin.night.offer.options.join(','));
    var otherOffers = [2, 3, 5, 8].map(function (seed) {
      var sample = M.fresh();
      M.armNight(sample, 1, seed);
      return sample.night.offer.options.join(',');
    });
    check('another seed can offer a different omen', otherOffers.some(function (row) { return row !== again.night.offer.options.join(','); }));
    var rain = M.fresh();
    rain.night.omen = 'rain';
    rain.stalls[0].hired = true;
    rain.stalls[0].owned = 1;
    check('rain changes the lantern price and the tea rate', near(M.cost(2, 0, 1, rain), 770) && near(M.production(rain, 0), 0.52) && M.cost(2, 0, 1, plain) === 700);
    var ferry = M.fresh();
    ferry.night.omen = 'ferry';
    ferry.stalls[1].hired = true;
    ferry.stalls[1].owned = 1;
    check('the ferry crowd speeds dumplings, raises mooncakes, and shortens the away box',
      M.awayRule(ferry) === 'While away: earns 75%, up to 2h' && M.awayRule(plain) === 'While away: earns 50%, up to 4h' &&
      near(M.production(ferry, 1), 1.05) && near(M.cost(3, 0, 1, ferry), 7360) && M.cost(0, 0, 1, ferry) === M.STALLS[0].base);
    var wick = M.fresh();
    wick.night.omen = 'wick';
    check('a short wick lowers the Story Mat price', near(M.cost(5, 0, 1, wick), 1760000) && M.STALLS[5].base === 2200000);
    var festival = M.fresh();
    festival.night.omen = 'mooncake';
    festival.stalls[2].owned = 6;
    check('the mooncake festival opens Qiao at six lantern stands', M.unlocked(festival, 3) && !M.unlocked(plain, 3));
    plain.stalls[2].owned = 6;
    check('six lantern stands stay closed on the default night', !M.unlocked(plain, 3));
    var pour = M.fresh();
    pour.night.omen = 'pour';
    pour.stalls[0].hired = true;
    pour.stalls[0].owned = 1;
    check('a long pour asks for thirty cups and a faster tea stall', M.servesNeed(pour, 0) === 30 && M.cost(0, 0, 1, pour) === 6 && near(M.production(pour, 0), 0.52) && M.servesNeed(plain, 0) === 25);
    var charm = M.fresh();
    charm.night.charms = ['wen-discount'];
    check('a charm changes the mat price and not the catalogue', near(M.cost(5, 0, 1, charm), 1870000) && M.STALLS[5].base === 2200000);
    var tray = M.fresh();
    tray.stalls[4].hired = true;
    tray.stalls[4].owned = 10;
    var trayBefore = M.cost(4, 10, 1, tray);
    var renLine = M.offerLine(tray, M.charmById('ren-sticks'));
    tray.night.charms = ['ren-sticks'];
    var trayAfter = M.cost(4, 10, 1, tray);
    check('Ren\'s sticks cuts the live tray price by 15% and the line says both prices',
      near(trayAfter, trayBefore * 0.85) && renLine.indexOf(Arcade.fmt(trayBefore)) >= 0 && renLine.indexOf(Arcade.fmt(trayAfter)) >= 0 && /15% cheaper/.test(renLine));
    var alleyNight = M.fresh();
    alleyNight.night.omen = 'alley';
    var alleyBefore = M.cost(0, 0, 1, alleyNight);
    alleyNight.night.charms = ['mei-regulars'];
    var alleyAfter = M.cost(0, 0, 1, alleyNight);
    alleyNight.night.charms = [];
    check('Quiet alley still lets Mei\'s regulars lower tonight\'s tea price', alleyAfter < alleyBefore && M.charmUseful(alleyNight, M.charmById('mei-regulars')));
    var omenPriceProblems = [];
    M.OMENS.forEach(function (omen) {
      M.CHARMS.forEach(function (charm) {
        var patch = charm.set && charm.set[charm.stall];
        if (!patch || patch.base == null) return;
        var sample = M.fresh();
        sample.night.omen = omen.id;
        if (!M.charmUseful(sample, charm)) return;
        var ix = 0;
        while (M.STALLS[ix].id !== charm.stall) ix++;
        var beforePrice = M.cost(ix, 0, 1, sample);
        var priced = M.fresh();
        priced.night.omen = omen.id;
        priced.night.charms = [charm.id];
        var afterPrice = M.cost(ix, 0, 1, priced);
        var shown = M.offerLine(sample, charm);
        var pct = beforePrice > 0 ? Math.round((1 - afterPrice / beforePrice) * 100) : 0;
        var said = shown.match(/(\d+)% (?:less|cheaper)/);
        if (!(Math.abs(beforePrice - afterPrice) > 0.01) || !said || +said[1] !== pct) {
          omenPriceProblems.push(omen.id + ' ' + charm.id + ' ' + beforePrice + '→' + afterPrice + ' line ' + shown);
        }

    });
    check(anchorProblems.length ? 'anchor jump clears the pin: ' + anchorProblems.join(' | ') : 'jumping to the stalls from the top clears the pin at five sizes', anchorProblems.length === 0);

    var directProblems = [];

          var pinBox = pin.getBoundingClientRect();
          var vert = Math.min(pinBox.bottom, laneBox.bottom) - Math.max(pinBox.top, laneBox.top);

        }

      pm.state.stalls[0].hired = false; pm.state.stalls[0].serves = 3; pm.state.stalls[0].owned = 0;
      pm.render();
      var pour = pd.querySelector('#stalls [data-i="0"] .pour');

      }

    pm.state.stalls.forEach(function (s) { s.hired = false; s.owned = 0; s.serves = 0; });

    var fold = pd.querySelector('#goal').getBoundingClientRect();
    check('a short landscape screen still shows the goal above the fold', fold.height > 0 && fold.top >= 0 && fold.bottom <= 390);

    pinFrame.remove();

    localStorage.removeItem(KEY);
    var focusFrame = await openLane('../games/night-market/index.html', 390, 844);
    var fw = focusFrame.contentWindow, fd = fw.document, fm = fw.__nightMarket;
    await new Promise(function (r) { setTimeout(r, 50); });
    fm.idle.stop();
    var omenButton = fd.querySelector('#pick-choices button');
    var omenPanel = fd.querySelector('#pick-panel');
    check('an omen choice is on screen', !!omenButton);
    check('the omen pick is a labelled modal',
      omenPanel.getAttribute('role') === 'dialog' && omenPanel.getAttribute('aria-modal') === 'true' && omenPanel.getAttribute('aria-labelledby') === 'pick-lead');
    check('the omen pick focuses its first option', fd.activeElement === omenButton);
    omenButton.click();
    check('choosing an omen moves focus to the pour or the next offer',
      fd.activeElement && fd.activeElement !== fd.body &&
      (fd.activeElement.dataset.act === 'serve' || fd.activeElement.dataset.act === 'charm' || fd.activeElement.dataset.act === 'omen' || fd.activeElement.id === 'pick-lead'));
    fm.state.stalls[0].hired = true; fm.state.stalls[0].owned = 8;
    fm.state.stalls[1].hired = true; fm.state.stalls[1].owned = 4;
    fm.state.stalls[2].hired = true; fm.state.stalls[2].owned = 2;
    fm.state.night.offer = { kind: 'charm', stall: 'dumpling', options: ['mei-regulars', 'an-paper', 'bo-queue'] };
    fm.state.night.rerollUsed = false;
    fm.render();
    check('the charm lead names the charms on offer',
      fd.querySelector('#pick-lead').textContent === "Pick a charm for tonight, or skip: Mei's regulars, An's paper, or Bo's queue.");
    fd.querySelector('[data-act="skip"]').click();
    check('skip moves focus to a control', fd.activeElement && fd.activeElement !== fd.body && fd.activeElement !== fd.documentElement);
    fm.state.night.offer = { kind: 'charm', stall: 'lantern', options: ['an-paper', 'wen-discount', 'bo-queue'] };
    fm.state.night.rerollUsed = false;
    fm.render();
    fd.querySelector('[data-act="reroll"]').click();
    check('reroll focuses the new first choice', fd.activeElement && fd.activeElement.dataset.act === 'charm');
    var pourFocus = fd.querySelector('#stalls [data-i="0"] [data-act="serve"]');
    pourFocus.focus();
    fm.state.stalls[0].hired = true;
    fm.state.stalls[0].owned = 8;
    fm.state.stalls[2].hired = true;
    fm.state.stalls[2].owned = 2;
    fm.state.stalls[4].hired = true;
    fm.state.stalls[4].owned = 2;
    fm.state.stalls[5].hired = true;
    fm.state.stalls[5].owned = 1;
    fm.state.night.offer = { kind: 'charm', stall: 'incense', options: ['ren-sticks', 'wen-discount', 'an-offcuts'] };
    fm.state.night.rerollUsed = false;
    fm.render();
    var modalPanel = fd.querySelector('#pick-panel');
    var modalFirst = fd.querySelector('#pick-choices button');
    check('a charm offer is a labelled modal',
      modalPanel.getAttribute('role') === 'dialog' && modalPanel.getAttribute('aria-modal') === 'true' && modalPanel.getAttribute('aria-labelledby') === 'pick-lead' && !fd.querySelector('#pick-backdrop').hidden);
    check('opening a charm offer focuses the first option', fd.activeElement === modalFirst);
    check('the lane behind an offer is inert',
      pourFocus.closest('.stall').inert === true && fd.querySelector('.lane').inert === true && fd.querySelector('#bulk').inert === true && fd.querySelector('header').inert === true);
    var frozenCoins = fm.state.cash;
    await wait(800);
    check('coins stay still while an offer is open', fm.state.cash === frozenCoins);
    var modalLast = modalPanel.querySelector('[data-act="reroll"]');
    modalLast.focus();
    fd.dispatchEvent(new fw.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
    var tabWrapped = fd.activeElement === modalFirst;
    modalFirst.focus();
    fd.dispatchEvent(new fw.KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, bubbles: true, cancelable: true }));
    check('tab stays inside the offer', tabWrapped && fd.activeElement === modalLast);
    fd.dispatchEvent(new fw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    check('escape skips the offer', !fm.state.night.offer && fm.state.night.charms.indexOf('ren-sticks') < 0);
    check('escape returns focus to the control that opened it', fd.activeElement === pourFocus);
    check('the lane accepts play again once the offer closes', pourFocus.closest('.stall').inert === false && fd.querySelector('.lane').inert === false && fd.querySelector('#pick-backdrop').hidden);
    var resumedCoins = fm.state.cash;
    var resumedAt = Date.now();
    await wait(700);
    var resumedFor = (Date.now() - resumedAt) / 1000;
    var resumedGain = fm.state.cash - resumedCoins;
    check('income resumes after the offer with no catch-up for the pause',
      resumedGain > 0 && resumedGain < fw.NightMarket.income(fm.state) * (resumedFor + 0.35));
    var modalFit = [];
    [[320, 568], [390, 844], [844, 390], [1280, 800]].forEach(function (size) {
      focusFrame.style.width = size[0] + 'px';
      focusFrame.style.height = size[1] + 'px';
      ['charm', 'omen'].forEach(function (kind) {
        fm.state.night.offer = kind === 'omen'
          ? { kind: 'omen', stall: null, options: ['rain', 'ferry', 'alley'] }
          : { kind: 'charm', stall: 'dumpling', options: ['mei-regulars', 'an-offcuts', 'ren-sticks'] };
        fm.state.night.rerollUsed = false;
        fm.render();
        var box = fd.querySelector('#pick-panel').getBoundingClientRect();
        var viewW = fd.documentElement.clientWidth, viewH = fd.documentElement.clientHeight;
        if (box.top < -1 || box.left < -1 || box.bottom > viewH + 1 || box.right > viewW + 1 || box.height < 44 || box.width < 44) {
          modalFit.push(size[0] + 'x' + size[1] + ' ' + kind + ' ' + Math.round(box.left) + ',' + Math.round(box.top) + ' ' + Math.round(box.right) + 'x' + Math.round(box.bottom) + ' view ' + viewW + 'x' + viewH);
        }
      });
    });
    fm.state.night.offer = null;
    fm.render();
    check(modalFit.length ? 'offer sits off screen: ' + modalFit.join(' | ') : 'the offer opens fully on screen at 320, 390×844, 844×390 and desktop', modalFit.length === 0);
    fm.state.stalls.forEach(function (s, i) { s.hired = true; s.owned = i === 4 ? 12 : 2; });
    fm.state.stalls[5].owned = 1;
    fm.state.night.kept = false;
    fw.NightLane.setReduce(true);
    fm.render();
    await new Promise(function (r) { setTimeout(r, 450); });
    fm.render();

    check('the Lantern Book is inside Your save', !!fd.querySelector('details.save details.codex'));
    focusFrame.style.height = '520px';
    fw.scrollTo(0, 480);
    var scrollBefore = fw.scrollY;

    check('next night focuses the new omen', fd.activeElement && (fd.activeElement.dataset.act === 'omen' || fd.activeElement.id === 'pick-lead'));
    fm.idle.stop();
    var clearedAway = fm.idle.start(Date.now() - 5 * 3600 * 1000);
    check('next night restores the four hour away box', clearedAway && clearedAway.credited === 4 * 3600);
    fm.idle.stop();
    fm.state.night.omen = 'ferry';

    fm.state.stalls[0].owned = 10;
    var cashBeforeRebind = fm.state.cash;
    fm.rebind();
    check('rebuilding the away box does not pay it twice', Math.abs(fm.state.cash - cashBeforeRebind) < 1);
    fm.idle.stop();
    var ferryAwayLive = fm.idle.start(Date.now() - 5 * 3600 * 1000);
    check('picking Ferry crowd rebuilds this session\'s away box at two hours',
      ferryAwayLive && ferryAwayLive.capped && ferryAwayLive.credited === 2 * 3600 &&
      near(ferryAwayLive.gained, fw.NightMarket.income(fm.state) * 2 * 3600 * 0.75));
    focusFrame.remove();

    var dawnSave = M.fresh();
    dawnSave.stalls.forEach(function (s, i) { s.hired = true; s.owned = i === 4 ? 12 : 4; });
    dawnSave.stalls[5].owned = 1;
    dawnSave.cash = 84800;
    dawnSave.lifetime = 84800;
    var dawnIncome = M.income(dawnSave);
    localStorage.setItem(KEY, JSON.stringify(M.serialize(dawnSave, Date.now() - 3600 * 1000)));
    var dawnFrame = await openLane('../games/night-market/index.html', 390, 700);
    await new Promise(function (r) { setTimeout(r, 250); });
    var dawnWindow = dawnFrame.contentWindow;
    var dawnCash = dawnWindow.__nightMarket.state.cash;
    var oneAway = dawnIncome * 3600 * 0.5;
    check('reloading at dawn shows the card at once', !dawnFrame.contentDocument.querySelector('#finale').hidden);
    var dawnFirst = dawnFrame.contentDocument.querySelector('#finale').getBoundingClientRect();
    check('reloading at dawn scrolls the card into view once', dawnFirst.top >= -2 && dawnFirst.bottom <= 702);
    dawnWindow.scrollTo(0, 4000);
    var dawnHeld = dawnWindow.scrollY;
    await wait(900);
    check('scrolling away at dawn stays put', Math.abs(dawnWindow.scrollY - dawnHeld) < 4);
    check('reloading at dawn does not add coins after the night has ended (' + Math.round(dawnCash - 84800) + ' coins)',
      Math.abs(dawnCash - 84800) < 1);
    dawnFrame.remove();

    var dawnScrollProblems = [];
    var dawnSizes = [[360, 780], [390, 844], [844, 390], [1280, 800]];
    for (var ds = 0; ds < dawnSizes.length; ds++) {
      var dw = dawnSizes[ds][0], dh = dawnSizes[ds][1];
      var dFrame = await openLane('../games/night-market/index.html', dw, dh);
      var dWin = dFrame.contentWindow, dDoc = dWin.document, dGame = dWin.__nightMarket;
      dGame.idle.stop();
      dGame.state.stalls.forEach(function (s, i) { s.hired = true; s.owned = i === 4 ? 12 : 2; s.serves = 30; });
      dGame.state.stalls[5].owned = 1;
      dGame.state.night.kept = false;
      dWin.NightLane.setReduce(true);
      dGame.render();
      await wait(480);
      var dCard = dDoc.querySelector('#finale');
      var dBox = dCard.getBoundingClientRect();
      if (dCard.hidden || dBox.top < -2 || dBox.bottom > dh + 2) {
        dawnScrollProblems.push(dw + 'x' + dh + ' first top ' + Math.round(dBox.top));
      }
      dWin.scrollTo(0, 2500);
      var heldY = dWin.scrollY;
      await wait(800);
      if (Math.abs(dWin.scrollY - heldY) > 4) dawnScrollProblems.push(dw + 'x' + dh + ' jumped ' + Math.round(dWin.scrollY - heldY));
      dFrame.remove();
    }
    check(dawnScrollProblems.length ? 'the dawn card stays off screen: ' + dawnScrollProblems.join(' | ') : 'the dawn card scrolls into view from the bottom at 360, 390, 844×390 and desktop', dawnScrollProblems.length === 0);

    var saveFrame = await openLane('../games/night-market/index.html', 390, 844);
    var swin = saveFrame.contentWindow, sdoc = swin.document, sm = swin.__nightMarket;
    var saveBox = sdoc.querySelector('details.save');
    saveBox.open = true;
    sm.drawTools();
    var backup = sdoc.querySelector('.arc-bk');
    var backupSummary = backup.querySelector('summary');
    var closedMark = swin.getComputedStyle(backupSummary, '::before').content || '';
    backup.open = true;
    var openMark = swin.getComputedStyle(backupSummary, '::before').content || '';
    check('Automatic backups uses the same disclosure marker as Your save', /▸/.test(closedMark) && /▾/.test(openMark));
    saveFrame.remove();

    Object.keys(localStorage).forEach(function (k) {
      if (k === KEY || k.indexOf('arcade-backup:' + KEY) === 0) localStorage.removeItem(k);
    });
    check('other saves are left alone', Object.keys(localStorage).slice().sort().join('|') === before);
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    if (frame) frame.remove();
    button.disabled = false;
  }
};
