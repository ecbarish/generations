<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Night Market checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#161326;color:#f4efe6;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#9ee7ba}.fail{color:#ff9a9a}#summary{font-weight:bold}
  iframe{width:375px;height:700px;border:0;background:#f4efe6}
</style>
<h1>Night Market checks</h1>
<p>Economy, the capped welcome back, and the real stall buttons. No hall entry.</p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<div id="game"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script src="../games/night-market/model.js"></script>
<script src="../tools/night-market-pacing.cjs"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var M = window.NightMarket;
  var KEY = M.SAVE_KEY;
  var before = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function near(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function work(state) {
    for (var i = 0; i < M.STALLS.length; i++) {
      if (!M.unlocked(state, i)) return;
      if (state.stalls[i].hired) continue;
      if (M.canHire(state, i)) { M.hire(state, i); return; }
      M.handSell(state, i);
      if (M.canHire(state, i)) M.hire(state, i);
      return;
    }
  }
  function spend(state) {
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (M.quote(state, i, 'max').count > 0) { M.buy(state, i, 'max'); return; }
    }
  }
  /* One hand action a second, then a second of stall income, then a buy on the cadence.
     Active buys whenever coins allow. Office buys once a minute, the way a tab left open gets a glance. */
  function play(seconds, buyEvery) {
    var state = M.fresh();
    var hireAt = null;
    var tea25 = null;
    var snap = {};
    for (var t = 1; t <= seconds; t++) {
      work(state);
      if (hireAt == null && state.stalls[0].hired) hireAt = t;
      M.addCash(state, M.income(state));
      if (t % buyEvery === 0) spend(state);
      if (tea25 == null && state.stalls[0].owned >= 25) tea25 = t;
      if (t === 600 || t === 1800) snap[t] = { income: M.income(state), owned: state.stalls.map(function (s) { return s.owned; }) };
    }
    return { state: state, hireAt: hireAt, tea25: tea25, snap: snap };
  }
  function frontierSeconds(state) {
    var rate = M.income(state);
    if (!(rate > 0)) return Infinity;
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (!state.stalls[i].hired) continue;
      return Idle.bulkCost(M.STALLS[i].base, M.STALLS[i].growth, state.stalls[i].owned, 1) / rate;
    }
    return Infinity;
  }
  var frame = null;
  try {
    check('six stalls on the shared milestones', M.STALLS.length === 6 && Idle.milestoneMult(25) === 2 && Idle.milestoneMult(50) === 4 && Idle.milestoneMult(100) === 8 && Idle.milestoneMult(24) === 1);
    M.STALLS.forEach(function (s) {
      check(s.name + ' grows gently', s.growth >= 1.05 && s.growth <= 1.15 && s.base > 0 && s.rate > 0 && s.serves > 0);
    });
    check('tea, dumpling and lantern use the measured NM-RETUNE balance',
      M.STALLS[0].base === 5 && M.STALLS[0].growth === 1.11 && M.STALLS[0].rate === 0.5 && M.STALLS[0].serves === 25 && M.STALLS[0].hand === 1 &&
      M.STALLS[1].base === 60 && M.STALLS[1].growth === 1.15 && M.STALLS[1].rate === 0.5 &&
      M.STALLS[2].base === 720 && M.STALLS[2].growth === 1.15 && M.STALLS[2].rate === 2.5);
    check('offline is four hours at half pay', M.OFFLINE_CAP === 4 * 3600 && M.OFFLINE_RATE === 0.5);
    check('the cash-box line states half pay and the cap', M.awayRule() === 'While away: earns 50%, up to 4h');

    var alone = M.fresh();
    [0, 1, 2].forEach(function (i) { alone.stalls[i].hired = true; });
    check('the first tea, dumpling and lantern pay back in 10s, 2m and 4m48s',
      near(M.paybackSeconds(alone, 0), 10) && near(M.paybackSeconds(alone, 1), 120) && near(M.paybackSeconds(alone, 2), 288) &&
      M.paybackLine(alone, 0) === 'The next one pays for itself in 10s.' &&
      M.paybackLine(alone, 1) === 'The next one pays for itself in ' + Arcade.fmtTime(120) + '.' &&
      M.paybackLine(alone, 2) === 'The next one pays for itself in ' + Arcade.fmtTime(288) + '.');
    var busy = M.fresh();
    busy.stalls[0].hired = true;
    busy.stalls[0].owned = 100;
    busy.stalls[1].hired = true;
    busy.stalls[2].hired = true;
    var busyIncome = M.income(busy);
    var oldDumpling = Math.max(1, Math.ceil(60 / busyIncome));
    var oldLantern = Math.max(1, Math.ceil(720 / busyIncome));
    check('a busy lane still shows each stall its own payback',
      busyIncome === 400 && oldDumpling <= 2 && oldLantern <= 2 &&
      near(M.paybackSeconds(busy, 1), 120) && near(M.paybackSeconds(busy, 2), 288) &&
      M.paybackLine(busy, 1) !== M.paybackLine(busy, 2));
    var jump = M.fresh();
    jump.stalls[0].hired = true;
    jump.stalls[0].owned = 24;
    var jumpCost = Idle.bulkCost(5, 1.11, 24, 1);
    var jumpAdded = 0.5 * 25 * Idle.milestoneMult(25) - 0.5 * 24 * Idle.milestoneMult(24);
    check('the 25th tea stall counts the income that purchase adds', jumpAdded > 0.5 && near(M.paybackSeconds(jump, 0), jumpCost / jumpAdded));
    check('times show whole seconds: 22.04 reads "22s", never "22.0s"', M.paybackLabel(22.04) === '22s' && M.paybackLabel(21.96) === '22s' && M.paybackLabel(9.6) === '10s' && M.paybackLabel(0.3) === '1s' && !/\.0s/.test(M.paybackLabel(22.0)) && M.paybackLabel(59.4) === '59s' && M.paybackLabel(100) === Arcade.fmtTime(100));
    var mat = M.fresh();
    mat.stalls[5].hired = true;
    check('a long payback uses Arcade.fmtTime', near(M.paybackSeconds(mat, 5), 4400) && M.paybackLine(mat, 5) === 'The next one pays for itself in ' + Arcade.fmtTime(4400) + '.' && Arcade.fmtTime(100) === '1m 40s');

    var fresh = M.fresh();
    check('a new lane starts with you pouring, not with a hire', fresh.stalls.every(function (s) { return s.owned === 0 && !s.hired && s.serves === 0; }) && /Mei/.test(M.goal(fresh)) && /25 more cups/.test(M.goal(fresh)));
    check('the dumpling cart is shuttered', M.handSell(fresh, 1).ok === false && M.hire(fresh, 1).ok === false);
    fresh.cash = 1e9;
    check('coins cannot buy a stall before someone is hired', M.buy(fresh, 0, 'max').ok === false && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    fresh.cash = 0;
    for (var i = 0; i < 24; i++) M.handSell(fresh, 0);
    check('24 cups are not a hire', fresh.stalls[0].serves === 24 && fresh.cash === 24 && M.canHire(fresh, 0) === false && M.hire(fresh, 0).reason === 'serves');
    M.handSell(fresh, 0);
    check('the 25th cup lets Mei take the stall', M.canHire(fresh, 0) && M.hire(fresh, 0).ok && fresh.stalls[0].hired && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    check('the first tea stall costs 5', near(M.quote(fresh, 0, 1).cost, 5) && M.buy(fresh, 0, 1).ok && fresh.stalls[0].owned === 1 && fresh.cash === 20);
    check('one tea stall earns half a coin a second, with no extra bonus', M.production(fresh, 0) === 0.5 && M.income(fresh) === 0.5);

    var bulk = M.fresh();
    bulk.stalls[0].hired = true;
    bulk.cash = 1000;
    var ten = Idle.bulkCost(5, 1.11, 0, 10);
    check('buy 10 uses the shared bulk price', M.buy(bulk, 0, 10).ok && bulk.stalls[0].owned === 10 && near(1000 - bulk.cash, ten));
    var room = Idle.bulkCost(5, 1.11, 10, 6);
    bulk.cash = room;
    var bought = M.buy(bulk, 0, 'max');
    check('buy max spends only what the next stalls cost', bought.ok && bought.count === 6 && bulk.stalls[0].owned === 16 && bulk.cash === 0);
    check('ten tea stalls open the dumpling cart', M.unlocked(bulk, 1) && M.handSell(bulk, 1).ok);
    var shut = M.fresh();
    shut.stalls[0].owned = 9;
    shut.stalls[0].hired = true;
    check('nine tea stalls keep the cart shut', M.unlocked(shut, 1) === false);

    [24, 25, 50, 100].forEach(function (owned) {
      var s = M.fresh();
      s.stalls[0].hired = true;
      s.stalls[0].owned = owned;
      var mult = Idle.milestoneMult(owned);
      check(owned + ' tea stalls earn the milestone and nothing else', M.production(s, 0) === M.STALLS[0].rate * owned * mult && M.income(s) === M.production(s, 0));
    });
    var dressed = M.fresh();
    dressed.stalls[0].hired = true;
    dressed.stalls[0].owned = 25;
    check('25 stalls change the lane', /Two lanterns/.test(M.lookLine(dressed, 0)) && /twice as much/.test(M.lookLine(dressed, 0)));
    dressed.stalls[0].owned = 100;
    check('100 stalls bring the crowd', /crowd at the cups/.test(M.lookLine(dressed, 0)) && /eight times as much/.test(M.lookLine(dressed, 0)));

    var active = play(1800, 1);
    var a600 = active.snap[600];
    var a1800 = active.snap[1800];
    var aOwned = a1800.owned.filter(function (n) { return n > 0; }).length;
    var aFrontier = frontierSeconds(active.state);
    check('active play hires Mei on the 25th second', active.hireAt === 25);
    check('the tea-stall change at 25 lands inside 10 minutes (at ' + active.tea25 + 's)', active.tea25 != null && active.tea25 <= 600);
    check('half an hour of buying still opens stalls (' + a1800.owned.join(',') + ')', aOwned >= 4 && a1800.owned.some(function (n) { return n >= 25; }) && a1800.owned.some(function (n) { return n < 100; }));
    check('income is still climbing at 30 minutes (' + a600.income.toFixed(1) + ' then ' + a1800.income.toFixed(1) + ')', a1800.income > a600.income && active.state.lifetime < 1000000);
    check('the newest stall is still a real buy (' + aFrontier.toFixed(1) + 's)', aFrontier > 2 && aFrontier < 600);

    var office = play(1800, 60);
    var o600 = office.snap[600];
    var o1800 = office.snap[1800];
    var oOwned = o1800.owned.filter(function (n) { return n > 0; }).length;
    check('a tab left open still hires within a minute', office.hireAt === 25);
    check('glancing once a minute still upgrades through half an hour (' + o1800.owned.join(',') + ')', oOwned >= 3 && o1800.income > o600.income && o1800.owned.some(function (n) { return n < 100; }));

    // Stronger than the old >1,000/s-at-30m assertion: the actual goal now takes an evening.
    ['active', 'saver', 'milestone-saver', 'hold-saver', 'hold-milestone'].forEach(function (profile) {
      var measured = NightMarketPacing.simulate(M, profile);
      check(profile + ': one million arrives in the 45–75 minute active-play target (' + measured.million + 's)', measured.million >= 2700 && measured.million <= 4500);
      check(profile + ': the first tea milestone still lands within ten minutes', measured.tea25 > 0 && measured.tea25 <= 600);
      check(profile + ': no million-coin rush in the first ten minutes', measured.snapshots[600].lifetime < 1000000);
    });
    var teaOnly = NightMarketPacing.simulate(M, 'tea-only');
    check('tea alone cannot bypass the 45-minute lower bound', teaOnly.million >= 2700);
    var glance = NightMarketPacing.simulate(M, 'minute-glance');
    check('minute-glance background buying still progresses to a million within two hours', glance.million >= 2700 && glance.million <= 7200);
    check('all later tiers use the measured rates and bounded growth',
      M.STALLS[3].rate === 5 && M.STALLS[4].rate === 50 && M.STALLS[5].rate === 500 &&
      M.STALLS.slice(1).every(function (stall) { return stall.growth === 1.15; }));
    check('hand payouts and work before hiring stay unchanged',
      M.STALLS.map(function (stall) { return stall.hand; }).join(',') === '1,2,4,8,16,40' &&
      M.STALLS.map(function (stall) { return stall.serves; }).join(',') === '25,12,10,8,8,6');
    var legacy = await (await fetch('../docs/playtests/nm-retune/legacy-v1.json')).json();
    check('a literal pre-retune v1 save still validates', M.valid(legacy));
    var legacyRoundTrip = M.serialize(M.restore(legacy), legacy.seen);
    check('every earned coin, lifetime coin, stall, hire, serve, mode and timestamp survives the old-save round trip', JSON.stringify(legacyRoundTrip) === JSON.stringify(legacy));
    check('save identity and six-stall order remain stable', M.SAVE_KEY === 'night-market-save-v1' && M.SAVE_VERSION === 1 && M.STALLS.map(function (stall) { return stall.id; }).join(',') === 'tea,dumpling,lantern,mooncake,incense,stories');

    var wall = 1700000000000;
    var realNow = Date.now;
    var realSet = window.setInterval;
    var realClear = window.clearInterval;
    var tick = null;
    Date.now = function () { return wall; };
    window.setInterval = function (fn) { tick = fn; return 1; };
    window.clearInterval = function () { tick = null; };
    var title = document.title;
    try {
      var market = M.fresh();
      market.stalls[0].hired = true;
      market.stalls[0].owned = 20;
      var saved = null;
      var idle = M.createIdle(market, function (obj) { saved = obj; });
      var away = idle.start(wall - 30 * 3600 * 1000);
      var copy = M.awayCopy(away);
      check('thirty hours away pays four hours at half rate', away && away.capped && away.credited === 4 * 3600 && near(away.gained, 10 * 4 * 3600 * 0.5) && near(market.cash, away.gained));
      check('the welcome back names the four hour box and the 50% rate', copy.title === 'While you were away' && /four hours/.test(copy.lead) && /50%/.test(copy.lead) && copy.box.indexOf(Arcade.fmt(away.gained)) === 0);
      check('the tab title uses Arcade.fmt', document.title === '+' + Arcade.fmt(10) + '/s · Night Market');
      idle.stop();
      check('stopping the market restores the tab', document.title === title);

      market = M.fresh();
      market.stalls[0].hired = true;
      market.stalls[0].owned = 20;
      idle = M.createIdle(market, function (obj) { saved = obj; Arcade.save(KEY, obj); });
      var hour = idle.start(wall - 3600 * 1000);
      check('one hour away is not capped and pays half', hour && hour.capped === false && hour.credited === 3600 && near(hour.gained, 10 * 3600 * 0.5));
      check('an hour reads as kept time, not the cap, and still states 50%', /four hours/.test(M.awayCopy(hour).lead) === false && /kept/.test(M.awayCopy(hour).lead) && /50%/.test(M.awayCopy(hour).lead));
      wall += 30000;
      tick();
      check('the save callback stamps the clock and the coins', saved && saved.seen === wall && saved.v === 1 && saved.game === 'night-market' && near(saved.cash, hour.gained + 300));
      Arcade.versions[KEY] = M.SAVE_VERSION;
      Arcade.validators[KEY] = M.valid;
      var loaded = M.restore(Arcade.load(KEY));
      check('Arcade.load brings the stall back', loaded.stalls[0].hired && loaded.stalls[0].owned === 20 && loaded.seen === wall);
      idle.stop();

      var ahead = M.serialize(M.fresh(), wall);
      ahead.v = 2;
      ahead.cash = 9;
      localStorage.setItem(KEY, JSON.stringify(ahead));
      var refused = Arcade.load(KEY);
      check('a newer save is refused and left as it was', refused === null && JSON.parse(localStorage.getItem(KEY)).v === 2 && JSON.parse(localStorage.getItem(KEY)).cash === 9);
      check('a refused save is not overwritten', Arcade.save(KEY, M.serialize(M.fresh(), wall)) === false && JSON.parse(localStorage.getItem(KEY)).v === 2);
    } finally {
      Date.now = realNow;
      window.setInterval = realSet;
      window.clearInterval = realClear;
      if (document.title !== title) document.title = title;
    }

    delete Arcade.held[KEY];
    Object.keys(localStorage).forEach(function (k) {
      if (k === KEY || k.indexOf('arcade-backup:' + KEY) === 0) localStorage.removeItem(k);
    });
    // Real-page reload of the literal old-format save. Stop its clock only after loading;
    // preserve owned state and compare any legitimate elapsed earnings rather than zeroing them.
    var legacyForPage = JSON.parse(JSON.stringify(legacy));
    legacyForPage.seen = Date.now();
    localStorage.setItem(KEY, JSON.stringify(legacyForPage));
    async function loadLegacyFrame() {
      frame = document.createElement('iframe');
      frame.title = 'Night Market legacy-save reload';
      frame.src = '../games/night-market/index.html';
      await new Promise(function (resolve, reject) {
        var timer = setTimeout(function () { reject(Error('legacy load timed out')); }, 20000);
        frame.onload = function () { clearTimeout(timer); resolve(); };
        document.querySelector('#game').appendChild(frame);
      });
      var hook = frame.contentWindow.__nightMarket;
      hook.idle.stop();
      return hook;
    }
    var legacyHook = await loadLegacyFrame();
    check('the real page loads every legacy stall and earned balance',
      JSON.stringify(legacyHook.state.stalls) === JSON.stringify(legacy.stalls) &&
      legacyHook.state.cash >= legacy.cash && legacyHook.state.lifetime >= legacy.lifetime && legacyHook.state.bulk === 'max');
    var firstSaved = JSON.parse(localStorage.getItem(KEY));
    frame.remove(); frame = null;
    legacyHook = await loadLegacyFrame();
    check('reloading keeps legacy ownership, hires, serves and previously saved balances',
      JSON.stringify(legacyHook.state.stalls) === JSON.stringify(legacy.stalls) &&
      legacyHook.state.cash >= firstSaved.cash && legacyHook.state.lifetime >= firstSaved.lifetime && legacyHook.state.bulk === 'max');
    frame.remove(); frame = null;

    var back = M.fresh();
    back.stalls[0].hired = true;
    back.stalls[0].owned = 20;
    back.cash = 100;
    back.lifetime = 100;
    localStorage.setItem(KEY, JSON.stringify(M.serialize(back, Date.now() - 2 * 3600 * 1000)));

    frame = document.createElement('iframe');
    frame.title = 'Night Market test instance';
    frame.src = '../games/night-market/index.html';
    await new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(Error('load timed out')); }, 20000);
      frame.onload = function () { clearTimeout(timer); resolve(); };
      document.querySelector('#game').appendChild(frame);
    });
    var w = frame.contentWindow;
    var d = w.document;
    var hook = w.__nightMarket;
    await new Promise(function (r) { setTimeout(r, 50); });
    check('the page shows the welcome back from the save', hook && hook.away() && /While you were away/.test(d.querySelector('#away').textContent) && /36\.0K coins are in the box/.test(d.querySelector('#away').textContent) && /50%/.test(d.querySelector('#away').textContent) && /Mei says/.test(d.querySelector('#away').textContent));
    check('the cash box says away earnings are half', d.querySelector('#away-rule').textContent === 'While away: earns 50%, up to 4h');
    d.querySelector('[data-act="away"]').click();
    check('putting the box away clears the note', d.querySelector('#away').hidden);
    frame.remove();
    frame = null;
    Object.keys(localStorage).forEach(function (k) {
      if (k === KEY || k.indexOf('arcade-backup:' + KEY) === 0) localStorage.removeItem(k);
    });
    frame = document.createElement('iframe');
    frame.title = 'Night Market fresh lane';
    frame.src = '../games/night-market/index.html';
    await new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(Error('fresh load timed out')); }, 20000);
      frame.onload = function () { clearTimeout(timer); resolve(); };
      document.querySelector('#game').appendChild(frame);
    });
    w = frame.contentWindow;
    d = w.document;
    await new Promise(function (r) { setTimeout(r, 40); });
    check('a new market has no welcome back', d.querySelector('#away').hidden && /25 more cups/.test(d.querySelector('#goal').textContent));
    // NM-PHONE: the first real control, not merely a row heading, fits above the fold.
    async function checkPhoneLayout(label) {
      for (var dims of [[320,568], [390,844], [568,320], [844,390], [932,430], [390,844]]) {
        frame.style.width = dims[0] + 'px'; frame.style.height = dims[1] + 'px';
        w.scrollTo(0, 0);
        await new Promise(function (r) { setTimeout(r, 100); });
        var home = d.querySelector('.home'), serve = d.querySelector('#stalls [data-act="serve"]');
        var hr = home.getBoundingClientRect(), sr = serve.getBoundingClientRect();
        function inside(r) { return r.x >= 0 && r.y >= 0 && r.right <= dims[0] + 1 && r.bottom <= dims[1] + 1; }
        function onTop(el, r) { var hit = d.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2); return hit === el || el.contains(hit); }
        // NM-G3: inspect actual type and text geometry, including the off-screen footer.
        var links = d.querySelectorAll('.home, .foot a');
        check(label + ' ' + dims.join('x') + ': both arcade links are present', links.length === 2);
        links.forEach(function (link, i) {
          var prefix = label + ' ' + dims.join('x') + (i === 0 ? ': Back' : ': footer');
          var style = w.getComputedStyle(link), box = link.getBoundingClientRect();
          var range = d.createRange(); range.selectNodeContents(link);
          var lines = Array.from(range.getClientRects()).filter(function (r) { return r.width > 0 && r.height > 0; });
          var lineHeight = parseFloat(style.lineHeight);
          check(prefix + ' computes to at least 16px', parseFloat(style.fontSize) >= 16);
          check(prefix + ' prevents wrapping', style.whiteSpace === 'nowrap');
          check(prefix + ' keeps its 44px target', box.height >= 44);
          check(prefix + ' is one text line in a box shorter than two lines',
            lines.length === 1 && lines[0].height < 2 * lineHeight && box.height < 2 * lineHeight);
          check(prefix + ' text fits the target and the viewport horizontally',
            lines.length === 1 && lines[0].left >= box.left && lines[0].right <= box.right &&
            box.left >= 0 && box.right <= dims[0] + 1 && link.scrollWidth <= link.clientWidth + 1);
        });
        check(label + ' ' + dims.join('x') + ': footer type computes to at least 16px',
          parseFloat(w.getComputedStyle(d.querySelector('.foot')).fontSize) >= 16);
        var cashRect = d.querySelector('.coins').getBoundingClientRect();
        check(label + ' ' + dims.join('x') + ': Back and cash fit beside each other without overlap',
          hr.right <= cashRect.left && Math.abs((hr.top + hr.bottom) / 2 - (cashRect.top + cashRect.bottom) / 2) < 1 &&
          cashRect.right <= dims[0] + 1);
        check(label + ' ' + dims.join('x') + ': Back is a visible 44px target', hr.height >= 44 && inside(hr) && onTop(home, hr));
        check(label + ' ' + dims.join('x') + ': the whole first serve button is above the fold', sr.height >= 44 && inside(sr) && onTop(serve, sr));
        check(label + ' ' + dims.join('x') + ': navigation and work never overlap or spill sideways',
          !(hr.left < sr.right && hr.right > sr.left && hr.top < sr.bottom && hr.bottom > sr.top) && d.documentElement.scrollWidth <= dims[0] + 1);
      }
      frame.style.width = '375px'; frame.style.height = '700px';
      await new Promise(function (r) { setTimeout(r, 100); });
    }
    await checkPhoneLayout('Fresh lane');
