<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Night Market checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#161326;color:#f4efe6;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#9ee7ba}.fail{color:#ff9a9a}#summary{font-weight:bold}
  iframe{width:375px;height:700px;border:0;background:#f4efe6}
</style>
<h1>Night Market checks</h1>
<p>Economy, the capped welcome back, and the real stall buttons. No hall entry.</p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<div id="game"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script src="../games/night-market/model.js"></script>
<script src="../tools/night-market-pacing.cjs"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var M = window.NightMarket;
  var KEY = M.SAVE_KEY;
  var before = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function near(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function work(state) {
    for (var i = 0; i < M.STALLS.length; i++) {
      if (!M.unlocked(state, i)) return;
      if (state.stalls[i].hired) continue;
      if (M.canHire(state, i)) { M.hire(state, i); return; }
      M.handSell(state, i);
      if (M.canHire(state, i)) M.hire(state, i);
      return;
    }
  }
  function spend(state) {
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (M.quote(state, i, 'max').count > 0) { M.buy(state, i, 'max'); return; }
    }
  }
  /* One hand action a second, then a second of stall income, then a buy on the cadence.
     Active buys whenever coins allow. Office buys once a minute, the way a tab left open gets a glance. */
  function play(seconds, buyEvery) {
    var state = M.fresh();
    var hireAt = null;
    var tea25 = null;
    var snap = {};
    for (var t = 1; t <= seconds; t++) {
      work(state);
      if (hireAt == null && state.stalls[0].hired) hireAt = t;
      M.addCash(state, M.income(state));
      if (t % buyEvery === 0) spend(state);
      if (tea25 == null && state.stalls[0].owned >= 25) tea25 = t;
      if (t === 600 || t === 1800) snap[t] = { income: M.income(state), owned: state.stalls.map(function (s) { return s.owned; }) };
    }
    return { state: state, hireAt: hireAt, tea25: tea25, snap: snap };
  }
  function frontierSeconds(state) {
    var rate = M.income(state);
    if (!(rate > 0)) return Infinity;
    for (var i = M.STALLS.length - 1; i >= 0; i--) {
      if (!state.stalls[i].hired) continue;
      return Idle.bulkCost(M.STALLS[i].base, M.STALLS[i].growth, state.stalls[i].owned, 1) / rate;
    }
    return Infinity;
  }
  var frame = null;
  try {
    check('six stalls on the shared milestones', M.STALLS.length === 6 && Idle.milestoneMult(25) === 2 && Idle.milestoneMult(50) === 4 && Idle.milestoneMult(100) === 8 && Idle.milestoneMult(24) === 1);
    M.STALLS.forEach(function (s) {
      check(s.name + ' grows gently', s.growth >= 1.05 && s.growth <= 1.15 && s.base > 0 && s.rate > 0 && s.serves > 0);
    });
    check('tea, dumpling and lantern use the measured NM-FUN-PASS balance',
      M.STALLS[0].base === 6 && M.STALLS[0].growth === 1.07 && M.STALLS[0].rate === 0.45 && M.STALLS[0].serves === 25 && M.STALLS[0].hand === 1 &&
      M.STALLS[1].base === 80 && M.STALLS[1].growth === 1.06 && M.STALLS[1].rate === 0.9 &&
      M.STALLS[2].base === 700 && M.STALLS[2].growth === 1.07 && M.STALLS[2].rate === 5);
    check('offline is four hours at half pay', M.OFFLINE_CAP === 4 * 3600 && M.OFFLINE_RATE === 0.5);
    check('the cash-box line states half pay and the cap', M.awayRule() === 'While away: earns 50%, up to 4h');

    var alone = M.fresh();
    [0, 1, 2].forEach(function (i) { alone.stalls[i].hired = true; });
    function firstPayback(i) { return M.STALLS[i].base / M.STALLS[i].rate; }
    check('the first tea, dumpling and lantern name their own payback',
      near(M.paybackSeconds(alone, 0), firstPayback(0)) && near(M.paybackSeconds(alone, 1), firstPayback(1)) && near(M.paybackSeconds(alone, 2), firstPayback(2)) &&
      M.paybackLine(alone, 0) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(0)) + '.' &&
      M.paybackLine(alone, 1) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(1)) + '.' &&
      M.paybackLine(alone, 2) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(2)) + '.');
    var busy = M.fresh();
    busy.stalls[0].hired = true;
    busy.stalls[0].owned = 100;
    busy.stalls[1].hired = true;
    busy.stalls[2].hired = true;
    var busyIncome = M.income(busy);
    var wrongDumpling = Math.max(1, Math.ceil(M.STALLS[1].base / busyIncome));
    var wrongLantern = Math.max(1, Math.ceil(M.STALLS[2].base / busyIncome));
    check('a busy lane still shows each stall its own payback',
      busyIncome === M.STALLS[0].rate * 100 * Idle.milestoneMult(100) &&
      wrongDumpling < M.paybackSeconds(busy, 1) && wrongLantern < M.paybackSeconds(busy, 2) &&
      near(M.paybackSeconds(busy, 1), firstPayback(1)) && near(M.paybackSeconds(busy, 2), firstPayback(2)) &&
      M.paybackLine(busy, 1) !== M.paybackLine(busy, 2));
    var jump = M.fresh();
    jump.stalls[0].hired = true;
    jump.stalls[0].owned = 24;
    var jumpCost = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 24, 1);
    var jumpAdded = M.STALLS[0].rate * 25 * Idle.milestoneMult(25) - M.STALLS[0].rate * 24 * Idle.milestoneMult(24);
    check('the 25th tea stall counts the income that purchase adds', jumpAdded > M.STALLS[0].rate && near(M.paybackSeconds(jump, 0), jumpCost / jumpAdded));
    check('times show whole seconds: 22.04 reads "22s", never "22.0s"', M.paybackLabel(22.04) === '22s' && M.paybackLabel(21.96) === '22s' && M.paybackLabel(9.6) === '10s' && M.paybackLabel(0.3) === '1s' && !/\.0s/.test(M.paybackLabel(22.0)) && M.paybackLabel(59.4) === '59s' && M.paybackLabel(100) === Arcade.fmtTime(100));
    var mat = M.fresh();
    mat.stalls[5].hired = true;
    check('a long payback uses Arcade.fmtTime', near(M.paybackSeconds(mat, 5), firstPayback(5)) && M.paybackLine(mat, 5) === 'The next one pays for itself in ' + M.paybackLabel(firstPayback(5)) + '.' && Arcade.fmtTime(100) === '1m 40s');

    var fresh = M.fresh();
    check('a new lane starts with you pouring, not with a hire', fresh.stalls.every(function (s) { return s.owned === 0 && !s.hired && s.serves === 0; }) && /Hold to pour/.test(M.goal(fresh)) && /Mei/.test(M.goal(fresh)) && /25 more cups/.test(M.goal(fresh)));
    check('the dumpling cart is shuttered', M.handSell(fresh, 1).ok === false && M.hire(fresh, 1).ok === false);
    fresh.cash = 1e9;
    check('coins cannot buy a stall before someone is hired', M.buy(fresh, 0, 'max').ok === false && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    fresh.cash = 0;
    for (var i = 0; i < 24; i++) M.handSell(fresh, 0);
    check('24 cups are not a hire', fresh.stalls[0].serves === 24 && fresh.cash === 24 && M.canHire(fresh, 0) === false && M.hire(fresh, 0).reason === 'serves');
    M.handSell(fresh, 0);
    check('the 25th cup lets Mei take the stall', M.canHire(fresh, 0) && M.hire(fresh, 0).ok && fresh.stalls[0].hired && fresh.stalls[0].owned === 0 && M.income(fresh) === 0);
    check('the first tea stall costs its base price', near(M.quote(fresh, 0, 1).cost, M.STALLS[0].base) && M.buy(fresh, 0, 1).ok && fresh.stalls[0].owned === 1 && fresh.cash === 25 - M.STALLS[0].base);
    check('one tea stall earns its rate, with no extra bonus', M.production(fresh, 0) === M.STALLS[0].rate && M.income(fresh) === M.STALLS[0].rate);

    var bulk = M.fresh();
    bulk.stalls[0].hired = true;
    bulk.cash = 1000;
    var ten = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 0, 10);
    check('buy 10 uses the shared bulk price', M.buy(bulk, 0, 10).ok && bulk.stalls[0].owned === 10 && near(1000 - bulk.cash, ten));
    var room = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 10, 6);
    bulk.cash = room;
    var bought = M.buy(bulk, 0, 'max');
    check('buy max spends only what the next stalls cost', bought.ok && bought.count === 6 && bulk.stalls[0].owned === 16 && bulk.cash === 0);
    check('ten tea stalls open the dumpling cart', M.unlocked(bulk, 1) && M.handSell(bulk, 1).ok);
    var shut = M.fresh();
    shut.stalls[0].owned = 9;
    shut.stalls[0].hired = true;
    check('nine tea stalls keep the cart shut', M.unlocked(shut, 1) === false);

    [24, 25, 50, 100].forEach(function (owned) {
      var s = M.fresh();
      s.stalls[0].hired = true;
      s.stalls[0].owned = owned;
      var mult = Idle.milestoneMult(owned);
      check(owned + ' tea stalls earn the milestone and nothing else', M.production(s, 0) === M.STALLS[0].rate * owned * mult && M.income(s) === M.production(s, 0));
    });
    var dressed = M.fresh();
    dressed.stalls[0].hired = true;
    dressed.stalls[0].owned = 25;
    check('25 stalls change the lane', /Two lanterns/.test(M.lookLine(dressed, 0)) && /twice as much/.test(M.lookLine(dressed, 0)));
    dressed.stalls[0].owned = 100;
    check('100 stalls bring the crowd', /crowd at the cups/.test(M.lookLine(dressed, 0)) && /eight times as much/.test(M.lookLine(dressed, 0)));
    check('later doublings stay on this lane and the shared list is unchanged',
      Idle.milestoneMult(150) === 8 && Idle.milestoneMult(400) === 8 &&
      M.stallMult(150) === 16 && M.stallMult(200) === 32 && M.stallMult(300) === 64 && M.stallMult(400) === 128);
    var lane = M.fresh();
    lane.stalls.forEach(function (s) { s.hired = true; s.owned = 9; });
    check('nine of every stall leaves the lane dark', M.laneMult(lane) === 1 && M.laneLine(lane) === 'Lane goal: 9/10.');
    lane.stalls.forEach(function (s) { s.owned = 10; });
    check('ten of every stall lights the whole lane once', M.laneMult(lane) === 2 && M.laneLine(lane) === 'The whole lane is lit. Lane goal: 10/25.');
    lane.stalls.forEach(function (s) { s.owned = 25; });
    check('twenty-five of every stall lights the lane again', M.laneMult(lane) === 4);
    lane.stalls.forEach(function (s) { s.owned = 50; });
    check('fifty of every stall is the last lane light', M.laneMult(lane) === 8 && M.laneLine(lane) === 'Lane goal: 50. The whole lane is lit.');
    lane.stalls[5].owned = 0;
    check('a new Story Mat does not put the lane back to 0/10', M.lowestOwned(lane) === 50 && M.laneMult(lane) === 8 && M.laneLine(lane) === 'Lane goal: 50. The whole lane is lit.');
    var freshLane = M.fresh();
    check('the lane goal is on screen from the first minute', M.laneLine(freshLane) === 'Lane goal: 0/10.');
    var litTea = M.fresh();
    litTea.stalls.forEach(function (s) { s.hired = true; s.owned = 10; });
    litTea.stalls[0].owned = 150;
    check('a 150th stall stacks its own doubling on the lane light',
      M.production(litTea, 0) === M.STALLS[0].rate * 150 * 16 * 2);
    var toward = M.fresh();
    toward.stalls[0].hired = true;
    toward.stalls[0].owned = 20;
    toward.bulk = 'next';
    toward.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 20, 5);
    check('Next buys exactly the copies to the following doubling',
      M.countToNext(20) === 5 && M.quote(toward, 0, 'next').count === 5 && M.buy(toward, 0, 'next').ok && toward.stalls[0].owned === 25 && toward.cash === 0);
    var partial = M.fresh();
    partial.stalls[0].hired = true;
    partial.stalls[0].owned = 20;
    partial.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 20, 2);
    check('Next buys as many as you can afford toward the goal, and stays quiet when you cannot buy one',
      M.quote(partial, 0, 'next').count === 2 && M.buy(partial, 0, 'next').ok && partial.stalls[0].owned === 22 && partial.cash === 0 &&
      M.quote(partial, 0, 'next').count === 0);
    var capped = M.fresh();
    capped.stalls[0].hired = true; capped.stalls[0].owned = 10;
    capped.stalls[1].hired = true; capped.stalls[1].owned = 10;
    capped.stalls[2].hired = true;
    capped.stalls[2].owned = 25;
    capped.cash = 1e15;
    var cappedQuote = M.quote(capped, 2, 'max');
    check('Max stops at the next doubling, and that buy pays for itself within five minutes (' + cappedQuote.count + ')',
      cappedQuote.count > 0 && cappedQuote.count <= 25 && M.paybackSeconds(capped, 2, cappedQuote.count) <= M.PAYBACK_CAP);
    var teaMax = M.fresh();
    teaMax.stalls[0].hired = true;
    teaMax.stalls[0].owned = 10;
    teaMax.cash = Idle.bulkCost(M.STALLS[0].base, M.STALLS[0].growth, 10, 6);
    check('Max of a short tea run still buys the six you can afford', M.quote(teaMax, 0, 'max').count === 6);
    var heldCoins = M.fresh();
    heldCoins.stalls[0].hired = true;
    heldCoins.stalls[0].owned = 100;
    var beforeHold = heldCoins.cash;
    var credit = M.holdCredit(1, 0);
    for (var hp = 0; hp < credit.pours; hp++) M.handSell(heldCoins, 0);
    check('one second of holding is a top-up under the stalls (' + Math.round(heldCoins.cash - beforeHold) + ' against ' + Math.round(M.income(heldCoins)) + '/s)',
      credit.pours === Math.floor(M.HOLD_PER_SEC) && heldCoins.cash - beforeHold < M.income(heldCoins) && M.holdCredit(30, 0).pours === Math.floor(M.HOLD_PER_SEC));
    check('every hired stall names its next doubling',
      M.nextGoalLine(toward, 0) === 'Next goal: 50 Tea Stalls, x2.');
    var mats = M.fresh();
    mats.stalls[5].hired = true;
    mats.stalls[5].owned = 9;
    check('nine Story Mats name Old Wen\'s last chapter as the next goal',
      M.CHAPTERS.length === 10 && M.CHAPTERS[9].title === "Old Wen's last chapter" &&
      M.nextGoalLine(mats, 5) === 'Next goal: 10 Story Mats. Old Wen\'s last chapter.' &&
      M.chapterLine(mats) === 'Chapter 9 of 10: The crowd holds still.' && !M.finaleReached(mats));
    mats.stalls[5].owned = 10;
    check('the tenth Story Mat is Old Wen\'s last chapter',
      M.finaleReached(mats) && M.finaleCopy().title === "Old Wen's last chapter" &&
      M.finaleCopy().choice === 'Keep the lane open' && /lanterns over the lane go out/.test(M.finaleCopy().lead) &&
      M.chapterLine(mats) === "Old Wen's last chapter is told.");

    var active = play(1800, 1);
    var a600 = active.snap[600];
    var a1800 = active.snap[1800];
    var aOwned = a1800.owned.filter(function (n) { return n > 0; }).length;
    var aFrontier = frontierSeconds(active.state);
    check('active play hires Mei on the 25th second', active.hireAt === 25);
    check('the tea-stall change at 25 lands inside 10 minutes (at ' + active.tea25 + 's)', active.tea25 != null && active.tea25 <= 600);
    check('half an hour of buying still opens stalls (' + a1800.owned.join(',') + ')', aOwned >= 4 && a1800.owned.some(function (n) { return n >= 25; }) && a1800.owned.some(function (n) { return n < 100; }));
    check('income is still climbing at 30 minutes (' + a600.income.toFixed(1) + ' then ' + a1800.income.toFixed(1) + ')', a1800.income > a600.income);
    check('the newest stall is still a real buy (' + aFrontier.toFixed(1) + 's)', aFrontier > 2 && aFrontier < 600);

    var office = play(1800, 60);
    var o600 = office.snap[600];
    var o1800 = office.snap[1800];
    var oOwned = o1800.owned.filter(function (n) { return n > 0; }).length;
    check('a tab left open still hires within a minute', office.hireAt === 25);
    check('glancing once a minute still upgrades through half an hour (' + o1800.owned.join(',') + ')', oOwned >= 3 && o1800.income > o600.income && o1800.owned.some(function (n) { return n < 100; }));

    var sensible = NightMarketPacing.playSensible(M, 5400);
    var maxWait = sensible.waits.reduce(function (m, n) { return Math.max(m, n); }, 0);
    var maxPay = sensible.paybacks.reduce(function (m, n) { return Math.max(m, n); }, 0);
    check('a sensible buyer reaches one million after the opening quarter hour (' + sensible.marks[1000000] + 's)',
      sensible.marks[1000] < sensible.marks[10000] && sensible.marks[10000] < sensible.marks[100000] &&
      sensible.marks[100000] < sensible.marks[1000000] && sensible.marks[1000000] > 15 * 60 && sensible.marks[1000000] <= 40 * 60);
    check('from minute 6 to 15 the best stall is never more than 90 seconds away (' + maxWait.toFixed(0) + 's)',
      sensible.waits.length > 10 && maxWait <= 90);
    check('purchases in that window pay back within 20 minutes (' + maxPay.toFixed(0) + 's)',
      sensible.paybacks.length > 5 && maxPay <= 20 * 60);
    check('doing it yourself leads past the first minute, and stalls pass a 10-click pace before minute 6 (' + sensible.overtakenAt + 's)',
      sensible.overtakenAt > 60 && sensible.overtakenAt < 360 && sensible.snaps[360].income > sensible.snaps[360].hand);
    var spender = NightMarketPacing.playAffordable(M, 5400);
    var spendPay = spender.paybacks.reduce(function (m, n) { return Math.max(m, n); }, 0);
    check('a buyer who buys any affordable stall reaches 100K inside 15 minutes and a million after that (' + spender.marks[100000] + 's, ' + spender.marks[1000000] + 's)',
      spender.marks[1000] < spender.marks[10000] && spender.marks[10000] < spender.marks[100000] &&
      spender.marks[100000] < 15 * 60 && spender.marks[1000000] > 15 * 60 && spender.marks[1000000] <= 40 * 60);
    check('that buyer\'s longest purchase from minute 6 to 15 stays under 45 minutes (' + Math.round(spendPay) + 's)',
      spender.paybacks.length > 10 && spendPay <= 45 * 60);
    var fastBuyer = NightMarketPacing.playMeasured(M, 3600);
    var humanBuyer = NightMarketPacing.playHuman(M, 3600);
    check('from minute 8 to 15 the fast buyer\'s best payback stays under 5 minutes (' + Math.round(fastBuyer.maxBestPayback8to15) + 's)',
      fastBuyer.maxBestPayback8to15 > 0 && fastBuyer.maxBestPayback8to15 <= 5 * 60);
    check('from minute 8 to 15 the human buyer\'s best payback stays under 5 minutes (' + Math.round(humanBuyer.maxBestPayback8to15) + 's)',
      humanBuyer.maxBestPayback8to15 > 0 && humanBuyer.maxBestPayback8to15 <= 5 * 60);
    check('from minute 8 to 25 the fast buyer\'s best payback stays under 5 minutes (' + Math.round(fastBuyer.maxBestPayback8to25) + 's)',
      fastBuyer.maxBestPayback8to25 > 0 && fastBuyer.maxBestPayback8to25 <= 5 * 60);
    check('from minute 8 to 25 the human buyer\'s best payback stays under 5 minutes (' + Math.round(humanBuyer.maxBestPayback8to25) + 's)',
      humanBuyer.maxBestPayback8to25 > 0 && humanBuyer.maxBestPayback8to25 <= 5 * 60);
    check('the human buyer still reaches a 25 doubling and a 50 awning',
      humanBuyer.bonuses.some(function (b) { return b.mark === 25 && b.at >= 360 && b.at <= 900; }) &&
      humanBuyer.bonuses.some(function (b) { return b.mark === 50 && b.at >= 360 && b.at <= 900; }));
    function lateTargets(label, run) {
      var cov = NightMarketPacing.beatCoverage(run.beats, 900, 3600);
      var s30 = run.snaps[1800], s40 = run.snaps[2400], s60 = run.snaps[3600];
      check(label + ' best payback from minute 15 to 60 stays under 5 minutes (' + Math.round(run.maxBestPayback15to60) + 's)',
        run.maxBestPayback15to60 > 0 && run.maxBestPayback15to60 <= 5 * 60);
      check(label + ' purchase gap from minute 15 to 60 stays within two minutes (' + Math.round(run.purchaseGap15to60) + 's)',
        run.purchaseGap15to60 <= 120);
      check(label + ' has a named beat at least every 5 minutes from minute 15 to 60 (' + Math.round(cov.max) + 's)',
        cov.max > 0 && cov.max <= 5 * 60);
      check(label + ' top stall is at most 70% of income at minute 30 (' + (s30 ? Math.round(s30.topShare * 100) : 'none') + '%)',
        s30 && s30.topShare <= 0.70);
      check(label + ' top stall is at most 60% of income at minute 60 (' + (s60 ? Math.round(s60.topShare * 100) : 'none') + '%)',
        s60 && s60.topShare <= 0.60);
      check(label + ' income at least triples from minute 40 to 60 (' + (s40 ? Math.round(s40.income) : 0) + ' to ' + (s60 ? Math.round(s60.income) : 0) + ')',
        s40 && s60 && s60.income >= s40.income * 3);
    }
    lateTargets('the fast buyer', fastBuyer);
    lateTargets('the human buyer', humanBuyer);
    check('the fast buyer buys the first Story Mat around minute 20 (' + Math.round(fastBuyer.story1) + 's)',
      fastBuyer.story1 >= 18 * 60 && fastBuyer.story1 <= 26 * 60);
    function laneBeforeFinale(label, run) {
      var laneBeat = run.beats.filter(function (b) { return b.name === 'The whole lane lights at 10'; })[0];
      var endBeat = run.beats.filter(function (b) { return b.name === "Old Wen's last chapter"; })[0];
      check(label + ' lights the lane and only later tells the last chapter (' + (laneBeat ? Math.round(laneBeat.at) : 'none') + 's, ' + (endBeat ? Math.round(endBeat.at) : 'none') + 's)',
        laneBeat && endBeat && endBeat.at - laneBeat.at >= 60);
    }
    laneBeforeFinale('the fast buyer', fastBuyer);
    laneBeforeFinale('the human buyer', humanBuyer);
    check('the human buyer reaches Old Wen\'s last chapter between minute 50 and 60 (' + Math.round(humanBuyer.story10) + 's)',
      humanBuyer.story10 >= 50 * 60 && humanBuyer.story10 <= 60 * 60);
    var opened = M.fresh();
    opened.stalls[0].hired = true;
    opened.cash = 25;
    check('25 coins does not ask you to buy the first tea stall when it costs 6', !/Buy the first/.test(M.goal(opened)));
    opened.cash = 0;
    check('with no coins the goal asks for the first tea stall', M.goal(opened) === 'Buy the first Tea Stall. Mei will run it.');
    ['active', 'saver', 'milestone-saver', 'hold-saver', 'hold-milestone'].forEach(function (profile) {
      var measured = NightMarketPacing.simulate(M, profile);

      var m = last.match(/[\d.]+[KMBT]?/);
      return m ? m[0] : '';
    }
    function buttonFits(btn) {
      if (!btn || btn.hidden || btn.offsetParent === null) return { ok: false, text: btn ? btn.textContent : '' };
      var text = btn.textContent || '';
      var price = priceToken(text);
      var range = btn.ownerDocument.createRange();
      range.selectNodeContents(btn);
      var rect = range.getBoundingClientRect();
      var box = btn.getBoundingClientRect();
      var cut = rect.width > 0 && (rect.right > box.right + 1.5 || rect.left < box.left - 1);
      return {
        ok: btn.scrollWidth <= btn.clientWidth + 1 && !cut && !!price && text.indexOf(price) >= 0 && text.indexOf('Best') < 0,
        text: text, price: price, sw: btn.scrollWidth, cw: btn.clientWidth
      };
    }
    var layout = await openLane('../games/night-market/index.html', 1280, 800);
    var lw = layout.contentWindow, ld = lw.document, lm = lw.__nightMarket;
    lm.idle.stop();
    var sizes = [[1280, 800], [844, 390], [390, 844], [820, 1180], [375, 812]];
    var buyProblems = [], handProblems = [], tagProblems = [];
    var savedStall = lw.NightMarket.STALLS.map(function (s) { return { base: s.base, rate: s.rate, growth: s.growth }; });
    function restoreStalls() {
      savedStall.forEach(function (s, j) {
        lw.NightMarket.STALLS[j].base = s.base;
        lw.NightMarket.STALLS[j].rate = s.rate;
        lw.NightMarket.STALLS[j].growth = s.growth;
      });
    }
    sizes.forEach(function (size) {
      layout.style.width = size[0] + 'px';
      layout.style.height = size[1] + 'px';
      var label = size[0] + 'x' + size[1];
      for (var i = 0; i < 6; i++) {
        lw.NightMarket.STALLS.forEach(function (s, j) {
          s.base = j === i ? savedStall[j].base : 1e15;
          s.rate = j === i ? savedStall[j].rate : 1e-6;
          s.growth = savedStall[j].growth;
        });
        [0, 8].forEach(function (owned) {
          [1, 10, 'max'].forEach(function (mode) {
            lm.state.stalls.forEach(function (s, j) {
              var next = lw.NightMarket.STALLS[j + 1];
              var need = next && next.unlockAt ? next.unlockAt : 10;
              s.serves = 30;
              s.hired = j <= i;
              s.owned = j < i ? need : (j === i ? owned : 0);
            });
            lm.state.cash = 1e12;
            lm.state.bulk = mode;
            lm.render();
            Array.prototype.forEach.call(ld.querySelectorAll('#stalls [data-act="buy"]'), function (btn, bi) {
              if (btn.hidden || btn.offsetParent === null) return;
              var fit = buttonFits(btn);
              if (!fit.ok) buyProblems.push(label + ' stall ' + bi + ' focus ' + i + ' owned ' + owned + ' ' + mode + ' "' + fit.text + '" ' + fit.sw + '/' + fit.cw);
            });
            var row = ld.querySelector('#stalls [data-i="' + i + '"]');
            var tag = row.querySelector('.best-tag');
            var tagged = ld.querySelectorAll('#stalls .best-tag:not([hidden])');
            var offer = lw.NightMarket.quote(lm.state, i, mode === 10 ? 10 : mode);
            var expectTag = offer.count > 0;
            if (expectTag && (!tag || tag.hidden || tagged.length !== 1 || tag.textContent !== 'Best')) tagProblems.push(label + ' stall ' + i + ' ' + mode + ' tags ' + tagged.length);
            if (!expectTag && tagged.length !== 0) tagProblems.push(label + ' stall ' + i + ' ' + mode + ' tags ' + tagged.length);
            var tagBox = tag.getBoundingClientRect();
            Array.prototype.forEach.call(ld.querySelectorAll('#stalls [data-act="serve"]'), function (serve) {
              if (serve.classList.contains('best') || /^Best/.test(serve.textContent)) handProblems.push(label + ' ' + serve.textContent);
              var sb = serve.getBoundingClientRect();
              var hit = tagBox.width > 0 && sb.width > 0 && tagBox.left < sb.right && tagBox.right > sb.left && tagBox.top < sb.bottom && tagBox.bottom > sb.top;
              if (hit) handProblems.push(label + ' tag covers ' + serve.textContent);
            });
          });
        });
        restoreStalls();
      }
      lm.state.stalls.forEach(function (s, j) {
        var next = lw.NightMarket.STALLS[j + 1];
        var need = next && next.unlockAt ? next.unlockAt : 10;
        s.hired = true; s.serves = 30; s.owned = next ? need : 3;
      });
      lm.state.cash = 0;
      lm.state.bulk = 'max';
      lm.render();
      Array.prototype.forEach.call(ld.querySelectorAll('#stalls [data-act="buy"]'), function (btn) {
        if (btn.hidden || btn.offsetParent === null) return;
        if (/Best · Buy 1/.test(btn.textContent) || (btn.textContent || '').indexOf('Best') >= 0) buyProblems.push(label + ' unaffordable "' + btn.textContent + '"');
        var fit = buttonFits(btn);
        if (!fit.ok) buyProblems.push(label + ' unaffordable fit "' + fit.text + '"');
      });
      if (ld.querySelector('#stalls .best-tag:not([hidden])')) tagProblems.push(label + ' unaffordable still tagged');
    });
    check(buyProblems.length ? 'buy prices stay fully visible: ' + buyProblems.slice(0, 4).join(' | ') : 'buy prices stay fully visible at five sizes, with Best off the button', buyProblems.length === 0);
    check(handProblems.length ? 'Best stays off the hand button: ' + handProblems.slice(0, 3).join(' | ') : 'the Best marker never lands on the hand button', handProblems.length === 0);
    check(tagProblems.length ? 'Best tag: ' + tagProblems.slice(0, 3).join(' | ') : 'the Best marker is a tag on the one best stall', tagProblems.length === 0);

    var hintProblems = [];
    var hintDuring = {};
    var hintFrame = await openLane('../games/night-market/index.html', 1280, 800);
    var hw = hintFrame.contentWindow, hd = hw.document, hm = hw.__nightMarket;
    hm.idle.stop();
    var fixedNow = 5000000;
    hw.Date.now = function () { return fixedNow; };
    hm.state.stalls[0].hired = true; hm.state.stalls[0].serves = 25; hm.state.cash = 30; hm.state.bulk = 1;
    hm.render();
    sizes.forEach(function (size) {
      hintFrame.style.width = size[0] + 'px';
      hintFrame.style.height = size[1] + 'px';
      var label = size[0] + 'x' + size[1];
      var row = hd.querySelector('#stalls .stall');
      var next = hd.querySelectorAll('#stalls .stall')[1];
      var hint = row.querySelector('.payback-hint');
      var measure = function () {
        return {
          h: Math.round(row.getBoundingClientRect().height * 10) / 10,
          top: Math.round(next.getBoundingClientRect().top * 10) / 10
        };
      };
      var during = measure();
      if (hint.hidden || hint.textContent !== 'A lower time is a better buy.') hintProblems.push(label + ' hint was not showing');
      hint.hidden = true; hint.textContent = '';
      var before = measure();
      hint.hidden = false; hint.textContent = 'A lower time is a better buy.';
      hintDuring[label] = during;
      if (Math.abs(before.h - during.h) > 0.6 || Math.abs(before.top - during.top) > 0.6) hintProblems.push(label + ' before ' + before.h + '/' + before.top + ' during ' + during.h + '/' + during.top);
    });
    fixedNow = 5000000 + 20000;
    hm.render();
    sizes.forEach(function (size) {
      hintFrame.style.width = size[0] + 'px';
      hintFrame.style.height = size[1] + 'px';
      var label = size[0] + 'x' + size[1];
      var row = hd.querySelector('#stalls .stall');
      var next = hd.querySelectorAll('#stalls .stall')[1];
      var after = {
        h: Math.round(row.getBoundingClientRect().height * 10) / 10,
        top: Math.round(next.getBoundingClientRect().top * 10) / 10
      };
      var during = hintDuring[label];
      if (Math.abs(after.h - during.h) > 0.6 || Math.abs(after.top - during.top) > 0.6) hintProblems.push(label + ' after ' + after.h + '/' + after.top + ' during ' + during.h + '/' + during.top);
    });
    hintFrame.remove();
    check(hintProblems.length ? 'payback hint keeps its slot: ' + hintProblems.join(' | ') : 'the payback hint keeps the row and the next stall still, before, during and after', hintProblems.length === 0);

    var anchorProblems = [];
    lm.state.stalls.forEach(function (s, i) { s.hired = true; s.owned = i === 0 ? 20 : 12; s.serves = 25; });
    lm.state.cash = 1e9; lm.state.bulk = 1;
    sizes.forEach(function (size) {
      layout.style.width = size[0] + 'px';
      layout.style.height = size[1] + 'px';
      var label = size[0] + 'x' + size[1];
      lw.scrollTo(0, 0);
      lm.render();
      var pad = parseFloat(lw.getComputedStyle(ld.documentElement).scrollPaddingTop) || 0;
      ld.getElementById('stalls').scrollIntoView({ block: 'start' });
      lm.render();
      var phone = size[0] <= 1000;
      var pin = ld.querySelector(phone ? '#goal-pin' : '#coin-pin');
      var heading = ld.querySelector('#stalls h2');
      var top = heading.getBoundingClientRect().top;
      var pinBottom = !pin.hidden ? pin.getBoundingClientRect().bottom : 0;
      var clear = top + 1 >= (pin.hidden ? -1 : pinBottom);
      if (!(pad > 0 && clear)) anchorProblems.push(label + ' from top pad ' + pad + ' top ' + top.toFixed(1) + ' pin ' + pinBottom.toFixed(1) + (pin.hidden ? ' hidden' : ''));
    });
    check(anchorProblems.length ? 'anchor jump clears the pin: ' + anchorProblems.join(' | ') : 'jumping to the stalls from the top clears the pin at five sizes', anchorProblems.length === 0);
    layout.remove();

    var directProblems = [];
    for (var ds = 0; ds < sizes.length; ds++) {
      var direct = await openLane('../games/night-market/index.html#stalls', sizes[ds][0], sizes[ds][1]);
      await wait(60);
      var dw = direct.contentWindow, dd = dw.document;
      var dphone = sizes[ds][0] <= 1000;
      var dpin = dd.querySelector(dphone ? '#goal-pin' : '#coin-pin');
      var dheading = dd.querySelector('#stalls h2');
      var dtop = dheading.getBoundingClientRect().top;
      var dpad = parseFloat(dw.getComputedStyle(dd.documentElement).scrollPaddingTop) || 0;
      var dpinBottom = !dpin.hidden ? dpin.getBoundingClientRect().bottom : 0;
      var dclear = dtop + 1 >= (dpin.hidden ? -1 : dpinBottom);
      if (!(dpad > 0 && dclear)) directProblems.push(sizes[ds][0] + 'x' + sizes[ds][1] + ' pad ' + dpad + ' top ' + dtop.toFixed(1) + ' pin ' + dpinBottom.toFixed(1) + (dpin.hidden ? ' hidden' : ''));
      direct.remove();
    }
    check(directProblems.length ? 'opening #stalls clears the pin: ' + directProblems.join(' | ') : 'opening the page on #stalls clears the pin at five sizes', directProblems.length === 0);

    var pinProblems = [];
    var pinFrame = await openLane('../games/night-market/index.html', 390, 844);
    var pw = pinFrame.contentWindow, pd = pw.document, pm = pw.__nightMarket;
    pm.idle.stop();
    [[390, 844], [375, 812], [820, 1180], [844, 390]].forEach(function (size) {
      pinFrame.style.width = size[0] + 'px';
      pinFrame.style.height = size[1] + 'px';
      var label = size[0] + 'x' + size[1];
      pm.state.stalls.forEach(function (s, i) { s.hired = true; s.owned = i === 0 ? 4 : 10; s.serves = 25; });
      pm.state.cash = 1000; pm.state.bulk = 1;
      pm.render();
      var goal = pd.querySelector('#goal');
      var pin = pd.querySelector('#goal-pin');
      var laneEl = pd.getElementById('lane');
      var gap = 0, saw = false, pinH = 0, pinLines = 0, overlap = 0;
      var maxScroll = Math.max(0, pd.documentElement.scrollHeight - size[1]);
      function lineCount(el) {
        var range = pd.createRange();
        range.selectNodeContents(el);
        var tops = [], rects = range.getClientRects();
        for (var r = 0; r < rects.length; r++) {
          var t = Math.round(rects[r].top);
          if (tops.indexOf(t) < 0) tops.push(t);
        }
        return tops.length || 1;
      }
      for (var y = 0; y <= maxScroll; y += 4) {
        pw.scrollTo(0, y);
        pm.render();
        var g = goal.getBoundingClientRect();
        if (g.bottom <= 0 && pin.hidden) gap += 4;
        if (g.bottom <= 0 && !pin.hidden) {
          saw = true;
          pinH = Math.max(pinH, pin.getBoundingClientRect().height);
          pinLines = Math.max(pinLines, lineCount(pin));
        }
        var laneBox = laneEl.getBoundingClientRect();
        if (laneBox.bottom > 0 && laneBox.top < size[1] && !pin.hidden) {
          var pinBox = pin.getBoundingClientRect();
          var vert = Math.min(pinBox.bottom, laneBox.bottom) - Math.max(pinBox.top, laneBox.top);
          if (vert > 0.5) overlap = Math.max(overlap, vert);
        }
      }
      pm.state.stalls[0].hired = false; pm.state.stalls[0].serves = 3; pm.state.stalls[0].owned = 0;
      pm.render();
      var pour = pd.querySelector('#stalls [data-i="0"] .pour');
      var count = pd.querySelector('#stalls [data-i="0"] .count');
      for (var y2 = 0; y2 <= maxScroll; y2 += 8) {
        pw.scrollTo(0, y2);
        pm.render();
        var laneBox2 = laneEl.getBoundingClientRect();
        if (!(laneBox2.bottom > 0 && laneBox2.top < size[1]) || pin.hidden) continue;
        var pinBox2 = pin.getBoundingClientRect();
        [pour, count].forEach(function (el) {
          if (!el || el.hidden) return;
          var b = el.getBoundingClientRect();
          var vert2 = Math.min(pinBox2.bottom, b.bottom) - Math.max(pinBox2.top, b.top);
          var hor = Math.min(pinBox2.right, b.right) - Math.max(pinBox2.left, b.left);
          if (vert2 > 0.5 && hor > 0.5) overlap = Math.max(overlap, vert2);
        });
      }
      var portrait = size[1] > size[0];
      var oneLine = pinLines <= 1 && pinH > 0 && pinH < 64;
      if (gap > 0 || overlap > 0 || (portrait && (!saw || !oneLine)) || (saw && !oneLine)) {
        pinProblems.push(label + ' gap ' + gap + ' saw ' + saw + ' lines ' + pinLines + ' h ' + pinH.toFixed(1) + ' overlap ' + overlap.toFixed(1));
      }
    });
    pinFrame.style.width = '844px'; pinFrame.style.height = '390px';
    pw.scrollTo(0, 0);
    pm.state.stalls.forEach(function (s) { s.hired = false; s.owned = 0; s.serves = 0; });
    pm.render();
    var fold = pd.querySelector('#goal').getBoundingClientRect();
    check('a short landscape screen still shows the goal above the fold', fold.height > 0 && fold.top >= 0 && fold.bottom <= 390);
    check(pinProblems.length ? 'phone goal pin: ' + pinProblems.join(' | ') : 'the phone goal pin appears as the goal leaves, on one line, and stays off the lane', pinProblems.length === 0);
    pinFrame.remove();

    var saveFrame = await openLane('../games/night-market/index.html', 390, 844);
    var swin = saveFrame.contentWindow, sdoc = swin.document, sm = swin.__nightMarket;
    var saveBox = sdoc.querySelector('details.save');
    saveBox.open = true;
    sm.drawTools();
    var backup = sdoc.querySelector('.arc-bk');
    var backupSummary = backup.querySelector('summary');
    var closedMark = swin.getComputedStyle(backupSummary, '::before').content || '';
    backup.open = true;
    var openMark = swin.getComputedStyle(backupSummary, '::before').content || '';
    check('Automatic backups uses the same disclosure marker as Your save', /▸/.test(closedMark) && /▾/.test(openMark));
    saveFrame.remove();

    Object.keys(localStorage).forEach(function (k) {
      if (k === KEY || k.indexOf('arcade-backup:' + KEY) === 0) localStorage.removeItem(k);
    });
    check('other saves are left alone', Object.keys(localStorage).slice().sort().join('|') === before);
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    if (frame) frame.remove();
    button.disabled = false;
  }
};
</script>
</html>
