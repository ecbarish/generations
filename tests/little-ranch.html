<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Little Ranch checks</title>
<style>body{font:16px system-ui;background:#1d3a2a;color:#f2eedb;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{border:0;display:block}</style></head>
<body><h1>Little Ranch checks</h1>
<p>LR1, the smallest test: one baby, feed, bubbles, peekaboo and bedtime; no words, nothing to fail, no links out, a grown-up lock. Only the sound choice (little-ranch-settings-v1) is ever stored; every other key is compared before and after.</p>
<button id="run">Run checks</button><p id="summary" role="status">Ready.</p><ol id="results"></ol><div id="game"></div>
<script>
'use strict';
document.querySelector('#run').onclick = async () => {
  const sum = document.querySelector('#summary'), list = document.querySelector('#results'), button = document.querySelector('#run');
  button.disabled = true; list.replaceChildren(); sum.textContent = 'Running…'; let n = 0, frame, errors = [];
  const PREF = 'little-ranch-settings-v1', keep = localStorage.getItem(PREF);
  const others = () => JSON.stringify(Object.keys(localStorage).filter(k => k !== PREF).sort().map(k => [k, localStorage.getItem(k)]));
  const before = others();
  const check = (name, ok) => { n++; const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail'; li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name; list.appendChild(li); if (!ok) throw Error(name); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    localStorage.removeItem(PREF);
    frame = document.createElement('iframe'); frame.title = 'Little Ranch test instance'; frame.style.cssText = 'width:375px;height:812px';
    frame.src = '../games/little-ranch/index.html';
    await new Promise((ok, no) => { const t = setTimeout(() => no(Error('load timed out')), 20000); frame.onload = () => { clearTimeout(t); ok(); }; document.querySelector('#game').appendChild(frame); });
    const w = frame.contentWindow, d = frame.contentDocument; w.addEventListener('error', e => errors.push(e.message));
    for (let i = 0; i < 50 && !w.LR; i++) await sleep(100);
    const LR = w.LR, cv = d.querySelector('#ranch'); let pid = 1;
    LR.setRoutine(false); // LR7: the older bedtime checks run straight to the lullaby; LR7's own section turns the routine on
    LR.setFriend(false); LR.newVisit(); // LR4: the friend's visits are random; the older checks run without it, LR4's with it
    const ev = (el, type, p) => el.dispatchEvent(new w.PointerEvent(type, { pointerId: pid, clientX: p.x, clientY: p.y, bubbles: true, cancelable: true, isPrimary: true }));
    const tap = q => { const p = LR.toScreen(q); pid++; ev(cv, 'pointerdown', p); ev(cv, 'pointerup', p); };
    const drag = (a, b, steps) => { pid++; ev(cv, 'pointerdown', LR.toScreen(a)); for (let i = 1; i <= steps; i++) { ev(cv, 'pointermove', LR.toScreen({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps })); LR.advance(.05); } ev(cv, 'pointerup', LR.toScreen(b)); };
    const S = () => LR.state, L = () => LR.layout, baby = () => ({ x: S().baby.x, y: L().home.y - L().size * .9 });
    const visible = el => { const s = w.getComputedStyle(el); return !el.closest('[hidden]') && s.display !== 'none' && s.visibility !== 'hidden'; };

    // ---- safe by design
    const text = [...d.body.querySelectorAll('*')].filter(el => visible(el) && !['SCRIPT', 'STYLE'].includes(el.tagName)).map(el => [...el.childNodes].filter(c => c.nodeType === 3).map(c => c.textContent.trim()).join('')).join('');
    check('No words on screen while playing (nothing to read)', text === '');
    const links = [...d.querySelectorAll('a[href]')];
    check('No links out: the only link is back to the arcade, inside the grown-up panel', links.length === 1 && new URL(links[0].href).origin === location.origin && /\/index\.html$/.test(links[0].href) && links[0].closest('#grown').hidden);
    check('No forms, frames, feedback buttons or outside scripts', !d.querySelector('form,iframe,input,[data-feedback],#feedback') && [...d.scripts].every(s => !s.src || new URL(s.src).origin === location.origin));
    check('The game starts in play, with one baby and nothing counted', S().mode === 'play' && S().acts === 0 && LR.VERSION === '0.17.0');

    // ---- big targets, away from the edges, on every screen
    for (const [width, height] of [[320, 568], [375, 812], [667, 375], [1366, 768], [1920, 1080], [3440, 1440]]) {
      frame.style.width = width + 'px'; frame.style.height = height + 'px'; await sleep(150); LR.advance(.1);
      const sc = LR.scale, l = L(), r = cv.getBoundingClientRect();
      const spots = [l.bowl, l.sponge, l.bush, l.home].map(p => LR.toScreen(p)).map(p => ({ x: p.x - r.left, y: p.y - r.top }));
      check(`${width}×${height}: the ranch fills the screen with no scrolling`, Math.abs(r.width - width) <= 1 && Math.abs(r.height - height) <= 1 && d.documentElement.scrollWidth <= width && d.documentElement.scrollHeight <= height);
      check(`${width}×${height}: tap targets are big (at least 80 px across) and away from the edges`, l.R * 2 * sc >= 80 && spots.every(p => p.x > width * .08 && p.x < width * .92 && p.y > height * .1 && p.y < height * .95));
    }
    frame.style.width = '375px'; frame.style.height = '812px'; await sleep(150); LR.newVisit(); LR.advance(.1);

    // ---- the three things to do, by real taps and drags
    tap(L().bowl); check('Tapping the bowl fills it', S().bowl.food === 1);
    LR.advance(1.5); check('The baby walks over and eats', S().baby.act === 'eat');
    LR.advance(3); check('After eating the bowl is empty and it counts as one happy thing', S().bowl.food === 0 && S().acts === 1);
    LR.advance(2.5);
    const sp = { x: L().sponge.x, y: L().sponge.y }; drag(sp, baby(), 16); LR.advance(1); drag(sp, { x: baby().x - L().size * .5, y: baby().y }, 16);
    check('Dragging the sponge over the baby makes bubbles (each bath counts once)', S().bubbles.length > 0 && S().acts === 3);
    const bub = S().bubbles[0], count = S().bubbles.length; tap({ x: bub.x + Math.sin(S().t * 2 + bub.seed) * bub.r * .8, y: bub.y });
    check('Tapping a bubble pops it', S().bubbles.length < count);
    LR.advance(2); tap(L().sponge); LR.advance(1.2); check('Just tapping the sponge gives a bath too (for little hands)', !!S().sponge.auto && S().bubbles.length > 0);
    LR.advance(1.5); check('The tapped bath counts once', S().acts === 4 && !S().sponge.auto);
    S().bubbles.length = 0; // a bubble in the way is popped first (that is a tap's answer too); clear them for the next taps
    tap({ x: L().bush.x, y: L().bush.y - L().R * .4 }); LR.advance(2); check('Tapping the bush: the baby hides behind it', S().baby.act === 'hide');
    tap({ x: L().bush.x, y: L().bush.y - L().R * .4 }); check('Tapping again: peekaboo!', S().baby.act === 'peek');
    LR.advance(1.6); check('Peekaboo counts and the baby comes back out', S().acts === 5 && S().baby.act === null);
    LR.advance(3); S().bubbles.length = 0; tap(baby()); check('Tapping the baby makes it giggle', S().baby.act === 'giggle' && S().acts === 6);
    LR.advance(1); const sparks = S().fx.length; tap({ x: L().home.x - L().size * 3, y: L().ground * .4 }); check('A tap on empty sky still answers (a sparkle)', S().fx.length > sparks);

    // ---- LR13: the sun surprise (daytime)
    LR.newVisit(); LR.advance(.5); const sun = () => ({ x: L().sun.x, y: L().sun.y });
    tap(sun()); check('Tapping the sun makes it a little brighter', S().sun.taps === 1 && S().sun.glow > 0 && !S().sun.bow);
    LR.advance(.3); const g1 = S().sun.glow; tap(sun()); check('Brighter again on the next tap', S().sun.taps === 2 && S().sun.glow > g1);
    for (let i = 3; i < LR.SUN_TAPS; i++) { LR.advance(.3); tap(sun()); }
    check('Four taps: bright, no rainbow yet', S().sun.taps === LR.SUN_TAPS - 1 && !S().sun.bow);
    LR.advance(.3); tap(sun()); check('The fifth tap: a rainbow, and the baby looks up and cheers (one happy thing)', !!S().sun.bow && S().baby.act === 'cheer' && S().acts === 1 && S().fx.some(f => f.kind === 'heart'));
    LR.advance(.3); tap(sun()); check('Tapping the sun during the rainbow just twinkles', S().sun.taps === LR.SUN_TAPS && !!S().sun.bow);
    LR.advance(LR.BOW_SECS + .5); check('After a few seconds the rainbow fades, the count starts again and the baby settles', !S().sun.bow && S().sun.taps === 0 && S().baby.act === null);
    LR.advance(3); check('...and the sun goes back to normal', S().sun.glow === 0);
    tap(sun()); LR.advance(11); check('A forgotten tap or two just wears off (no rush, nothing lost)', S().sun.taps === 0);
    LR.newVisit(); S().acts = LR.BEDTIME_ACTS; LR.advance(14); for (let i = 0; i < 6; i++) tap(sun());
    check('At night there is no sun to tap: no rainbow', S().mode === 'sleep' && S().sun.taps === 0 && !S().sun.bow);

    // ---- choosing a different toy must not leave a meal stuck forever
    for (const eating of [false, true]) {
      LR.newVisit(); tap(L().bowl); if (eating) LR.advance(1.5);
      tap({ x: L().bush.x, y: L().bush.y - L().R * .4 }); LR.advance(8);
      const cancelled = S().bowl.food === 0 && S().acts === 1;
      tap(L().bowl); LR.advance(5);
      tap(L().bowl); LR.advance(5);
      check(`Interrupt ${eating ? 'eating' : 'the walk to food'} with peekaboo: two later meals both finish`, cancelled && S().acts === 3 && S().bowl.food === 0 && S().baby.act === null);
    }

    LR.newVisit(); LR.act.peek(); LR.advance(2); LR.act.peek(); LR.advance(1.3);
    tap(L().bowl); LR.advance(5); tap(L().bowl); LR.advance(5);
    check('Switching from the end of peekaboo to feeding never replaces the meal with a trip home', S().acts === 2 && S().bowl.food === 0 && S().baby.act === null);

    // ---- changing canvas size preserves the baby, its destination and active toys
    const sizes = [[3440,1440],[375,812],[667,375],[1920,1080],[320,568],[1366,768],[375,812]];
    for (const phase of ['idle', 'walking to food', 'eating', 'hiding', 'returning home', 'sleeping', 'bathing', 'dragging']) {
      LR.newVisit();
      if (phase === 'walking to food' || phase === 'eating') { tap(L().bowl); LR.advance(phase === 'eating' ? 1.5 : .01); }
      if (phase === 'hiding' || phase === 'returning home') { LR.act.peek(); LR.advance(2); if (phase === 'returning home') { LR.act.peek(); LR.advance(1.45); } }
      if (phase === 'sleeping') { LR.bedtime(); LR.advance(12); }
      if (phase === 'bathing') { LR.act.bath(); LR.advance(.7); }
      if (phase === 'dragging') { pid++; ev(cv, 'pointerdown', LR.toScreen(L().sponge)); ev(cv, 'pointermove', LR.toScreen(baby())); }
      let fits = true;
      for (const [width, height] of sizes) {
        frame.style.width = width + 'px'; frame.style.height = height + 'px'; await sleep(150);
        const b = S().baby, l = L(), box = cv.getBoundingClientRect(), p = LR.toScreen({x:b.x,y:l.home.y});
        const margin = l.size * 1.35 / cv.width * box.width;
        fits = fits && Number.isFinite(b.x) && (b.tx === null || Number.isFinite(b.tx)) && p.x - margin >= box.left && p.x + margin <= box.right;
        if (b.act === 'eat') fits = fits && Math.abs(b.x - l.bowl.x - l.size * 1.3) < .001;
        if (b.act === 'hide' || b.act === 'peek') fits = fits && Math.abs(b.x - l.bush.x) < .001;
        if (phase === 'dragging') fits = fits && !!S().sponge.drag && Number.isFinite(S().sponge.x) && Number.isFinite(S().sponge.y);
      }
      if (phase === 'dragging') { ev(cv, 'pointermove', LR.toScreen(baby())); ev(cv, 'pointerup', LR.toScreen(baby())); }
      LR.advance(9);
      const expectedActs = ['walking to food','eating','hiding','returning home','bathing','dragging'].includes(phase) ? 1 : 0;
      check(`Resize while ${phase}: the baby stays visible and the activity finishes once`, fits && S().acts === expectedActs && Math.abs(S().baby.x - L().home.x) < .001 && S().bowl.food === 0 && !S().sponge.drag && !S().sponge.auto && (phase !== 'sleeping' || S().mode === 'sleep'));
    }

    // ---- nothing to fail: a toddler bashing the screen
    LR.newVisit(); let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 300; i++) { const p = { x: rnd() * L().home.x * 2, y: rnd() * L().home.y * 1.3 };
      if (i % 5 === 0) drag(p, { x: rnd() * L().home.x * 2, y: rnd() * L().home.y * 1.3 }, 3); else tap(p); LR.advance(rnd() * .4); }
    check('300 random taps and drags: no errors, no scores, no losing, still a calm state', errors.length === 0 && ['play', 'dusk', 'sleep'].includes(S().mode) && !('score' in S()) && !('lives' in S()));

    // ---- bedtime ends the visit gently
    LR.newVisit(); S().acts = LR.BEDTIME_ACTS; LR.advance(.2); check('After enough play the baby yawns and the sky starts to turn', S().mode === 'dusk' && S().baby.act === 'yawn');
    LR.advance(12); check('Then night: the baby curls up asleep and the visit is over', S().mode === 'sleep' && S().baby.act === 'sleep' && S().dusk === 1 && S().lullabyAt !== null);
    tap(L().bowl); tap({ x: L().bush.x, y: L().bush.y }); tap({ x: L().home.x - L().size * 3, y: L().ground * .4 }); LR.advance(1); check('At bedtime taps away from the baby only twinkle; it stays asleep', S().mode === 'sleep' && S().baby.act === 'sleep' && S().bowl.food === 0 && S().wake === 0);

    // ---- LR12: six taps on the sleeping baby wake it up for a fresh day
    const zzzBefore = S().fx.filter(f => f.kind === 'zzz').length;
    tap(baby()); check('A tap on the sleeping baby: it stirs (wiggle and a zzz), still asleep', S().wake === 1 && S().stir > 0 && S().mode === 'sleep' && S().baby.act === 'sleep' && S().fx.filter(f => f.kind === 'zzz').length > zzzBefore);
    LR.advance(.3);
    for (let i = 2; i < LR.WAKE_TAPS; i++) { tap(baby()); LR.advance(.3); }
    check('Five taps: still asleep, counting up (no fail, no rush)', S().wake === LR.WAKE_TAPS - 1 && S().mode === 'sleep');
    LR.advance(20); check('Waiting in between is fine: the count stays', S().wake === LR.WAKE_TAPS - 1 && S().mode === 'sleep');
    tap(baby()); check('The sixth tap: it wakes up happy and a new day starts (same reset as New visit)', S().mode === 'play' && S().acts === 0 && S().wake === 0 && S().baby.act === 'giggle' && S().bowl.food === 0 && S().lullabyAt === null && S().fx.some(f => f.kind === 'heart'));
    check('The sky starts at night and brightens', S().dawn === true && S().dusk > .9);
    LR.advance(3); check('A few seconds later: sunny morning, ready to play', S().dawn === false && S().dusk === 0 && S().mode === 'play' && S().baby.act === null);
    tap(L().bowl); check('And the day works as before (the bowl fills)', S().bowl.food === 1);
    LR.advance(5); S().acts = LR.BEDTIME_ACTS; LR.advance(14); check('The new day ends in bedtime again', S().mode === 'sleep' && S().baby.act === 'sleep');

    // ---- LR14: the moon's song (night only; the baby sleeps on)
    const moon = () => LR.moonAt(), M = () => S().moon;
    LR.newVisit(); LR.advance(.5); tap({ x: L().home.x * 1.6, y: L().home.y * .2 }); tap({ x: L().home.x * 1.6, y: L().home.y * .2 }); tap({ x: L().home.x * 1.6, y: L().home.y * .2 });
    check('In the daytime there is no moon to tap', M().taps === 0 && !M().song);
    S().acts = LR.BEDTIME_ACTS; LR.advance(26); check('Night, the lullaby is over, the baby is asleep', S().mode === 'sleep' && S().baby.act === 'sleep');
    tap(moon()); check('A tap on the moon: it glows a little, the baby sleeps on, the wake count is untouched', M().taps === 1 && M().glow > 0 && S().baby.act === 'sleep' && S().wake === 0);
    LR.advance(.4); const mg = M().glow; tap(moon()); check('Glows more on the next tap', M().taps === 2 && M().glow > mg && !M().song);
    LR.advance(.4); const t0 = LR.tones; tap(moon()); LR.advance(.1);
    check('The third tap: the moon starts Twinkle Twinkle Little Star', !!M().song && LR.tones > t0);
    LR.advance(LR.BEAT * 7.5); check('The song plays note by note in time (the first line)', M().song && M().song.i === 7);
    tap(moon()); check('Tapping during the song just twinkles', M().taps === LR.MOON_TAPS && !!M().song);
    const ts = S().t, n0 = M().song.i; LR.advance(LR.BEAT * 1.05); check('Stars twinkle across the sky in time with the notes', M().song.i === n0 + 1 && S().fx.some(f => f.kind === 'spark' && f.at > ts && f.y < L().ground));
    LR.advance(LR.BEAT * (LR.SONG_BEATS + 2)); check('The whole first verse plays (' + LR.TWINKLE.length + ' notes), then the moon rests and the count starts again', !M().song && M().taps === 0);
    check('Through it all the baby slept on, and moon taps never counted as wake taps', S().mode === 'sleep' && S().baby.act === 'sleep' && S().wake === 0);
    tap(moon()); LR.advance(11); check('A stray tap on the moon wears off', M().taps === 0);
    LR.prefs.sound = false; const t1 = LR.tones; for (let i = 0; i < LR.MOON_TAPS; i++) { tap(moon()); LR.advance(.3); } LR.advance(LR.BEAT * 4);
    check('With the sound off, the stars still dance but no notes play', !!M().song && M().song.i > 3 && LR.tones === t1);
    LR.prefs.sound = true; for (let i = 0; i < LR.WAKE_TAPS; i++) { tap(baby()); LR.advance(.2); }
    check('Waking the baby mid-song stops the song (six baby taps, as before)', S().mode === 'play' && !M().song && M().taps === 0);
    LR.advance(3);

    // ---- the grown-up lock
    const lock = d.querySelector('#lock'), panel = d.querySelector('#grown'), lp = (type) => lock.dispatchEvent(new w.PointerEvent(type, { pointerId: 99, bubbles: true, cancelable: true }));
    lp('pointerdown'); await sleep(600); lp('pointerup'); await sleep(100); check('A short press on the lock does nothing', panel.hidden);
    lp('pointerdown'); await sleep(LR.HOLD_MS + 400); lp('pointerup'); check('Holding the lock for three seconds opens the grown-up panel', !panel.hidden);
    d.querySelector('#gSound').click(); check('The sound switch is behind the lock and is the only thing stored', JSON.parse(localStorage.getItem(PREF)).sound === false && others() === before);
    d.querySelector('#gSound').click(); d.querySelector('#gNew').click(); check('"New visit" starts a fresh, sunny visit', panel.hidden && S().mode === 'play' && S().acts === 0 && S().dusk === 0);
    // ---- LR15: the panel's ways back to play, by touch alone (no click), and no double actions
    const pe = (el, type, id) => el.dispatchEvent(new w.PointerEvent(type, { pointerId: id, bubbles: true, cancelable: true, isPrimary: true, pointerType: 'touch' }));
    const touch = (el, id) => { pe(el, 'pointerdown', id); pe(el, 'pointerup', id); };
    LR.openPanel(); touch(d.querySelector('#gClose'), 501); check('"Back to play" closes the panel on a touch alone (no click needed)', panel.hidden);
    await sleep(750); LR.openPanel(); d.querySelector('#gClose').click(); check('...and on a plain click or key press', panel.hidden);
    LR.openPanel(); touch(d.querySelector('#gX'), 502); check('The X in the corner closes the panel', panel.hidden);
    LR.openPanel(); touch(panel, 503); check('A tap on the dimmed backdrop closes the panel', panel.hidden);
    LR.openPanel(); touch(d.querySelector('#grown .card'), 504); touch(d.querySelector('#gTitle'), 505); check('A tap inside the card (not on a button) keeps it open', !panel.hidden);
    pe(d.querySelector('#gClose'), 'pointerdown', 506); pe(d.querySelector('#gClose'), 'pointercancel', 506); pe(d.querySelector('#gClose'), 'pointerup', 506); check('A touch that turns into a swipe does nothing', !panel.hidden);
    pe(lock, 'pointerdown', 507); pe(panel, 'pointerup', 507); check('Lifting the finger from the lock hold does not close the panel it opened', !panel.hidden);
    const s0 = LR.prefs.sound; touch(d.querySelector('#gSound'), 508); d.querySelector('#gSound').click();
    check('A touch and its follow-up click count once (sound flips once and shows it)', LR.prefs.sound === !s0 && d.querySelector('#gSoundLabel').textContent === (LR.prefs.sound ? 'Sound on' : 'Sound off') && d.querySelector('#gSound').getAttribute('aria-pressed') === String(LR.prefs.sound) && (d.querySelector('#gMute').style.display === 'none') === LR.prefs.sound);
    touch(d.querySelector('#gSound'), 509); check('...and flips back', LR.prefs.sound === s0);
    LR.openPanel(); const vis = () => [...d.querySelectorAll('#grown .act')].filter(visible).map(el => el.textContent.trim());
    check('On the web the panel shows New visit, Sound, Arcade and Back to play', !LR.APP && vis().join('|') === 'New visit|' + (LR.prefs.sound ? 'Sound on' : 'Sound off') + '|Arcade|Back to play');
    const fits = [...d.querySelectorAll('#grown .lbl')].filter(visible).every(el => el.scrollWidth <= el.clientWidth + 1 && el.getBoundingClientRect().height < 30);
    check('Every label fits on one line at 375 px wide', fits);
    touch(d.querySelector('#gClose'), 510);
    // ---- LR9: the Paint Shed
    LR.newVisit(); LR.advance(.1); const SH = () => S().shed, sl = () => L().shed;
    check('The paint-drip sign is on the ranch, big and away from the edges', L().sign.x - L().R > 0 && L().R * 2 * LR.scale >= 80);
    tap(L().sign); check('Tapping the sign goes into the Paint Shed', S().place === 'shed');
    check('In the shed: four fat pots, each at least 80 px across, and a big barn picture', sl().pots.length === 4 && sl().potR * 2 * LR.scale >= 78 && sl().barn.r * 2 * LR.scale >= 70);
    pid++; ev(cv, 'pointerdown', LR.toScreen(sl().pots[2])); check('A pot is chosen when the finger lifts, not when it lands', SH().pot === 0);
    ev(cv, 'pointerup', LR.toScreen(sl().pots[2])); check('...and then it is the chosen pot', SH().pot === 2);
    tap(LR.partPoint('body')); check('Tapping the body fills it with that colour', SH().parts.body === 2);
    tap({ x: LR.partPoint('head').x + sl().z * .7, y: LR.partPoint('head').y }); check('A tap just beside the head still paints it (no fiddly edges)', SH().parts.head === 2);
    tap(sl().barn); check('The barn picture goes home to the ranch at any time; nothing is painted on the baby yet', S().place === 'ranch' && S().paint === null);
    tap(L().sign); check('Back in the shed, the painting is still there', S().place === 'shed' && SH().parts.body === 2);
    tap(sl().pots[0]); drag(LR.partPoint('tail'), LR.partPoint('legs'), 8); check('Dragging over the outline paints what it passes', SH().parts.tail === 0 && SH().parts.legs === 0);
    const acts9 = S().acts; check('Every part coloured: sparkles and a cheer', SH().doneAt !== null && S().fx.length > 10);
    LR.advance(3); check('...then the painted baby walks back out to the ranch in its colours (one happy thing)', S().place === 'ranch' && S().paint && Object.keys(S().paint).length === 4 && S().paint.head === 2 && S().paint.tail === 0 && S().acts === acts9 + 1);
    const mute = LR.prefs.sound; LR.prefs.sound = false; tap(L().sign); const t9 = LR.tones; tap(sl().pots[1]); tap(LR.partPoint('head')); tap(sl().barn);
    check('Painting with the sound off makes no sound', LR.tones === t9); LR.prefs.sound = mute;
    LR.bedtime(); LR.advance(25); check('Bedtime washes the paint off', S().mode === 'sleep' && S().paint === null);
    LR.newVisit(); LR.advance(.1); check('A new visit starts on the ranch with a fresh outline', S().place === 'ranch' && Object.keys(SH().parts).length === 0);

    let exits = 0; aw.LittleRanchApp = { exit: () => { exits++; } };
    const avis = el => { const s = aw.getComputedStyle(el); return !el.closest('[hidden]') && s.display !== 'none'; };
    const atouch = (el, id) => ['pointerdown', 'pointerup'].forEach(t => el.dispatchEvent(new aw.PointerEvent(t, { pointerId: id, bubbles: true, cancelable: true, isPrimary: true, pointerType: 'touch' })));
    aw.LR.openPanel(); const acts = [...ad.querySelectorAll('#grown .act')].filter(avis).map(el => el.textContent.trim());
    check('In the app the panel shows exactly Replay, Sound and Exit (no arcade link)', aw.LR.APP && acts.length === 3 && acts[0] === 'Replay' && /^Sound (on|off)$/.test(acts[1]) && acts[2] === 'Exit' && !avis(ad.querySelector('#gHome')));
    check('...plus the X to go back to play', avis(ad.querySelector('#gX')));
    const ar = [...ad.querySelectorAll('#grown .act')].filter(avis).map(el => el.getBoundingClientRect()), card = ad.querySelector('#grown .card').getBoundingClientRect();
    check('In a phone held sideways, the three sit in one row inside the card', ar.every(r => Math.abs(r.top - ar[0].top) < 2 && r.left >= card.left && r.right <= card.right && r.bottom <= card.bottom) && card.bottom <= 375 && card.top >= 0);
    aw.LR.state.acts = 5; atouch(ad.querySelector('#gNew'), 601); check('Replay starts a fresh day and closes the panel', ad.querySelector('#grown').hidden && aw.LR.state.acts === 0 && aw.LR.state.mode === 'play');
    aw.LR.openPanel(); atouch(ad.querySelector('#gX'), 602); check('The X goes back to play', ad.querySelector('#grown').hidden && exits === 0);
    aw.LR.openPanel(); atouch(ad.querySelector('#gExit'), 603); check('Exit asks the app to close (once)', exits === 1 && ad.querySelector('#grown').hidden);
    app.remove();
    sum.className = 'pass'; sum.textContent = 'PASS — ' + n + ' Little Ranch checks.';
  } catch (e) { sum.className = 'fail'; sum.textContent = 'FAIL — ' + e.message; }
  finally { if (frame) frame.remove(); if (keep === null) localStorage.removeItem(PREF); else localStorage.setItem(PREF, keep); button.disabled = false; }
};
