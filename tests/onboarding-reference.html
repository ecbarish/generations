<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared guidance reference fixture</title>
<link rel="stylesheet" href="../shared/onboarding.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#15252b;color:#eef8f4;font:calc(16px * var(--arc-text,1))/1.5 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:clamp(12px,4vw,32px)}aside{padding:1rem;border:1px solid #92beb1;border-radius:8px;background:#203d43}button{font:inherit;min-height:44px;margin:.2em;padding:.5em .7em;background:#deede5;color:#15252b;border:1px solid #92beb1;border-radius:5px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:1rem}#referenceResult{overflow-wrap:anywhere}
</style>
<main>
<h1>Shared guidance reference</h1>
<p>A neutral, test-only consumer. This page uses the same presenter as Realmbound, with its own goals and transient state. Nothing is saved.</p>
<aside id="referenceGuide" aria-label="Practice guidance" hidden></aside>
<p id="referenceResult" role="status">No action selected.</p>
<nav aria-label="Fixture controls"><button id="referenceReset">Show guidance again</button><button id="referenceSwap">Change goal</button></nav>
</main>
<script src="../shared/onboarding.js"></script>
<script>
'use strict';
window.referenceState={dismissed:{},actions:[],current:'lantern'};
const referenceModels={
 lantern:{id:'lantern',title:'A light for the path',goal:'Pick up the practice lantern.',text:'This is an isolated example, with no connection to any game save.',inputs:{keyboard:'Choose Pick up lantern with Tab and Enter.',touch:'Tap Pick up lantern.'},orientation:{portrait:'Turn sideways if you prefer a wider view. Both orientations work.'},actions:[{id:'pickup',label:'Pick up lantern'}]},
 crossing:{id:'crossing',title:'The next step',goal:'Inspect the practice crossing.',text:'The consumer selects the next goal; the shared presenter does not progress a game.',inputs:{keyboard:'Choose Inspect crossing with Tab and Enter.',touch:'Tap Inspect crossing.'},actions:[{id:'inspect',label:'Inspect crossing'}]}
};
window.referenceController=ArcadeOnboarding.create({element:document.querySelector('#referenceGuide'),onDismiss:id=>{referenceState.dismissed[id]=true;referenceRender();document.querySelector('#referenceReset').focus();},onAction:id=>{referenceState.actions.push(id);document.querySelector('#referenceResult').textContent='Selected: '+id;}});
window.referenceRender=()=>referenceController.update(referenceState.dismissed[referenceState.current]?null:referenceModels[referenceState.current]);
document.querySelector('#referenceReset').onclick=()=>{referenceState.dismissed={};referenceRender();};
document.querySelector('#referenceSwap').onclick=()=>{referenceState.current=referenceState.current==='lantern'?'crossing':'lantern';referenceRender();};
referenceRender();
</script>
</html>
