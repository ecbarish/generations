<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Idle core checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#131820;color:#e8edf5;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#96eba4}.fail{color:#ff9a9a}#summary{font-weight:bold}
</style>
<h1>Idle core checks</h1>
<p>The shared idle core, driven by a fake clock. It does not touch saves.</p>
<p><a href="../">Back to arcade</a></p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script>
'use strict';
document.querySelector('#run').onclick = function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var storageBefore = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function close(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function brute(base, growth, owned, count) {
    var total = 0;
    for (var i = 0; i < count; i++) total += base * Math.pow(growth, owned + i);
    return total;
  }
  var wall = 1700000000000;
  var perf = 5000;
  var hidden = false;
  var realNow = Date.now;
  var realPerf = performance.now.bind(performance);
  var realSet = window.setInterval;
  var realClear = window.clearInterval;
  var tick = null;
  var tickMs = 0;
  Date.now = function () { return wall; };
  performance.now = function () { return perf; };
  window.setInterval = function (fn, ms) { tick = fn; tickMs = ms; return 1; };
  window.clearInterval = function () { tick = null; };
  function pump() { if (tick) tick(); }
  try {
    Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return hidden; } });
  } catch (e) {
    check('the test can fake a hidden tab', false);
  }
  var originalTitle = document.title;
  try {
    check('engine fmt is loaded', typeof Arcade.fmt === 'function' && Arcade.fmt(1200) === '1.20K');

    (function capAndMultiplier() {
      var cash = 0;
      var calls = 0;
      var idle = Idle.create({
        getRate: function () { return 10; },
        apply: function (amount) { calls++; cash += amount; },
        maxOfflineSec: 100,
        offlineRate: 0.5,
        title: { label: 'Night Market', unit: '$' }
      });
      var early = idle.start(wall - 59 * 1000);
      check('under a minute away returns null', early === null);
      check('under a minute credits nothing', cash === 0 && calls === 0);
      idle.stop();

      cash = 0; calls = 0;
      var minute = idle.start(wall - 60 * 1000);
      check('one minute away is credited once', minute && minute.away === 60 && minute.credited === 60 && minute.capped === false);
      check('one minute uses the offline multiplier', minute.gained === 300 && cash === 300 && calls === 1);
      idle.stop();

      cash = 0; calls = 0;
      var capped = idle.start(wall - 250 * 1000);
      check('offline catch-up is held to the cap', capped && capped.away === 250 && capped.credited === 100 && capped.capped === true);
      check('capped earnings are one closed-form grant', capped.gained === 500 && cash === 500 && calls === 1);
      idle.stop();

      cash = 0;
      var back = idle.start(wall + 3600 * 1000);
      check('a clock that goes backward credits nothing', back === null && cash === 0);
      idle.stop();

      cash = 0;
      var boosted = Idle.create({
        getRate: function () { return 4; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 1000,
        offlineRate: 2
      });
      var held = boosted.start(wall - 100 * 1000);
      check('an offline rate above 1 pays no more than active play', held && held.gained === 400 && cash === 400);
      boosted.stop();
    })();

    (function defaultsAndJump() {
      var cash = 0;
      var idle = Idle.create({
        getRate: function () { return 2; },
        apply: function (amount) { cash += amount; }
      });
      var nineHours = 9 * 3600;
      var summary = idle.start(wall - nineHours * 1000);
      check('the default cap is eight hours', summary && summary.credited === 8 * 3600 && summary.capped === true && summary.away === nineHours);
      check('the default offline rate does not beat active play', summary.gained === 2 * 8 * 3600 && cash === summary.gained);
      idle.stop();
    })();

    (function sessionGaps() {
      var cash = 0;
      var rate = 1200;
      var idle = Idle.create({
        getRate: function () { return rate; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 1000,
        offlineRate: 0.5,
        title: { label: 'Night Market', unit: '$' }
      });
      document.title = 'Arcade hall';
      var summary = idle.start(wall - 120 * 1000);
      check('opening summary is the object later gaps update', summary && summary.credited === 120 && summary.gained === 72000);
      var titleAtStart = document.title;
      check('tab title uses engine fmt', titleAtStart === '+$' + Arcade.fmt(1200) + '/s · Night Market');

      hidden = false;
      wall += 2000;
      perf += 2000;
      var before = cash;
      var credited = summary.credited;
      pump();
      check('a visible gap pays the full rate', cash - before === 2400);
      check('active play is not folded into the away summary', summary.credited === credited);

      rate = 2400;
      wall += 500;
      perf += 500;
      pump();
      check('the title waits a second before refreshing', document.title === titleAtStart);
      wall += 500;
      perf += 500;
      pump();
      check('the title refreshes once a second', document.title === '+$' + Arcade.fmt(2400) + '/s · Night Market');

      hidden = true;
      wall += 5000;
      perf += 5000;
      before = cash;
      credited = summary.credited;
      var gained = summary.gained;
      pump();
      check('five hidden seconds stay active play', cash - before === 2400 * 5 && summary.credited === credited);

      wall += 6000;
      perf += 6000;
      before = cash;
      pump();
      check('a long hidden gap stays on the full online rate', cash - before === 2400 * 6);
      check('a hidden gap does not become an away summary', summary.credited === credited && summary.gained === gained && summary.capped === false);

      var mark = cash;
      var snap = summary.credited;
      wall -= 30000;
      pump();
      check('a backward jump during play credits nothing', cash === mark && summary.credited === snap);

      hidden = false;
      wall += 1500 * 1000;
      perf += 1500 * 1000;
      before = cash;
      pump();
      check('an open-tab clock jump is held to the cap at the online rate', cash - before === 2400 * 1000);
      check('a loaded gap does not flag the away summary', summary.capped === false && summary.credited === snap);

      idle.stop();
      check('stop restores the tab title', document.title === 'Arcade hall');
      wall += 5000;
      pump();
      check('stop ends the tick loop', document.title === 'Arcade hall');
      check('lastSeen is the clock the game can save', idle.lastSeen() === wall);
      check('ticks are a 250ms interval, not animation frames', tickMs === 250 && tick === null);
    })();

    (function hiddenThrottle() {
      var cash = 0;
      var rate = 10;
      var idle = Idle.create({
        getRate: function () { return rate; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 100,
        offlineRate: 0.5,
        title: { label: 'Night Market', unit: '$' }
      });
      document.title = 'Arcade hall';
      var summary = idle.start(wall - 80 * 1000);
      check('throttle fixture opens under the cap', summary && summary.credited === 80 && summary.capped === false);
      rate = 40;
      hidden = true;
      wall += 1000;
      perf += 50;
      var before = cash;
      var credited = summary.credited;
      pump();
      check('a hidden tab with one-second gaps pays the full rate', cash - before === 40);
      check('a one-second hidden gap is not offline', summary.credited === credited && summary.capped === false);
      check('a hidden tab keeps the title current', document.title === '+$' + Arcade.fmt(40) + '/s · Night Market');
      idle.stop();
      hidden = false;

      cash = 0;
      rate = 10;
      idle = Idle.create({
        getRate: function () { return rate; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 100,
        offlineRate: 0.5
      });
      idle.start(wall);
      hidden = true;
      for (var i = 0; i < 10; i++) { wall += 60000; perf += 1000; pump(); }
      var full = 10 * 600;
      check('ten hidden minutes, woken each minute, pays within 2% of full income', Math.abs(cash - full) <= full * 0.02 && cash > full * 0.5);
      idle.stop();
      hidden = false;
    })();

    (function reopen() {
      var cash = 0;
      var rate = 8;
      var cap = 4 * 3600;
      var idle = Idle.create({
        getRate: function () { return rate; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: cap,
        offlineRate: 0.5
      });
      var hour = idle.start(wall - 3600 * 1000);
      var hourPay = rate * 3600 * 0.5;
      check('reopening after one hour credits the offline rate', hour && hour.away === 3600 && hour.credited === 3600 && hour.capped === false && Math.abs(hour.gained - hourPay) <= hourPay * 0.01 && Math.abs(cash - hourPay) <= hourPay * 0.01);
      idle.stop();
      cash = 0;
      var closed = idle.start(wall - 30 * 3600 * 1000);
      var capPay = rate * cap * 0.5;
      check('reopening after thirty hours is held to the four hour cap', closed && closed.away === 30 * 3600 && closed.credited === cap && closed.capped === true && Math.abs(closed.gained - capPay) <= capPay * 0.01 && Math.abs(cash - capPay) <= capPay * 0.01);
      idle.stop();
    })();

    (function milestonesAndGrowth() {
      check('24 owned has no milestone', Idle.milestoneMult(24) === 1);
      check('25 owned applies x2 once', Idle.milestoneMult(25) === 2 && Idle.milestoneMult(25) === 2);
      check('50 owned stacks to x4', Idle.milestoneMult(50) === 4);
      check('100 owned stacks to x8', Idle.milestoneMult(100) === 8);
      var savedOwned = 25;
      check('a reloaded owned count keeps the same milestone', Idle.milestoneMult(savedOwned) === 2);
      check('the default growth is 1.07', Idle.DEFAULT_GROWTH === 1.07);
      var worked = Idle.bulkCost(5, undefined, 10, 10);
      var bruteWorked = brute(5, 1.07, 10, 10);
      check('the worked x10 cost is 135.90', worked.toFixed(2) === '135.90' && Math.abs(worked - bruteWorked) <= 1e-9 * bruteWorked);
      var affordable = Idle.maxAffordable(5, undefined, 10, worked);
      check('max at the default growth buys the worked ten', affordable === 10 && Idle.bulkCost(5, undefined, 10, affordable) <= worked + 1e-6);
    })();

    (function saves() {
      var stamps = [];
      var idle = Idle.create({
        getRate: function () { return 1; },
        apply: function () {},
        save: function (seen) { stamps.push(seen); }
      });
      idle.start(wall);
      check('starting does not write a save', stamps.length === 0);
      hidden = true;
      document.dispatchEvent(new Event('visibilitychange'));
      check('hiding the tab saves lastSeen', stamps.length === 1 && stamps[0] === wall);
      hidden = false;
      document.dispatchEvent(new Event('visibilitychange'));
      check('showing the tab does not save', stamps.length === 1);
      wall += 5000;
      window.dispatchEvent(new Event('pagehide'));
      check('pagehide saves the new timestamp', stamps.length === 2 && stamps[1] === wall);
      var count = stamps.length;
      wall += 29999;
      pump();
      check('just under 30 seconds does not save again', stamps.length === count);
      wall += 1;
      pump();
      check('every 30 seconds saves lastSeen', stamps.length === count + 1 && stamps[stamps.length - 1] === wall);
      idle.stop();
      var afterStop = stamps.length;
      hidden = true;
      document.dispatchEvent(new Event('visibilitychange'));
      window.dispatchEvent(new Event('pagehide'));
      check('stop ends the save listeners', stamps.length === afterStop);
      hidden = false;
    })();

    (function plainTitle() {
      var savedFmt = Arcade.fmt;
      var savedFmtI = Arcade.fmtI;
      var warns = 0;
      var realWarn = console.warn;
      console.warn = function () { warns++; };
      Arcade.fmt = undefined;
      Arcade.fmtI = undefined;
      try {
        var idle = Idle.create({
          getRate: function () { return 10.5; },
          apply: function () {},
          title: { label: 'Night Market', unit: '$' }
        });
        document.title = 'Arcade hall';
        idle.start(wall);
        check('a missing fmt warns once and uses plain whole numbers', warns === 1 && document.title === '+$10/s · Night Market');
        idle.stop();
        idle = Idle.create({
          getRate: function () { return 1200; },
          apply: function () {},
          title: { label: 'Night Market', unit: '$' }
        });
        document.title = 'Arcade hall';
        idle.start(wall);
        check('the plain fallback keeps fmtI scale above 1000', document.title === '+$1.20K/s · Night Market' && warns === 1);
        idle.stop();
      } finally {
        Arcade.fmt = savedFmt;
        Arcade.fmtI = savedFmtI;
        console.warn = realWarn;
      }
    })();

    (function bulk() {
      var cases = [
        [10, 2, 0, 10],
        [10, 2, 0, 100],
        [4, 1.5, 3, 10],
        [15, 1.15, 7, 100],
        [8, 1, 5, 100]
      ];
      cases.forEach(function (row) {
        var got = Idle.bulkCost(row[0], row[1], row[2], row[3]);
        var expect = brute(row[0], row[1], row[2], row[3]);
        check('bulk cost matches a loop for x' + row[3] + ' at growth ' + row[1], close(got, expect));
      });
      check('buying nothing costs nothing', Idle.bulkCost(10, 1.15, 4, 0) === 0);

      var exact = Idle.bulkCost(10, 2, 0, 10);
      check('max buys a ladder it can pay for exactly', Idle.maxAffordable(10, 2, 0, exact) === 10);
      var short = exact - 1;
      var fewer = Idle.maxAffordable(10, 2, 0, short);
      check('max never overspends a short cash pile', fewer === 9 && Idle.bulkCost(10, 2, 0, fewer) <= short && brute(10, 2, 0, fewer) <= short);
      check('one more than max does not fit', Idle.bulkCost(10, 2, 0, fewer + 1) > short);

      var piles = [
        [15, 1.15, 4, 1e6],
        [3, 1.07, 20, 5e5],
        [100, 1, 0, 950],
        [25, 1.5, 2, 24]
      ];
      piles.forEach(function (row) {
        var bought = Idle.maxAffordable(row[0], row[1], row[2], row[3]);
        var cost = Idle.bulkCost(row[0], row[1], row[2], bought);
        var next = Idle.bulkCost(row[0], row[1], row[2], bought + 1);
        check('max stays inside cash at growth ' + row[1], bought >= 0 && cost <= row[3] + 1e-6 && next > row[3]);
      });
      check('max buys nothing when the next price is out of reach', Idle.maxAffordable(50, 1.15, 0, 49) === 0);
    })();

    check('the core leaves storage alone', Object.keys(localStorage).slice().sort().join('|') === storageBefore);
    sum.className = 'pass';
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.className = 'fail';
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    hidden = false;
    Date.now = realNow;
    performance.now = realPerf;
    window.setInterval = realSet;
    window.clearInterval = realClear;
    document.title = originalTitle;
    button.disabled = false;
  }
};
</script>
</html>
