<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Idle core checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#131820;color:#e8edf5;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#96eba4}.fail{color:#ff9a9a}#summary{font-weight:bold}
</style>
<h1>Idle core checks</h1>
<p>The shared idle core, driven by a fake clock. It does not touch saves.</p>
<p><a href="../">Back to arcade</a></p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script>
'use strict';
document.querySelector('#run').onclick = function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var storageBefore = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function close(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function brute(base, growth, owned, count) {
    var total = 0;
    for (var i = 0; i < count; i++) total += base * Math.pow(growth, owned + i);
    return total;
  }
  var wall = 1700000000000;
  var perf = 5000;
  var hidden = false;
  var realNow = Date.now;
  var realPerf = performance.now.bind(performance);
  var realRAF = window.requestAnimationFrame;
  var realCAF = window.cancelAnimationFrame;
  var queue = [];
  var seq = 1;
  Date.now = function () { return wall; };
  performance.now = function () { return perf; };
  window.requestAnimationFrame = function (fn) {
    var id = seq++;
    queue.push({ id: id, fn: fn });
    return id;
  };
  window.cancelAnimationFrame = function (id) {
    queue = queue.filter(function (item) { return item.id !== id; });
  };
  function pump() {
    var item = queue.shift();
    if (item) item.fn();
  }
  try {
    Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return hidden; } });
  } catch (e) {
    check('the test can fake a hidden tab', false);
  }
  var originalTitle = document.title;
  try {
    check('engine fmt is loaded', typeof Arcade.fmt === 'function' && Arcade.fmt(1200) === '1.20K');

    (function capAndMultiplier() {
      var cash = 0;
      var calls = 0;
      var idle = Idle.create({
        getRate: function () { return 10; },
        apply: function (amount) { calls++; cash += amount; },
        maxOfflineSec: 100,
        offlineRate: 0.5,
        title: { label: 'Night Market', unit: '$' }
      });
      var early = idle.start(wall - 59 * 1000);
      check('under a minute away returns null', early === null);
      check('under a minute credits nothing', cash === 0 && calls === 0);
      idle.stop();

      cash = 0; calls = 0;
      var minute = idle.start(wall - 60 * 1000);
      check('one minute away is credited once', minute && minute.away === 60 && minute.credited === 60 && minute.capped === false);
      check('one minute uses the offline multiplier', minute.gained === 300 && cash === 300 && calls === 1);
      idle.stop();

      cash = 0; calls = 0;
      var capped = idle.start(wall - 250 * 1000);
      check('offline catch-up is held to the cap', capped && capped.away === 250 && capped.credited === 100 && capped.capped === true);
      check('capped earnings are one closed-form grant', capped.gained === 500 && cash === 500 && calls === 1);
      idle.stop();

      cash = 0;
      var back = idle.start(wall + 3600 * 1000);
      check('a clock that goes backward credits nothing', back === null && cash === 0);
      idle.stop();

      cash = 0;
      var boosted = Idle.create({
        getRate: function () { return 4; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 1000,
        offlineRate: 2
      });
      var held = boosted.start(wall - 100 * 1000);
      check('an offline rate above 1 pays no more than active play', held && held.gained === 400 && cash === 400);
      boosted.stop();
    })();

    (function defaultsAndJump() {
      var cash = 0;
      var idle = Idle.create({
        getRate: function () { return 2; },
        apply: function (amount) { cash += amount; }
      });
      var nineHours = 9 * 3600;
      var summary = idle.start(wall - nineHours * 1000);
      check('the default cap is eight hours', summary && summary.credited === 8 * 3600 && summary.capped === true && summary.away === nineHours);
      check('the default offline rate does not beat active play', summary.gained === 2 * 8 * 3600 && cash === summary.gained);
      idle.stop();
    })();

    (function sessionGaps() {
      var cash = 0;
      var rate = 1200;
      var idle = Idle.create({
        getRate: function () { return rate; },
        apply: function (amount) { cash += amount; },
        maxOfflineSec: 1000,
        offlineRate: 0.5,
        title: { label: 'Night Market', unit: '$' }
      });
      document.title = 'Arcade hall';
      var summary = idle.start(wall - 120 * 1000);
      check('opening summary is the object later gaps update', summary && summary.credited === 120 && summary.gained === 72000);
      var titleAtStart = document.title;
      check('tab title uses engine fmt', titleAtStart === '+$' + Arcade.fmt(1200) + '/s · Night Market');

      hidden = false;
      wall += 2000;
      perf += 2000;
      var before = cash;
      var credited = summary.credited;
      pump();
      check('a visible gap pays the full rate', cash - before === 2400);
      check('active play is not folded into the away summary', summary.credited === credited);

      rate = 2400;
      wall += 500;
      perf += 500;
      pump();
      check('the title waits a second before refreshing', document.title === titleAtStart);
      wall += 500;
      perf += 500;
      pump();
      check('the title refreshes once a second', document.title === '+$' + Arcade.fmt(2400) + '/s · Night Market');

      hidden = true;
      wall += 5000;
      perf += 5000;
      before = cash;
      credited = summary.credited;
      var gained = summary.gained;
      pump();
      check('five hidden seconds stay active play', cash - before === 2400 * 5 && summary.credited === credited);

      wall += 6000;
      perf += 6000;
      before = cash;
      pump();
      check('a hidden gap past five seconds is offline', cash - before === 2400 * 6 * 0.5);
      check('the hidden gap is added to the summary', summary.credited === credited + 6 && summary.gained === gained + 2400 * 6 * 0.5 && summary.capped === false);

      var mark = cash;
      var snap = summary.credited;
      wall -= 30000;
      pump();
      check('a backward jump during play credits nothing', cash === mark && summary.credited === snap);

      hidden = false;
      wall += 1500 * 1000;
      perf += 1500 * 1000;
      before = cash;
      var awayBefore = summary.away;
      pump();
      check('a forward jump is held to the cap', cash - before === 2400 * 1000 * 0.5);
      check('a forward jump flags the summary', summary.capped === true && summary.credited === snap + 1000 && summary.away === awayBefore + 1500);

      idle.stop();
      check('stop restores the tab title', document.title === 'Arcade hall');
      wall += 5000;
      pump();
      check('stop ends the tick loop', document.title === 'Arcade hall');
      check('lastSeen is the clock the game can save', idle.lastSeen() === wall);
    })();

    (function bulk() {
      var cases = [
        [10, 2, 0, 10],
        [10, 2, 0, 100],
        [4, 1.5, 3, 10],
        [15, 1.15, 7, 100],
        [8, 1, 5, 100]
      ];
      cases.forEach(function (row) {
        var got = Idle.bulkCost(row[0], row[1], row[2], row[3]);
        var expect = brute(row[0], row[1], row[2], row[3]);
        check('bulk cost matches a loop for x' + row[3] + ' at growth ' + row[1], close(got, expect));
      });
      check('buying nothing costs nothing', Idle.bulkCost(10, 1.15, 4, 0) === 0);

      var exact = Idle.bulkCost(10, 2, 0, 10);
      check('max buys a ladder it can pay for exactly', Idle.maxAffordable(10, 2, 0, exact) === 10);
      var short = exact - 1;
      var fewer = Idle.maxAffordable(10, 2, 0, short);
      check('max never overspends a short cash pile', fewer === 9 && Idle.bulkCost(10, 2, 0, fewer) <= short && brute(10, 2, 0, fewer) <= short);
      check('one more than max does not fit', Idle.bulkCost(10, 2, 0, fewer + 1) > short);

      var piles = [
        [15, 1.15, 4, 1e6],
        [3, 1.07, 20, 5e5],
        [100, 1, 0, 950],
        [25, 1.5, 2, 24]
      ];
      piles.forEach(function (row) {
        var bought = Idle.maxAffordable(row[0], row[1], row[2], row[3]);
        var cost = Idle.bulkCost(row[0], row[1], row[2], bought);
        var next = Idle.bulkCost(row[0], row[1], row[2], bought + 1);
        check('max stays inside cash at growth ' + row[1], bought >= 0 && cost <= row[3] + 1e-6 && next > row[3]);
      });
      check('max buys nothing when the next price is out of reach', Idle.maxAffordable(50, 1.15, 0, 49) === 0);
    })();

    check('the core leaves storage alone', Object.keys(localStorage).slice().sort().join('|') === storageBefore);
    sum.className = 'pass';
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.className = 'fail';
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    hidden = false;
    Date.now = realNow;
    performance.now = realPerf;
    window.requestAnimationFrame = realRAF;
    window.cancelAnimationFrame = realCAF;
    document.title = originalTitle;
    button.disabled = false;
  }
};
</script>
</html>
