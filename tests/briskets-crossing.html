<!doctype html><html lang="en"><meta charset="utf-8"><title>Brisket's Crossing checks</title><style>body{font:16px system-ui;background:#241910;color:#f2eedb;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0}</style><h1>Brisket's Crossing checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div><script>
'use strict';
document.querySelector('#run').onclick=async()=>{const sum=document.querySelector('#summary'),list=document.querySelector('#results'),button=document.querySelector('#run');button.disabled=true;list.replaceChildren();sum.textContent='Running…';let frame;const managed=k=>k==='briskets-crossing-save-v1'||k==='arcade-index-v1'||k==='arcade-settings-v1'||k.startsWith('arcade-backup:briskets-crossing-save-v1:')||k.startsWith('arcade-backup:arcade-index-v1:');const backup=new Map(Object.keys(localStorage).filter(managed).map(k=>[k,localStorage.getItem(k)]));let n=0;
const check=(name,ok)=>{n++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name;list.appendChild(li);if(!ok)throw Error(name);};const wait=()=>new Promise(r=>setTimeout(r,280));
try{Object.keys(localStorage).filter(managed).forEach(k=>localStorage.removeItem(k));frame=document.createElement('iframe');frame.title="Brisket's Crossing test instance";frame.src='../games/briskets-crossing/index.html';await new Promise((r,j)=>{const timer=setTimeout(()=>j(Error('load timed out')),20000);frame.onload=()=>{clearTimeout(timer);r();};document.querySelector('#game').appendChild(frame);});const w=frame.contentWindow,d=w.document,H=w.__brisket,M=H.M;check('local test hook and original demo',!!H&&H.state===null);await wait();check('demo never creates a score save',localStorage.getItem('briskets-crossing-save-v1')===null);
d.querySelector('[data-start="2"]').click();check('two-player start creates independent turns',H.state.players.length===2&&H.state.phase==='ready');d.querySelector('[data-launch]').click();check('start focuses active game',d.activeElement===d.querySelector('#sea')&&d.querySelector('#curtain').hidden);H.state.players.forEach(p=>p.lanes.forEach(l=>{if(l.kind==='road')l.items=[];}));
const P=()=>M.current(H.state);const tap=ms=>new Promise(r=>setTimeout(r,ms));const plant=()=>{const p=P();p.hop=0;p.clearing=0;p.tx=p.x;p.ty=p.y;};const nudge=async(down,up)=>{const y0=P().y;down();for(let i=0;i<30&&P().hop<=0&&P().y===y0;i++)await tap(20);up();for(let i=0;i<30&&P().hop>0;i++)await tap(20);return y0;};let y=await nudge(()=>d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true})),()=>d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true})));check('keyboard actually hops toward the lanterns',P().y<y&&P().hop===0);
const hop=d.querySelector('[data-hold="up"]');y=await nudge(()=>hop.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:8,bubbles:true})),()=>hop.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:8,bubbles:true})));check('touch Hop button hops',P().y<y&&P().hop===0);
const sea=d.querySelector('#sea'),rc=sea.getBoundingClientRect();y=P().y;sea.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:9,bubbles:true,clientX:rc.left+rc.width*.5,clientY:rc.top+20}));for(let i=0;i<30&&P().hop<=0&&P().y===y;i++)await tap(20);for(let i=0;i<30&&P().hop>0;i++)await tap(20);check('tapping ahead hops that way',P().y<y&&P().hop===0);
H.pause();y=P().y;await wait();check('pause freezes Brisket',P().y===y&&H.state.paused);d.querySelector('[data-resume]').click();check('resume clears pause',!H.state.paused);
plant();P().y=8;P().x=4.5;P().tx=4.5;P().ty=8;P().best=8;P().lanes.find(l=>l.y===8).items=[{x:3,w:2}];const lives=P().lives;await wait();check('a cart costs a life and sends Brisket back',P().lives===lives-1&&P().y===M.START.y);
plant();P().y=3;P().x=1.5;P().tx=1.5;P().ty=3;P().best=3;P().lanes.find(l=>l.y===3).items=[{x:8,w:2}];await wait();check('open water costs a life',P().y===M.START.y);
const sc=P().score;plant();P().y=1;P().x=M.HOME_COLS[0]+.5;P().tx=P().x;P().ty=1;P().best=1;P().lanes.find(l=>l.y===1).items=[{x:0,w:4}];await nudge(()=>d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true})),()=>d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true})));check('a lantern post pays and sends Brisket back',P().homes[0].filled&&P().score>sc&&P().y===M.START.y&&P().hop===0);
plant();H.state.players[0].lives=1;H.state.players[0].score=240;P().y=8;P().x=4.5;P().tx=4.5;P().ty=8;P().lanes.find(l=>l.y===8).items=[{x:3,w:2}];await wait();check('losing the last life ends the turn; second player waits behind ready screen',H.state.active===1&&H.state.phase==='ready'&&!d.querySelector('#curtain').hidden);d.querySelector('[data-launch]').click();H.state.players[1].lives=1;H.state.players[1].score=100;const q=M.current(H.state);q.hop=0;q.y=8;q.x=4.5;q.tx=4.5;q.ty=8;q.lanes.find(l=>l.y===8).items=[{x:3,w:2}];await wait();check('first finished score asks for initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='ABC';d.querySelector('#initialForm').requestSubmit();check('second score has separate initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='XYZ';d.querySelector('#initialForm').requestSubmit();const saved=JSON.parse(localStorage.getItem('briskets-crossing-save-v1'));check('both scores saved in rank order',saved.scores.length===2&&saved.scores[0].name==='ABC'&&saved.scores[0].score===240&&saved.scores[1].name==='XYZ');check('finished run cannot submit twice',!d.querySelector('#initialForm'));
const R=M.create(1,7);M.ready(R);const rp=M.current(R);rp.homes.forEach(h=>h.filled=true);rp.homes[4].filled=false;rp.y=1;rp.x=rp.homes[4].x;rp.best=1;rp.lanes.find(l=>l.y===1).items=[{x:rp.x-1,w:3}];M.hop(R,0,-1);M.advance(R,M.HOP+.02);check('the last lantern clears the crossing',rp.clearing>0);for(let i=0;i<8;i++)M.advance(R,.25);check('the next run is faster',rp.round===2&&M.plan(2).speed>M.plan(1).speed);
for(const [width,height]of [[320,568],[375,812],[667,375],[1366,768],[1920,1080],[3440,1440]]){frame.style.width=width+'px';frame.style.height=height+'px';H.title();await wait();check(width+'×'+height+' no document overflow',d.documentElement.scrollWidth<=width&&d.documentElement.scrollHeight<=height);check(width+'×'+height+' playable world fills available screen',d.querySelector('#sea').getBoundingClientRect().height>150);check(width+'×'+height+' touch targets stay 44px',Array.from(d.querySelectorAll('[data-hold]')).every(b=>b.getBoundingClientRect().height>=44));}
frame.style.width='375px';frame.style.height='812px';d.documentElement.style.setProperty('--arc-text','1.3');H.title();await wait();check('larger text stays inside phone',d.documentElement.scrollWidth<=375&&d.querySelector('#panel').scrollWidth<=d.querySelector('#panel').clientWidth);check('high scores reject markup and unsafe numbers',M.scores([{name:'<x>',score:9},{name:'AAA',score:Infinity}]).length===0);H.title();const pad={connected:true,axes:[0,0],buttons:Array.from({length:16},()=>({pressed:false}))};const prior=w.navigator.getGamepads.bind(w.navigator);w.navigator.getGamepads=()=>[pad];pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad starts from title menu',H.state&&H.state.phase==='ready');pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad launches without keyboard',H.state.phase==='playing');M.current(H.state).lanes.forEach(l=>{if(l.kind==='road')l.items=[];});const before=M.current(H.state).y;pad.buttons[0].pressed=true;for(let i=0;i<30&&M.current(H.state).hop<=0&&M.current(H.state).y===before;i++)await tap(20);pad.buttons[0].pressed=false;for(let i=0;i<30&&M.current(H.state).hop>0;i++)await tap(20);check('gamepad hops toward the lanterns',M.current(H.state).y<before);pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad pauses',H.state.paused);pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad resumes',!H.state.paused);w.navigator.getGamepads=prior;sum.textContent='PASS — '+n+' checks.';
}catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();Object.keys(localStorage).filter(managed).forEach(k=>localStorage.removeItem(k));for(const[k,v]of backup)localStorage.setItem(k,v);button.disabled=false;}};
</script></html>
