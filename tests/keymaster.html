<!doctype html><html lang="en"><meta charset="utf-8"><title>Keymaster checks</title><style>body{font:16px system-ui;background:#2a2420;color:#f4eddc;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0;background:#fff}</style><h1>Keymaster checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div><script>
'use strict';
// Keymaster: the deal analyzer's arithmetic, the sellers' answers, the first year, KM-STREET's five lessons and a full run
// along Alder Street with the real buttons, on phone and desktop.
document.querySelector('#run').onclick=async()=>{
 const sum=document.querySelector('#summary'),list=document.querySelector('#results'),button=document.querySelector('#run');
 button.disabled=true;list.replaceChildren();sum.textContent='Running…';let frame,n=0;
 const OWN=k=>k==='keymaster-save-v1'||k.startsWith('arcade-backup:keymaster-save-v1');
 const HUB=k=>k==='arcade-index-v1'||k.startsWith('arcade-backup:arcade-index-v1');   // the hub's list; every game's report backs it up
 const kept={},hubKept={};
 for(const k of Object.keys(localStorage))if(HUB(k))hubKept[k]=localStorage.getItem(k);
 for(const k of Object.keys(localStorage))if(OWN(k)){kept[k]=localStorage.getItem(k);localStorage.removeItem(k);}
 const others=()=>Object.keys(localStorage).filter(k=>!OWN(k)&&!HUB(k)).sort().map(k=>k+'='+localStorage.getItem(k)).join('|');
 const keys=others();
 const open=async()=>{const f=document.createElement('iframe');f.title='Keymaster test instance';f.src='../games/keymaster/index.html';
  await new Promise((r,j)=>{const t=setTimeout(()=>j(Error('load timed out')),20000);f.onload=()=>{clearTimeout(t);r();};document.querySelector('#game').appendChild(f);});return f;};
 const check=(name,ok)=>{n++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name;list.appendChild(li);if(!ok)throw Error(name);};
 const near=(a,b,e=0.01)=>Math.abs(a-b)<=e;const wait=(ms=60)=>new Promise(r=>setTimeout(r,ms));
 try{
  frame=document.createElement('iframe');frame.title='Keymaster test instance';frame.src='../games/keymaster/index.html';
  await new Promise((r,j)=>{const t=setTimeout(()=>j(Error('load timed out')),20000);frame.onload=()=>{clearTimeout(t);r();};document.querySelector('#game').appendChild(frame);});
  const w=frame.contentWindow,d=w.document,H=w.__keymaster,M=H.M,L=M.LISTING;
  const click=sel=>{const b=d.querySelector(sel);if(!b)throw Error('no button '+sel);b.click();};
  const text=sel=>d.querySelector(sel).textContent;
  check('the game loads with its test hook on the first home of the street',!!H&&L.ask===240000&&text('#addr')===L.address+', Millbrook'&&M.STREET.length===5);
  // ---- the arithmetic, checkable on paper
  check('mortgage: $180,000 at 7% over 30 years is $1,197.54 a month',near(M.payment(180000,0.07,30),1197.54,0.01));
  check('a zero loan has no payment',M.payment(0,0.07,30)===0);
  check('first year pays down $1,828 of a $180,000 loan',near(M.principalYearOne(180000,0.07,30),1828,1));
  const a=M.analyze({price:216000,down:0.25,rehab:'full'});
  check('rent is both units: $1,100 + $1,200',a.rent===2300);
  check('set aside 10% of rent for empty months and repairs',near(a.setAside,230));
  check('taxes and insurance are $425 a month',near(a.fixed,425));
  check('net income a year: (2300 − 230 − 425) × 12 = $19,740',near(a.noi,19740));
  check('cap rate is net income on price (9.1%)',near(a.capRate,19740/216000,1e-9));
  check('cash in is down payment + 3% closing + the work',near(a.cashIn,54000+6480+18000));
  check('cash-on-cash is a year of cash flow on the cash in',near(a.cashOnCash,a.cashFlow*12/a.cashIn,1e-9));
  check('the 1% rule: $2,300 on $216,000 passes',a.onePercent>=0.01);
  check('after-repair value is net income over the 7.5% local cap rate, to the nearest $1,000',a.arv===263000);
  check('equity on day one is value less price and work',a.equity===263000-216000-18000);
  check('a bigger down payment means a smaller mortgage',M.analyze({price:216000,down:0.25,rehab:'full'}).mortgage<M.analyze({price:216000,down:0.2,rehab:'full'}).mortgage);
  // ---- the sellers
  check('at 90% of asking or more they say yes',M.respond(216000).answer==='yes'&&M.respond(240000).answer==='yes');
  check('from 84% to just under 90% they counter at 90%',M.respond(210000).answer==='counter'&&M.respond(210000).price===216000&&M.respond(202000).answer==='counter');
  check('below 84% they say no',M.respond(200000).answer==='no');
  // ---- the first year and its verdict
  const y=M.firstYear({price:216000,down:0.25,rehab:'full'});
  check('the year has twelve months, the furnace in May and Unit A empty in September',y.months.length===12&&y.months[4].cost===1400&&y.months[8].rent===1200);
  check('the year adds up: cash + loan paid down + day-one equity',near(y.total,y.cash+y.principal+y.equity,1e-6));
  check('growth is shown but not counted',y.growth>0&&!near(y.total,y.cash+y.principal+y.equity+y.growth,1));
  check('buying right is a great buy (216k, full renovation)',M.verdict(y.onCash).word==='A great buy');
  check('overpaying as-is is a costly buy (240k)',M.verdict(M.firstYear({price:240000,down:0.25,rehab:'asis'}).onCash).word==='A costly buy');
  check('asking price with the full renovation is solid, not great',M.verdict(M.firstYear({price:240000,down:0.25,rehab:'full'}).onCash).word==='A solid buy');
  // ---- KM-STREET: each home teaches its lesson, checked as a fact over every price, down payment and plan
  const every=(h,f)=>{for(const price of [h.ask,M.lowestOf(h)])for(const down of [0.2,0.25])for(const rehab of Object.keys(h.plans))if(!f(M.firstYear({price,down,rehab},h)))return false;return true;};
  const home=id=>M.STREET.find(h=>h.id===id);
  check('3 Alder, the pretty one, never pays at any price or plan',every(home('alder3'),y=>y.onCash<0));
  check('9 Alder passes the 1% rule yet is always worth less than its price',every(home('alder9'),y=>y.analysis.onePercent>=0.01&&y.analysis.equity<0&&y.onCash<0));
  check('22 Alder barely pays as it is, but pays well refreshed',M.firstYear({price:235000,down:0.2,rehab:'asis'},home('alder22')).onCash<0&&M.firstYear({price:235000,down:0.2,rehab:'refresh'},home('alder22')).onCash>=0.3);
  check('14 Alder is a costly buy at asking as it is, and a great one at the sellers\' lowest',M.firstYear({price:240000,down:0.25,rehab:'asis'},home('alder14')).onCash<0&&M.firstYear({price:216000,down:0.25,rehab:'refresh'},home('alder14')).onCash>=0.3);
  const plan=M.newRun();[[216000,0.25],[null],[235000,0.2],[null],[138000,0.2]].forEach(([price,down])=>price?M.buyHome(plan,{price,down,rehab:'refresh'}):M.passHome(plan));
  check('the three good homes, refreshed, fit in $200,000 and win the street',M.finished(plan)&&M.won(plan)&&M.paying(plan)===3&&plan.cash>0);
  const big=M.newRun();M.buyHome(big,{price:216000,down:0.25,rehab:'full'});M.passHome(big);M.buyHome(big,{price:235000,down:0.25,rehab:'full'});M.passHome(big);
  check('full work everywhere leaves too little cash for the cottage',!M.canAfford(big,{price:138000,down:0.2,rehab:'asis'}));
  check('a run cannot buy what it cannot afford',(()=>{try{M.buyHome(big,{price:150000,down:0.25,rehab:'full'});return false;}catch(e){return /cash/.test(e.message);}})());
  // ---- the real buttons, one run along the street
  check('it opens on 14 Alder at asking, 25% down, the refresh, with $200,000 and the goal',text('#offer')==='$240,000'&&d.querySelector('[data-down="0.25"]').getAttribute('aria-checked')==='true'&&d.querySelector('[data-rehab="refresh"]').getAttribute('aria-checked')==='true'&&text('#cash')==='$200,000'&&/0 of 3/.test(text('#goal'))&&d.querySelectorAll('#doors li').length===5);
  const flow0=text('#flow');click('[data-offer="-2000"]');
  check('− lowers the offer by $2,000 and the worksheet follows',text('#offer')==='$238,000'&&text('#flow')!==flow0);
  click('[data-rehab="full"]');check('choosing the full renovation changes the rent',text('#rent')==='$2,300');
  click('[data-down="0.2"]');check('20% down borrows 80%',/80% borrowed/.test(text('#loanLabel')));click('[data-down="0.25"]');click('[data-rehab="refresh"]');
  for(let i=0;i<14;i++)click('[data-offer="-2000"]');
  check('offering $210,000 shows the measures in their colours',text('#offer')==='$210,000'&&d.querySelector('[data-m="one"]').className==='good');
  click('#offerBtn');await wait();
  check('a low offer gets a counter at $216,000',!d.querySelector('#answer').hidden&&/216,000/.test(text('#answer'))&&!!d.querySelector('[data-act="take"]'));
  check('the worksheet is locked while you answer',d.querySelector('#offerBtn').disabled&&d.querySelector('[data-offer="2000"]').disabled);
  click('[data-act="take"]');await wait();
  check('taking the counter buys it: twelve months, a verdict, and it counts',d.querySelectorAll('.months li').length===12&&/A great buy/.test(text('#answer'))&&/counts toward your street/.test(text('#answer')));
  check('the cash and the street follow: $68,480 spent, 1 of 3',text('#cash')==='$131,520'&&/1 of 3/.test(text('#goal'))&&d.querySelector('#doors li').className==='owned');
  click('[data-act="next"]');await wait();
  check('the next listing is 3 Alder, at its own asking price and plans',/^3 Alder Street/.test(text('#addr'))&&text('#offer')==='$285,000'&&/basement/.test(text('.rehab'))&&d.querySelector('#answer').hidden);
  for(let i=0;i<30;i++)click('[data-offer="-2000"]');
  click('#offerBtn');await wait();check('a lowball gets a no, with one more try',/They say no/.test(text('#answer'))&&!d.querySelector('#offerBtn').disabled);
  check('a no offers a way back to the offer',!!d.querySelector('[data-act="change"]'));click('[data-act="change"]');check('Change your offer moves focus to Offer more',d.activeElement===d.querySelector('[data-offer="2000"]'));
  click('#offerBtn');await wait();check('a second no and they sell to someone else, with the lesson',/another buyer/.test(text('#answer'))&&/not always a good rental/.test(text('#answer'))&&d.querySelector('#offerBtn').disabled);
  click('[data-act="next"]');await wait();
  check('22 Alder, the triplex, is next',/^22 Alder Street/.test(text('#addr'))&&text('#offer')==='$255,000');
  for(let i=0;i<10;i++)click('[data-offer="-2000"]');click('[data-down="0.2"]');click('#offerBtn');await wait();
  check('buying the triplex refreshed at $235,000 is a great buy',/You own 22 Alder Street/.test(text('#answer'))&&/A great buy/.test(text('#answer'))&&/2 of 3/.test(text('#goal')));
  click('[data-act="next"]');await wait();click('#passBtn');await wait();
  check('passing on 9 Alder shows what the next buyer did, and the lesson',/You pass on 9 Alder Street/.test(text('#answer'))&&/only a quick screen/.test(text('#answer')));
  click('[data-act="next"]');await wait();
  const cash=H.run().cash;H.run().cash=20000;H.render();
  check('without the cash, the offer is shut and the page says why',d.querySelector('#offerBtn').disabled&&!d.querySelector('#afford').hidden&&/you have \$20,000/.test(text('#afford')));
  H.run().cash=cash;H.render();
  for(let i=0;i<6;i++)click('[data-offer="-2000"]');click('[data-down="0.2"]');click('#offerBtn');await wait();
  check('the cottage finishes the street: 3 of 3',/You own 31 Alder Street/.test(text('#answer'))&&/See your street/.test(text('#answer')));
  click('[data-act="next"]');await wait();
  check('your street: won, five homes listed, the worksheet put away',/You built a street that pays/.test(text('#answer'))&&d.querySelectorAll('.yours li').length===5&&d.querySelector('.sheet').hidden);
  click('[data-act="again"]');await wait();
  check('walking the street again starts over with $200,000',/^14 Alder Street/.test(text('#addr'))&&text('#cash')==='$200,000'&&text('#offer')==='$240,000'&&!d.querySelector('.sheet').hidden);
  for(let i=0;i<30;i++)click('[data-offer="2000"]');check('the offer has a ceiling',text('#offer')==='$260,000'&&d.querySelector('[data-offer="2000"]').disabled);
  // ---- phone and desktop
  for(const [width,height] of [[320,568],[375,812],[812,375],[1366,768],[1920,1080]]){
   frame.style.width=width+'px';frame.style.height=height+'px';await wait(120);
   check(width+'×'+height+': nothing spills sideways',d.documentElement.scrollWidth<=width);
   check(width+'×'+height+': every button is at least 44px tall',Array.from(d.querySelectorAll('button')).filter(b=>b.offsetParent!==null).every(b=>b.getBoundingClientRect().height>=44));
  }
  // ---- KM-SAVE: the run is kept under keymaster-save-v1, resumes after a reload, and a damaged save is left alone
  const run0=M.newRun();M.buyHome(run0,{price:216000,down:0.25,rehab:'refresh'});M.passHome(run0);
  check('a saved run is valid and restores exactly',M.valid(M.serialize(run0))&&JSON.stringify(M.restore(M.serialize(run0)))===JSON.stringify(run0));
  const bad=o=>!M.valid(Object.assign(M.serialize(run0),o));
  check('a save with the wrong game, version, cash or listing count is refused',bad({game:'other'})&&bad({v:2})&&bad({cash:-1})&&bad({cash:'lots'})&&bad({at:3})&&bad({homes:[{id:'alder3',bought:false},{id:'alder14',bought:false}]}));
  const stored=()=>JSON.parse(localStorage.getItem('keymaster-save-v1')||'null');
  check('walking the street again saved a fresh run',stored()&&stored().at===0&&stored().cash===200000&&stored().homes.length===0);
  frame.style.width='375px';frame.style.height='812px';await wait(60);
  click('[data-act="again"]');await wait();
  for(let i=0;i<12;i++)click('[data-offer="-2000"]');click('#offerBtn');await wait();
  check('buying saves the run: one home, $131,520 left',stored().at===1&&stored().homes[0].bought===true&&stored().cash===131520);
  const hub=JSON.parse(localStorage.getItem('arcade-index-v1')||'{}').keymaster;
  check('the hub card hears how the street is going',!!hub&&hub.summary==='1 of 3 homes paying'&&/Listing 2 of 5/.test(hub.detail));
  const f2=await open(),d2=f2.contentWindow.document;
  check('closing and reopening resumes at 3 Alder with the same cash and doors',/^3 Alder Street/.test(d2.querySelector('#addr').textContent)&&d2.querySelector('#cash').textContent==='$131,520'&&d2.querySelector('#doors li').className==='owned');
  f2.remove();
  const damaged='{"v":1,"game":"keymaster","cash":-5,"at":0,"homes":[]}';localStorage.setItem('keymaster-save-v1',damaged);
  const f3=await open(),d3=f3.contentWindow.document;
  check('a damaged save starts a fresh street on screen',/^14 Alder Street/.test(d3.querySelector('#addr').textContent)&&f3.contentWindow.__keymaster.protect===true);
  d3.querySelector('#passBtn').click();await wait();
  check('…and is never written over, so it can still be recovered',localStorage.getItem('keymaster-save-v1')===damaged);
  f3.remove();
  check('no other game\'s save is touched',others()===keys);

  sum.textContent='PASS — '+n+' checks.';
 }catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();document.querySelectorAll('#game iframe').forEach(f=>f.remove());
  for(const k of Object.keys(localStorage))if(OWN(k))localStorage.removeItem(k);
  for(const [k,v] of Object.entries(kept))localStorage.setItem(k,v);
  for(const k of Object.keys(localStorage))if(HUB(k))localStorage.removeItem(k);
  for(const [k,v] of Object.entries(hubKept))localStorage.setItem(k,v);
  button.disabled=false;}
};
</script></html>
