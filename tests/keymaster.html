  frame.style.width='375px';frame.style.height='812px';await wait(60);
  H.begin();await wait();
  for(let i=0;i<4;i++)click('[data-offer="-2000"]');click('#offerBtn');await wait();
  check('buying saves the run: one home, $127,040 left',stored().at===1&&stored().homes[0].bought===true&&stored().cash===127040);
  const hub=JSON.parse(localStorage.getItem('arcade-index-v1')||'{}').keymaster;
  check('the hub card hears how the street is going',!!hub&&hub.summary==='1 of 3 homes paying'&&/Listing 2 of 5/.test(hub.detail));
  const f2=await open(),d2=f2.contentWindow.document;
  check('closing and reopening resumes at 3 Alder with the same cash and doors',/^3 Alder Street/.test(d2.querySelector('#addr').textContent)&&d2.querySelector('#cash').textContent==='$127,040'&&d2.querySelector('#doors li').className==='owned'&&/Pays you/.test(d2.querySelector('#doors li').textContent));
  f2.remove();
  const legacy='{"v":1,"game":"keymaster","cash":131520,"at":1,"homes":[{"id":"alder14","bought":true,"choice":{"price":216000,"down":0.25,"rehab":"refresh"},"onCash":0.364,"cashFlow":432,"yearCash":3829}]}';
  check('a keymaster-save-v1 from before this finish pass still validates at version 1',M.SAVE_VERSION===1&&M.valid(JSON.parse(legacy))&&!M.migrates);
  localStorage.setItem('keymaster-save-v1',legacy);
  const fOld=await open(),dOld=fOld.contentWindow.document;
  check('that save still opens on the next home, and the bought door pays you',/^3 Alder Street/.test(dOld.querySelector('#addr').textContent)&&dOld.querySelector('#cash').textContent==='$131,520'&&/Pays you/.test(dOld.querySelector('#doors li').textContent)&&/1 of 3/.test(dOld.querySelector('#goal').textContent));
  fOld.remove();
  const costly=JSON.parse(legacy);costly.cash=124800;costly.homes[0].onCash=-0.005;costly.homes[0].cashFlow=312;
  localStorage.setItem('keymaster-save-v1',JSON.stringify(costly));
  const fCost=await open(),dCost=fCost.contentWindow.document;
  check('a costly home in an old save still loads and does not count toward the street',/^3 Alder Street/.test(dCost.querySelector('#addr').textContent)&&dCost.querySelector('#cash').textContent==='$124,800'&&dCost.querySelector('#doors li').className==='owned costly'&&/Costly/.test(dCost.querySelector('#doors li').textContent)&&/0 of 3/.test(dCost.querySelector('#goal').textContent));
  fCost.remove();
  const damaged='{"v":1,"game":"keymaster","cash":-5,"at":0,"homes":[]}';localStorage.setItem('keymaster-save-v1',damaged);
  const f3=await open(),d3=f3.contentWindow.document;
  check('a damaged save starts a fresh street on screen',/^14 Alder Street/.test(d3.querySelector('#addr').textContent)&&f3.contentWindow.__keymaster.protect===true);
  d3.querySelector('#passBtn').click();await wait();
  check('…and is never written over, so it can still be recovered',localStorage.getItem('keymaster-save-v1')===damaged);
  f3.remove();
  check('no other game\'s save is touched',others()===keys);

  sum.textContent='PASS — '+n+' checks.';
 }catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();document.querySelectorAll('#game iframe').forEach(f=>f.remove());
  for(const k of Object.keys(localStorage))if(OWN(k))localStorage.removeItem(k);
  for(const [k,v] of Object.entries(kept))localStorage.setItem(k,v);
  for(const k of Object.keys(localStorage))if(HUB(k))localStorage.removeItem(k);
  for(const [k,v] of Object.entries(hubKept))localStorage.setItem(k,v);
  button.disabled=false;}
};
