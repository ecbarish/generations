<!doctype html><html lang="en"><meta charset="utf-8"><title>Ember Bricks checks</title><style>body{font:16px system-ui;background:#241410;color:#f2eedb;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0}</style><h1>Ember Bricks checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div><script>
'use strict';
document.querySelector('#run').onclick=async()=>{const sum=document.querySelector('#summary'),list=document.querySelector('#results'),button=document.querySelector('#run');button.disabled=true;list.replaceChildren();sum.textContent='Running…';let frame;const managed=k=>k==='ember-bricks-save-v1'||k==='arcade-index-v1'||k==='arcade-settings-v1'||k.startsWith('arcade-backup:ember-bricks-save-v1:')||k.startsWith('arcade-backup:arcade-index-v1:');const backup=new Map(Object.keys(localStorage).filter(managed).map(k=>[k,localStorage.getItem(k)]));let n=0;

P().lives=1;P().score=240;P().stuck=false;P().peel=80;P().clearing=0;P().ball.x=500;P().ball.y=620;P().ball.vx=0;P().ball.vy=400;await wait();check('losing the last life ends the turn; second player waits behind ready screen',H.state.active===1&&H.state.phase==='ready'&&!d.querySelector('#curtain').hidden);d.querySelector('[data-launch]').click();H.state.players[1].lives=1;H.state.players[1].score=100;const q=M.current(H.state);q.stuck=false;q.peel=80;q.ball.x=500;q.ball.y=620;q.ball.vx=0;q.ball.vy=400;await wait();check('first finished score asks for initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='ABC';d.querySelector('#initialForm').requestSubmit();check('second score has separate initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='XYZ';d.querySelector('#initialForm').requestSubmit();const saved=JSON.parse(localStorage.getItem('ember-bricks-save-v1'));check('both scores saved in rank order',saved.scores.length===2&&saved.scores[0].name==='ABC'&&saved.scores[0].score===240&&saved.scores[1].name==='XYZ');check('finished run cannot submit twice',!d.querySelector('#initialForm'));

}catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();Object.keys(localStorage).filter(managed).forEach(k=>localStorage.removeItem(k));for(const[k,v]of backup)localStorage.setItem(k,v);button.disabled=false;}};
