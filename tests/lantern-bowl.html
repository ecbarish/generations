<!doctype html><html lang="en"><meta charset="utf-8"><title>Lantern Bowl checks</title>
<style>body{font:16px system-ui;background:#141820;color:#f6edd4;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0}</style>
<h1>Lantern Bowl checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div>
<script src="../games/lantern-bowl/model.js"></script>
<script src="../games/lantern-bowl/view.js"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async () => {
  const sum = document.querySelector('#summary'), list = document.querySelector('#results'), button = document.querySelector('#run');
  button.disabled = true; list.replaceChildren(); sum.textContent = 'Running…';
  const M = window.LanternModel, V = window.LanternView;
  const managed = k => k === 'lantern-bowl-save-v1' || k === 'arcade-index-v1' || k === 'arcade-settings-v1' || k.startsWith('arcade-backup:lantern-bowl-save-v1:') || k.startsWith('arcade-backup:arcade-index-v1:');
  const backup = new Map(Object.keys(localStorage).filter(managed).map(k => [k, localStorage.getItem(k)]));
  let frame, n = 0;
  const check = (name, ok) => { n++; const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail'; li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name; list.appendChild(li); if (!ok) throw Error(name); };
  const wait = () => new Promise(r => setTimeout(r, 240));
  try {
    Object.keys(localStorage).filter(managed).forEach(k => localStorage.removeItem(k));
    check('same seed, same game', M.digestScript(99) === M.digestScript(99));
    check('another seed is another game', M.digestScript(99) !== M.digestScript(3));
    const open = M.laneOpenRate(85, 30, 240, 1), shut = M.laneOpenRate(30, 85, 240, 1);
    check('a better line opens the middle more often (' + open.toFixed(2) + ' vs ' + shut.toFixed(2) + ')', open > shut + 0.45);
    const hands = M.catchRate(82, 78, 28, 240, 2), stone = M.catchRate(28, 30, 82, 240, 2);
    check('throwing and catching ratings beat coverage (' + hands.toFixed(2) + ' vs ' + stone.toFixed(2) + ')', hands > stone + 0.35);
    const strong = M.sampleRunYards({ block: 85, carry: 80, rush: 30, tackle: 30, speed: 55 }, 36, 100);
    const weak = M.sampleRunYards({ block: 30, carry: 30, rush: 85, tackle: 85, speed: 55 }, 36, 100);
    check('better blockers and a better back gain more yards (' + strong.toFixed(1) + ' vs ' + weak.toFixed(1) + ')', strong > weak + 3);
    const aimed = M.passCatchShare({ throw: 85, catch: 82, cover: 28, rush: 40 }, 24, 7);
    const covered = M.passCatchShare({ throw: 28, catch: 30, cover: 84, rush: 40 }, 24, 7);
    check('a full throw to a receiver still depends on ratings (' + aimed.toFixed(2) + ' vs ' + covered.toFixed(2) + ')', aimed > covered + 0.25);
    const chains = M.create({ seed: 1 }); chains.spot = 40; chains.down = 1; chains.toGo = 10;
    check('four yards makes 2nd and 6', M.moveChains(chains, 4) === 'down' && chains.down === 2 && Math.round(chains.toGo) === 6 && Math.round(chains.spot) === 44);
    const first = M.create({ seed: 1 }); first.spot = 40; first.down = 2; first.toGo = 6;
    check('a gain past the sticks is a first down', M.moveChains(first, 6) === 'first' && first.down === 1);
    const goal = M.create({ seed: 1 }); goal.spot = 96; goal.down = 1; goal.toGo = 4;
    check('the goal line is a touchdown in the chains', M.moveChains(goal, 5) === 'td');
    const stuck = M.create({ seed: 1 }); stuck.spot = 40; stuck.down = 4; stuck.toGo = 2;
    check('fourth down short of the sticks turns it over in the chains', M.moveChains(stuck, 1) === 'downs' && stuck.down === 5);
    const clock = M.create({ seed: 1 }); M.burn(clock, 30);
    check('thirty seconds leaves a minute and a half', Math.round(clock.clock) === 90 && clock.quarter === 1);
    M.burn(clock, 100);
    check('the clock carries into the next quarter', clock.quarter === 2 && Math.round(clock.clock) === 110);
    const lastQ = M.create({ seed: 1 }); lastQ.quarter = 4; lastQ.clock = 10; lastQ.score.home = 3; M.burn(lastQ, 20);
    check('time expiring in the fourth quarter ends the game', lastQ.phase === 'final' && lastQ.clock === 0);
    const tiedClock = M.create({ seed: 1 }); tiedClock.quarter = 4; tiedClock.clock = 10; M.burn(tiedClock, 20);
    check('a tied gun opens overtime instead of ending', tiedClock.phase !== 'final' && tiedClock.quarter === 5 && tiedClock.possession === 'away' && Math.round(tiedClock.spot) === 75);
    const played = M.create({ seed: 11 }); M.callPlay(played, 'inside'); M.finish(played, M.policies.neutral);
    const back = M.restore(M.serialise(played));
    check('a saved match restores the same spot and dice', M.snapshot(back) === M.snapshot(played));
    const aged = M.restore({ phase: 'call', spot: 40, down: 2, toGo: 6, quarter: 3, clock: 40, score: { home: 7, away: 3 }, possession: 'home', rng: 99, seed: 9, fatigue: { 'Mara Holt': 0.4 }, log: ['old play'] });
    check('an older match still loads', aged.spot === 40 && aged.down === 2 && aged.quarter === 3 && aged.score.home === 7 && aged.fatigue['Mara Holt'] === 0.4 && aged.log[0] === 'old play');
    const outline = M.teamOutline('#c45a32');
    check('team outlines are generated and stable', outline !== '#c45a32' && outline === M.teamOutline('#c45a32') && /^#[0-9a-f]{6}$/.test(outline));
    check('a short pull is a bullet and a long pull is a lob', V.classifyPull(36).kind === 'bullet' && V.classifyPull(120).kind === 'lob');
    const shot = V.project('behind', { x: 4, y: 0 }, { x: 0, y: 0 }, { w: 400, h: 600 });
    check('the behind-the-play camera returns a point', !!shot && isFinite(shot.x) && isFinite(shot.y) && shot.scale > 0);
    const sidePoint = V.project('side', { x: 0, y: 0 }, { x: 0, y: 0 }, { w: 384, h: 216 });
    check('the side-on view is the field', !!sidePoint && sidePoint.x === 140 && sidePoint.y === V.sideProject({ x: 0, y: 0 }, { x: 0 }).y && typeof V.paintMatch === 'function');
    const rightThrow = V.dragToField(80, 0), upThrow = V.dragToField(0, -40);
    check('a drag to the right is downfield', rightThrow.dirX > 0.9 && Math.abs(rightThrow.dirY) < 0.1 && upThrow.dirY < -0.9);
    const rangeLo = M.throwRange(0.2), rangeHi = M.throwRange(1);
    check('power sets how far a throw travels (' + rangeLo.toFixed(1) + ' to ' + rangeHi.toFixed(1) + ')', rangeHi > rangeLo + 20 && M.throwRange(0.6) > M.throwRange(0.4) && M.throwRange(0) < rangeLo);
    check('a harder throw has a wider landing circle', M.landingRadius(1) > M.landingRadius(0.25) + 1 && M.landingRadius(0.75) > M.landingRadius(0.25));
    const calmAim = M.guideState(90, 0.8, 0.8, 18, 1), wildAim = M.guideState(25, 0.8, 0.8, 18, 1);
    check('a higher accuracy rating holds the aim steady longer', M.aimSteady(90) > M.aimSteady(25) + 0.5 && calmAim.calm === true && wildAim.wobble > 0 && wildAim.error > calmAim.error && wildAim.radius > calmAim.radius);
    const errPlain = M.passError(10, 1), errRush = M.passError(10, 1.9), errDeep = M.passError(24, 1);
    check('pass error is a quarter yard plus three hundredths a yard, times pressure (' + errPlain.toFixed(2) + ' / ' + errRush.toFixed(2) + ')', Math.abs(errPlain - (0.25 + 0.03 * 10)) < 1e-9 && Math.abs(errRush - errPlain * 1.9) < 1e-9 && Math.abs(errDeep - (0.25 + 0.03 * 24)) < 1e-9 && M.pressureFactor({ rushersWinning: 6, pocket: 0 }) <= 1.9);
    const slingGame = M.create({ seed: 1 });
    M.callPlay(slingGame, 'quick');
    const slingQb = slingGame.play.actors[slingGame.play.carrier];
    const slingRec = slingGame.play.actors.filter(a => a.off && a.route)[0];
    const sdx = slingRec.route.x - slingQb.x, sdy = slingRec.route.y - slingQb.y;
    const placed = M.slingAim(slingGame.play, { dirX: sdx, dirY: sdy, power: 0.55 });
    check('default passing does not auto-aim', M.DEFAULT_PASS === 'retro' && placed.autoAim === false && placed.target == null && Math.abs(Math.hypot(placed.x - slingQb.x, placed.y - slingQb.y) - M.throwRange(0.55)) < 1e-6 && Math.hypot(placed.x - slingRec.route.x, placed.y - slingRec.route.y) > 1);
    const led = M.lockReceiver(slingGame.play, slingRec, 'lob');
    const routeLeft = Math.hypot(slingRec.route.x - slingRec.x, slingRec.route.y - slingRec.y);
    check('an All 22 throw leads that receiver by speed times flight', led && led.autoAim === true && led.target === slingRec && Math.abs(led.lead - Math.min(routeLeft, led.rate * led.air)) < 0.05);
    const thrownAway = M.slingAim(slingGame.play, { dirX: 0.15, dirY: 1, power: 0.95 });
    check('releasing past the sideline is a throwaway', thrownAway.throwaway === true && Math.abs(thrownAway.y) > M.SIDELINE);
    const deepPlay = M.create({ seed: 2 });
    M.callPlay(deepPlay, 'deep');
    const deepRec = deepPlay.play.actors.filter(a => a.off && a.role !== 'qb' && a.role !== 'ol')[0];
    const overthrown = M.missReason(deepPlay.play, { toX: deepRec.x + 8, toY: deepRec.y, power: 0.9, wobble: 0 }, { actor: deepRec, d: 8 });
    const wideWobble = M.missReason(deepPlay.play, { toX: deepRec.x + 0.4, toY: deepRec.y + 4, power: 0.7, wobble: 0.6 }, { actor: deepRec, d: 4 });
    const underthrown = M.missReason(deepPlay.play, { toX: deepRec.x - 6, toY: deepRec.y, power: 0.35, wobble: 0 }, { actor: deepRec, d: 6 });
    const quickPlay = M.create({ seed: 2 });
    M.callPlay(quickPlay, 'quick');
    const quickQb = quickPlay.play.actors[quickPlay.play.carrier];
    const quickRec = quickPlay.play.actors.filter(a => a.off && a.route)[0];
    const plainMiss = M.missReason(quickPlay.play, { toX: quickQb.x + 8, toY: quickQb.y, power: 0.2, wobble: 0 }, { actor: quickRec, d: 5 });
    check('a missed deep pass says it was overthrown', overthrown === 'Overthrown: too much power');
    check('a missed deep pass names aim wobble', wideWobble === 'Wide: aim wobble (QB accuracy)');
    check('a deep pass that dies short says it was underthrown', underthrown === 'Underthrown: not enough power');
    check('a short miss stays a plain incompletion', plainMiss === 'The throw falls incomplete');
    let openCatches = 0, tightPicks = 0, tightDrops = 0, trials = 1600, rollState = 5;
    const nextRoll = () => { rollState = (Math.imul(rollState, 1664525) + 1013904223) >>> 0; return rollState / 4294967296; };
    for (let i = 0; i < trials; i++) if (M.arriveOutcome(nextRoll, { tight: false }) === 'catch') openCatches += 1;
    for (let i = 0; i < trials; i++) {
      const outcome = M.arriveOutcome(nextRoll, { tight: true, cover: 88, hands: 42 });
      if (outcome === 'pick') tightPicks += 1;
      if (outcome === 'drop') tightDrops += 1;
    }
    check('an open catch lands about 95 percent of the time (' + (openCatches / trials).toFixed(3) + ')', openCatches / trials >= 0.93 && openCatches / trials <= 0.97);
    check('interceptions stay capped near 7.5 percent (' + (tightPicks / trials).toFixed(3) + ')', tightPicks / trials <= 0.09 && tightPicks / trials >= 0.05);
    check('a tight defender breaks up at least a quarter of those throws (' + (tightDrops / trials).toFixed(3) + ')', tightDrops / trials >= 0.26);
    ['inside', 'outside', 'quick', 'deep'].forEach(id => {
      const snap = M.create({ seed: 4 });
      M.callPlay(snap, id);
      const offN = snap.play.squad.filter(p => p.off).length;
      const defN = snap.play.squad.filter(p => !p.off).length;
      check(id + ' snaps eleven a side (' + snap.play.formation + ', ' + snap.play.defence + ')', offN === 11 && defN === 11);
    });
    const iForm = M.create({ seed: 4 }); M.callPlay(iForm, 'inside');
    const single = M.create({ seed: 4 }); M.callPlay(single, 'outside');
    const shotgun = M.create({ seed: 4 }); M.callPlay(shotgun, 'quick');
    const countRole = (play, off, role) => play.squad.filter(p => p.off === off && p.role === role).length;
    check('the I has two backs and a 4-3', iForm.play.formation === 'iform' && countRole(iForm.play, true, 'rb') === 2 && countRole(iForm.play, true, 'ol') === 5 && iForm.play.defence === 'base' && countRole(iForm.play, false, 'dl') === 4 && countRole(iForm.play, false, 'lb') === 3);
    check('singleback has two tight ends and two receivers', single.play.formation === 'singleback' && countRole(single.play, true, 'te') === 2 && countRole(single.play, true, 'wr') === 2 && countRole(single.play, true, 'rb') === 1);
    check('shotgun has three receivers and a nickel', shotgun.play.formation === 'shotgun' && countRole(shotgun.play, true, 'wr') === 3 && countRole(shotgun.play, true, 'te') === 1 && shotgun.play.defence === 'nickel' && countRole(shotgun.play, false, 'cb') === 3 && countRole(shotgun.play, false, 'lb') === 2);
    check('blockers and the quarterback face downfield', iForm.play.squad.filter(p => p.off && (p.role === 'ol' || p.role === 'qb')).every(p => p.face === 1));
    check('zone defenders face the ball', iForm.play.squad.filter(p => !p.off && (p.role === 'lb' || p.role === 's')).every(p => p.face === (iForm.play.ball.x + 0.05 < p.x ? -1 : 1)));
    const awaySnap = M.create({ seed: 6 }); awaySnap.possession = 'away'; awaySnap.phase = 'cpu'; M.callPlay(awaySnap, 'quick');
    check('Millrace also snaps eleven a side', awaySnap.play.squad.filter(p => p.off).length === 11 && awaySnap.play.squad.filter(p => !p.off).length === 11 && awaySnap.play.formation === 'shotgun');
    function snapMoves(side, id) {
      const game = M.create({ seed: 8 });
      game.possession = side;
      game.phase = side === 'home' ? 'call' : 'cpu';
      if (!M.callPlay(game, id)) return false;
      const ball0 = game.play.ball.x;
      const xs = game.play.squad.map(p => p.x);
      let ball = false, players = false;
      for (let i = 0; i < 90 && game.phase === 'live'; i++) {
        M.step(game, 1 / 30, M.policies.cpu(game.play, game));
        if (!game.play) break;
        if (Math.abs(game.play.ball.x - ball0) > 0.3) ball = true;
        if (game.play.squad.some((p, n) => Math.abs(p.x - xs[n]) > 0.2)) players = true;
      }
      return ball && players;
    }
    check('the ball and the players move on a Lanterns run and a Lanterns pass', snapMoves('home', 'inside') && snapMoves('home', 'quick'));
    check('the ball and the players move on a Millrace run and a Millrace pass', snapMoves('away', 'inside') && snapMoves('away', 'deep'));
    const lines = V.chainLines({ spot: 25, toGo: 10 });
    const losPx = V.sideProject({ x: lines.los, y: 0 }, { x: lines.los });
    const firstPx = V.sideProject({ x: lines.first, y: 0 }, { x: lines.los });
    check('the line of scrimmage and the first-down line sit on those yards', lines.los === 25 && lines.first === 35 && losPx.x === 140 && firstPx.x === losPx.x + 120);
    const odd = V.sideProject({ x: 10.4, y: -3.2 }, { x: 0 });
    check('the side camera lands on whole pixels', odd.x === Math.round(odd.x) && odd.y === Math.round(odd.y) && losPx.y === Math.round(losPx.y));
    const heldCam = V.stepSideCamera({ x: 40, v: 4, chasing: true }, 90, 0.5, { chase: false });
    check('the camera stops chasing after the whistle', heldCam.x === 40 && heldCam.v === 0 && heldCam.chasing === false);
    const cutCam = V.stepSideCamera({ x: 70, v: 3, chasing: true }, 25, 0.5, { cut: true });
    check('between plays the camera hard-cuts to the new line', cutCam.x === 25 && cutCam.v === 0 && cutCam.chasing === false);
    const focusRun = V.sideFocus({ family: 'run', spot: 25, ballX: 30 });
    const focusAir = V.sideFocus({ family: 'air', spot: 25, qbX: 20, landX: 40 });
    check('a run leads the carrier and a pass aims between the quarterback and the landing spot', Math.abs(focusRun.target - (30 + 40 / 12)) < 1e-9 && focusRun.chase === true && focusAir.target === 30 && focusAir.chase === true);
    check('the picture stays inside 32 colours', V.PALETTE.length <= 32 && V.PALETTE.length === new Set(V.PALETTE).size);
    const inkPen = { log: [] };
    ['save', 'restore', 'beginPath', 'moveTo', 'lineTo', 'ellipse', 'arc', 'fill', 'stroke', 'translate', 'scale', 'fillRect'].forEach(name => { inkPen[name] = () => { inkPen.log.push(name); }; });
    V.drawPlayer(inkPen, { x: 8, y: 8, scale: 2.4, id: 'qb', view: 'back', pose: 'idle' });
    check('the fallback outline is 1px ink', inkPen.lineWidth === 1 && inkPen.strokeStyle === '#1e1a22');
    const saveKeys = Object.keys(M.serialise(M.create({ seed: 1 }))).sort().join(',');
    check('a save still has only the v2 fields', saveKeys === 'away,clock,down,fatigue,home,last,lastGain,log,otTurns,phase,playSerial,possession,quarter,received,rng,score,seed,spot,toGo,usage');
    const familiar = M.passCatchShare({ throw: 64, catch: 68, cover: 55, rush: 58 }, 36, 7);
    check('a well-aimed throw is usually caught (' + familiar.toFixed(2) + ')', familiar > 0.6);
    let plainYards = 0, jukeYards = 0;
    for (let i = 0; i < 20; i++) {
      const plain = M.create({ seed: 200 + i }); M.callPlay(plain, 'inside'); M.finish(plain, M.policies.neutral); plainYards += plain.lastGain || 0;
      const juked = M.create({ seed: 200 + i }); M.callPlay(juked, 'inside'); M.finish(juked, M.jukePolicy); jukeYards += juked.lastGain || 0;
    }
    check('a juke changes the yards (' + (plainYards / 20).toFixed(1) + ' vs ' + (jukeYards / 20).toFixed(1) + ')', jukeYards > plainYards + 20);
    const jukeGame = M.create({ seed: 201 }); M.callPlay(jukeGame, 'inside'); M.finish(jukeGame, M.jukePolicy);
    check('a juke is named, and a rating is in the result', /jukes/.test(M.currentMessage(jukeGame)) && /\(\d+\)/.test(M.currentMessage(jukeGame)));
    let diveScores = 0, plainScores = 0;
    for (let i = 0; i < 16; i++) {
      const plain = M.create({ seed: 300 + i }); plain.spot = 96; plain.toGo = 4; M.callPlay(plain, 'inside'); M.finish(plain, M.policies.neutral);
      const dived = M.create({ seed: 300 + i }); dived.spot = 96; dived.toGo = 4; M.callPlay(dived, 'inside'); M.finish(dived, M.divePolicy);
      if (plain.last && plain.last.kind === 'score') plainScores += 1;
      if (dived.last && dived.last.kind === 'score') diveScores += 1;
    }
    check('a dive changes who scores (' + diveScores + ' vs ' + plainScores + ')', diveScores > plainScores + 8);
    const diveGame = M.create({ seed: 301 }); diveGame.spot = 96; diveGame.toGo = 4; M.callPlay(diveGame, 'inside'); M.finish(diveGame, M.divePolicy);
    check('a dive is named in the result', /dives/.test(M.currentMessage(diveGame)));
    const careless = M.winSplit('careless', 12, 11), attentive = M.winSplit('attentive', 12, 11);
    check('careless play loses most games (' + careless.losses + ' losses, ' + careless.wins + ' wins)', careless.losses >= 10 && careless.wins <= 2);
    check('attentive play wins most games (' + attentive.wins + ' wins of ' + attentive.n + ')', attentive.wins >= 8);
    let maxSpent = 0;
    for (let i = 0; i < 16; i++) {
      const playedClock = M.create({ seed: 20 + i }); playedClock.clock = 90;
      M.callPlay(playedClock, ['inside', 'outside', 'quick', 'deep'][i % 4]);
      const before = { quarter: playedClock.quarter, clock: playedClock.clock, phase: playedClock.phase };
      M.finish(playedClock, M.policies.cpu);
      maxSpent = Math.max(maxSpent, M.clockSpent(before, playedClock));
    }
    check('one play never takes more than 14 seconds (' + maxSpent.toFixed(1) + ')', maxSpent > 0 && maxSpent <= 14);
    const rolled = M.create({ seed: 5 }); rolled.clock = 6; rolled.down = 1; rolled.toGo = 10; rolled.spot = 30;
    M.callPlay(rolled, 'inside'); M.finish(rolled, M.policies.neutral);
    check('a new quarter keeps the down and the ball', rolled.quarter === 2 && rolled.down === 2 && rolled.possession === 'home' && Math.round(rolled.toGo) !== 10);
    check('the new quarter is announced', /Second quarter/.test(rolled.last.text));
    const spam = M.scriptedSeries(11, () => 'quick');
    const varied = M.scriptedSeries(11, (g, n) => ['inside', 'outside', 'quick', 'deep'][n % 4]);
    check('repeating one short pass loses (' + spam.score.home + '–' + spam.score.away + ')', spam.phase === 'final' && spam.score.home < spam.score.away && (spam.usage.quick || 0) > (spam.usage.inside || 0) + 8);
    check('a mixed call sheet wins (' + varied.score.home + '–' + varied.score.away + ')', varied.phase === 'final' && varied.score.home > varied.score.away);
    let earlyJuke = 0, timedJuke = 0, earlyDive = 0, timedDive = 0;
    for (let i = 0; i < 20; i++) {
      const tj = M.create({ seed: 400 + i }); M.callPlay(tj, 'inside'); M.finish(tj, M.jukePolicy); timedJuke += tj.lastGain || 0;
      const ej = M.create({ seed: 400 + i }); M.callPlay(ej, 'inside'); M.finish(ej, M.earlyJukePolicy); earlyJuke += ej.lastGain || 0;
      const td = M.create({ seed: 500 + i }); M.callPlay(td, 'inside'); M.finish(td, M.divePolicy); timedDive += td.lastGain || 0;
      const ed = M.create({ seed: 500 + i }); M.callPlay(ed, 'inside'); M.finish(ed, M.earlyDivePolicy); earlyDive += ed.lastGain || 0;
    }
    check('a juke as the defender arrives gains more than a juke at the snap (' + (timedJuke / 20).toFixed(1) + ' vs ' + (earlyJuke / 20).toFixed(1) + ')', timedJuke > earlyJuke + 20);
    check('a dive as the defender arrives gains more than a dive at the snap (' + (timedDive / 20).toFixed(1) + ' vs ' + (earlyDive / 20).toFixed(1) + ')', timedDive > earlyDive + 20);
    const dropped = M.create({ seed: 4 }); M.callPlay(dropped, 'quick'); M.finish(dropped, M.scriptedQuick);
    const dropText = M.currentMessage(dropped);
    check('a drop uses the cover that stopped it', /cannot bring it in/.test(dropText) && /The cover \(\d+\) stopped /.test(dropText) && !/beat the cover/.test(dropText) && !/beat The /.test(dropText));
    const caught = M.create({ seed: 1 }); M.callPlay(caught, 'quick'); M.finish(caught, M.scriptedQuick);
    check('a catch does not say the receiver could not bring it in', /catches it/.test(M.currentMessage(caught)) && !/cannot bring it in/.test(M.currentMessage(caught)));
    check('a rating line does not capitalise the middle', M.resultLine('the tackle', 62, 'The carry', 63) === 'The tackle (62) stopped the carry (63).');
    const half = M.create({ seed: 9 }); half.quarter = 2; half.clock = 4; half.down = 3; half.toGo = 6; half.spot = 42;
    M.callPlay(half, 'inside'); M.finish(half, M.policies.neutral);
    check('the second half opens with a kickoff to Millrace', half.quarter === 3 && half.possession === 'away' && half.down === 1 && Math.round(half.spot) === 25 && /Halftime/.test(half.last.text) && /Millrace receives the kickoff/.test(half.last.text));
    const gun = M.create({ seed: 9 }); gun.quarter = 4; gun.clock = 4; gun.spot = 40; gun.score.home = 7;
    M.callPlay(gun, 'inside'); M.finish(gun, M.policies.neutral);

    check('a real v1 save steps up to v2 and keeps the same drive', v1Loaded.v === 2 && v1Loaded.sound === v1File.sound && v1Loaded.match.otTurns === 0 && JSON.stringify(v1Match) === JSON.stringify(v1File.match) && v1Game.quarter === v1File.match.quarter && v1Game.clock === v1File.match.clock && v1Game.down === v1File.match.down && v1Game.toGo === v1File.match.toGo && v1Game.spot === v1File.match.spot && v1Game.possession === v1File.match.possession && v1Game.rng === v1File.match.rng && v1Game.score.home === 0 && v1Game.score.away === 0 && v1Game.otTurns === 0 && v1Game.home.qb.name === 'Wren Talley' && v1Game.last.text === v1File.match.last.text);
    const otGame = again.M.create({ seed: 9 });
    otGame.quarter = 5; otGame.otTurns = 2; otGame.possession = 'away'; otGame.spot = 75; otGame.down = 1; otGame.toGo = 10; otGame.phase = 'call'; otGame.clock = 0;
    otGame.score.home = 10; otGame.score.away = 10;
    const otFile = { v: 2, game: 'lantern-bowl', sound: 2, match: again.M.serialise(otGame) };
    const otLoaded = again.migrateSave(JSON.parse(JSON.stringify(otFile)));
    const otBack = again.M.restore(otLoaded.match);
    const otWritten = again.M.serialise(otBack);
    check('an overtime save round-trips at v2', !!otLoaded && otLoaded.v === 2 && otBack.quarter === 5 && otBack.otTurns === 2 && otWritten.quarter === 5 && otWritten.otTurns === 2 && otWritten.possession === 'away' && Math.round(otWritten.spot) === 75 && JSON.stringify(otWritten) === JSON.stringify(otLoaded.match));
    d2.querySelector('#field').dispatchEvent(new w2.PointerEvent('pointerdown', { clientX: 30, clientY: 80, pointerId: 7, bubbles: true }));
    await wait();
    check('a drag before a play asks for one', (d2.querySelector('#banner').textContent || '').indexOf('Pick a play') >= 0);
    again.rush(true);
    again.state.down = 4; again.state.spot = 28; again.state.toGo = 10; again.state.phase = 'call'; again.state.possession = 'home';
    again.state.quarter = 1; again.state.clock = 120; again.state.seed = 1; again.state.rng = 1;
    again.begin('kick');
    let driveDone = false;
    for (let i = 0; i < 40 && !driveDone; i++) {
      await wait();
      driveDone = again.state.possession === 'home' || again.state.phase === 'final';
    }
    const driveText = (again.state.log || []).join(' ');
    check('Millrace\'s drive plays on the field and names why the ball changed', driveDone && !d2.querySelector('.cpu-log') && /punt|Turnover|Intercept|Touchdown|Safety|Halftime|makes it|misses from|Overtime/.test(driveText) && d2.querySelector('#field'));
    again.state.quarter = 4; again.state.clock = 3; again.state.possession = 'away'; again.state.phase = 'cpu'; again.state.down = 1; again.state.toGo = 10; again.state.spot = 30; again.state.score.home = 14; again.state.score.away = 0;
    again.playCpu();
    let sawFinal = false;
    for (let i = 0; i < 40 && !sawFinal; i++) {
      await wait();
      sawFinal = again.state.phase === 'final';
    }
    check('the end of the game is the final screen', sawFinal && d2.querySelector('#panelTitle').textContent === 'Final' && !d2.querySelector('.cpu-log'));
    frame.remove();
    const v3raw = '{"v":3,"game":"lantern-bowl","sound":1,"match":{"score":{"home":9,"away":4},"home":{"qb":{"name":"Wren Talley"}},"away":{"qb":{"name":"Ned Harrow"}},"kept":"byte-for-byte"}}';
    localStorage.setItem('lantern-bowl-save-v1', v3raw);
    frame = document.createElement('iframe');
    frame.title = 'Lantern Bowl newer save';
    frame.src = '../games/lantern-bowl/index.html';
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Error('newer-save load timed out')), 20000);
      frame.onload = () => { clearTimeout(timer); resolve(); };
      document.querySelector('#game').appendChild(frame);
    });
    const w3 = frame.contentWindow, d3 = w3.document;
    await wait();
    const sameFile = () => localStorage.getItem('lantern-bowl-save-v1') === v3raw;
    const held = d3.querySelector('#held');
    check('a newer save says progress will not be saved', !!held && !held.hidden && /newer version/.test(held.textContent) && /will not be saved/.test(held.textContent) && sameFile());
    w3.__lantern.kickoff(4);
    await wait();
    check('a kickoff leaves a newer save byte for byte', sameFile());
    d3.querySelector('#sound').click();
    await wait();
    check('a sound change leaves a newer save byte for byte', sameFile());
    const late = w3.__lantern;
    late.state.quarter = 4; late.state.clock = 3; late.state.down = 1; late.state.toGo = 10; late.state.spot = 40;
    late.state.possession = 'home'; late.state.phase = 'call'; late.state.score.home = 7; late.state.score.away = 0;
    late.begin('inside'); late.finishLive();
    await wait();
    d3.querySelector('[data-again]').click();
    await wait();
    const heldAfter = d3.querySelector('#held');
    check('play again leaves a newer save byte for byte', sameFile() && !!heldAfter && !heldAfter.hidden && /will not be saved/.test(heldAfter.textContent));
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    if (frame) frame.remove();
    Object.keys(localStorage).filter(managed).forEach(k => localStorage.removeItem(k));
    for (const [k, v] of backup) localStorage.setItem(k, v);
    button.disabled = false;
  }
};
</script>
