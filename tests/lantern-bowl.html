<!doctype html><html lang="en"><meta charset="utf-8"><title>Lantern Bowl checks</title>
<style>body{font:16px system-ui;background:#141820;color:#f6edd4;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0}</style>
<h1>Lantern Bowl checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div>
<script src="../games/lantern-bowl/model.js"></script>
<script src="../games/lantern-bowl/view.js"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async () => {
  const sum = document.querySelector('#summary'), list = document.querySelector('#results'), button = document.querySelector('#run');
  button.disabled = true; list.replaceChildren(); sum.textContent = 'Running…';
  const M = window.LanternModel, V = window.LanternView;
  const managed = k => k === 'lantern-bowl-save-v1' || k === 'arcade-index-v1' || k === 'arcade-settings-v1' || k.startsWith('arcade-backup:lantern-bowl-save-v1:') || k.startsWith('arcade-backup:arcade-index-v1:');
  const backup = new Map(Object.keys(localStorage).filter(managed).map(k => [k, localStorage.getItem(k)]));
  let frame, n = 0;
  const check = (name, ok) => { n++; const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail'; li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name; list.appendChild(li); if (!ok) throw Error(name); };
  const wait = () => new Promise(r => setTimeout(r, 240));
  try {
    Object.keys(localStorage).filter(managed).forEach(k => localStorage.removeItem(k));
    check('same seed, same game', M.digestScript(99) === M.digestScript(99));
    check('another seed is another game', M.digestScript(99) !== M.digestScript(3));
    const open = M.laneOpenRate(85, 30, 240, 1), shut = M.laneOpenRate(30, 85, 240, 1);
    check('a better line opens the middle more often (' + open.toFixed(2) + ' vs ' + shut.toFixed(2) + ')', open > shut + 0.45);
    const hands = M.catchRate(82, 78, 28, 240, 2), stone = M.catchRate(28, 30, 82, 240, 2);
    check('throwing and catching ratings beat coverage (' + hands.toFixed(2) + ' vs ' + stone.toFixed(2) + ')', hands > stone + 0.35);
    const strong = M.sampleRunYards({ block: 85, carry: 80, rush: 30, tackle: 30, speed: 55 }, 36, 100);
    const weak = M.sampleRunYards({ block: 30, carry: 30, rush: 85, tackle: 85, speed: 55 }, 36, 100);
    check('better blockers and a better back gain more yards (' + strong.toFixed(1) + ' vs ' + weak.toFixed(1) + ')', strong > weak + 3);
    const aimed = M.passCatchShare({ throw: 85, catch: 82, cover: 28, rush: 40 }, 24, 7);
    const covered = M.passCatchShare({ throw: 28, catch: 30, cover: 84, rush: 40 }, 24, 7);
    check('a full throw to a receiver still depends on ratings (' + aimed.toFixed(2) + ' vs ' + covered.toFixed(2) + ')', aimed > covered + 0.25);
    const chains = M.create({ seed: 1 }); chains.spot = 40; chains.down = 1; chains.toGo = 10;
    check('four yards makes 2nd and 6', M.moveChains(chains, 4) === 'down' && chains.down === 2 && Math.round(chains.toGo) === 6 && Math.round(chains.spot) === 44);
    const first = M.create({ seed: 1 }); first.spot = 40; first.down = 2; first.toGo = 6;
    check('a gain past the sticks is a first down', M.moveChains(first, 6) === 'first' && first.down === 1);
    const goal = M.create({ seed: 1 }); goal.spot = 96; goal.down = 1; goal.toGo = 4;
    check('the goal line is a touchdown in the chains', M.moveChains(goal, 5) === 'td');
    const stuck = M.create({ seed: 1 }); stuck.spot = 40; stuck.down = 4; stuck.toGo = 2;
    check('fourth down short of the sticks turns it over in the chains', M.moveChains(stuck, 1) === 'downs' && stuck.down === 5);
    const clock = M.create({ seed: 1 }); M.burn(clock, 30);
    check('thirty seconds leaves a minute and a half', Math.round(clock.clock) === 90 && clock.quarter === 1);
    M.burn(clock, 100);
    check('the clock carries into the next quarter', clock.quarter === 2 && Math.round(clock.clock) === 110);
    const lastQ = M.create({ seed: 1 }); lastQ.quarter = 4; lastQ.clock = 10; lastQ.score.home = 3; M.burn(lastQ, 20);
    check('time expiring in the fourth quarter ends the game', lastQ.phase === 'final' && lastQ.clock === 0);
    const tiedClock = M.create({ seed: 1 }); tiedClock.quarter = 4; tiedClock.clock = 10; M.burn(tiedClock, 20);
    check('a tied gun opens overtime instead of ending', tiedClock.phase !== 'final' && tiedClock.quarter === 5 && tiedClock.possession === 'away' && Math.round(tiedClock.spot) === 75);
    const played = M.create({ seed: 11 }); M.callPlay(played, 'inside'); M.finish(played, M.policies.neutral);
    const back = M.restore(M.serialise(played));
    check('a saved match restores the same spot and dice', M.snapshot(back) === M.snapshot(played));
    const aged = M.restore({ phase: 'call', spot: 40, down: 2, toGo: 6, quarter: 3, clock: 40, score: { home: 7, away: 3 }, possession: 'home', rng: 99, seed: 9, fatigue: { 'Mara Holt': 0.4 }, log: ['old play'] });
    check('an older match still loads', aged.spot === 40 && aged.down === 2 && aged.quarter === 3 && aged.score.home === 7 && aged.fatigue['Mara Holt'] === 0.4 && aged.log[0] === 'old play');
    const outline = M.teamOutline('#c45a32');
    check('team outlines are generated and stable', outline !== '#c45a32' && outline === M.teamOutline('#c45a32') && /^#[0-9a-f]{6}$/.test(outline));
    check('a short pull is a bullet and a long pull is a lob', V.classifyPull(36).kind === 'bullet' && V.classifyPull(120).kind === 'lob');
    const shot = V.project('behind', { x: 4, y: 0 }, { x: 0, y: 0 }, { w: 400, h: 600 });
    check('the behind-the-play camera returns a point', !!shot && isFinite(shot.x) && isFinite(shot.y) && shot.scale > 0);
    check('the side-on view is reserved and not built', V.RESERVED.indexOf('side') >= 0 && V.project('side', { x: 0, y: 0 }, { x: 0, y: 0 }, { w: 100, h: 100 }) === null);
    const familiar = M.passCatchShare({ throw: 64, catch: 68, cover: 55, rush: 58 }, 36, 7);
    check('a well-aimed throw is usually caught (' + familiar.toFixed(2) + ')', familiar > 0.6);
    let plainYards = 0, jukeYards = 0;
    for (let i = 0; i < 20; i++) {
      const plain = M.create({ seed: 200 + i }); M.callPlay(plain, 'inside'); M.finish(plain, M.policies.neutral); plainYards += plain.lastGain || 0;
      const juked = M.create({ seed: 200 + i }); M.callPlay(juked, 'inside'); M.finish(juked, M.jukePolicy); jukeYards += juked.lastGain || 0;
    }
    check('a juke changes the yards (' + (plainYards / 20).toFixed(1) + ' vs ' + (jukeYards / 20).toFixed(1) + ')', jukeYards > plainYards + 20);
    const jukeGame = M.create({ seed: 201 }); M.callPlay(jukeGame, 'inside'); M.finish(jukeGame, M.jukePolicy);
    check('a juke is named, and a rating is in the result', /jukes/.test(M.currentMessage(jukeGame)) && /\(\d+\)/.test(M.currentMessage(jukeGame)));
    let diveScores = 0, plainScores = 0;
    for (let i = 0; i < 16; i++) {
      const plain = M.create({ seed: 300 + i }); plain.spot = 96; plain.toGo = 4; M.callPlay(plain, 'inside'); M.finish(plain, M.policies.neutral);
      const dived = M.create({ seed: 300 + i }); dived.spot = 96; dived.toGo = 4; M.callPlay(dived, 'inside'); M.finish(dived, M.divePolicy);
      if (plain.last && plain.last.kind === 'score') plainScores += 1;
      if (dived.last && dived.last.kind === 'score') diveScores += 1;
    }
    check('a dive changes who scores (' + diveScores + ' vs ' + plainScores + ')', diveScores > plainScores + 8);
    const diveGame = M.create({ seed: 301 }); diveGame.spot = 96; diveGame.toGo = 4; M.callPlay(diveGame, 'inside'); M.finish(diveGame, M.divePolicy);
    check('a dive is named in the result', /dives/.test(M.currentMessage(diveGame)));
    const careless = M.winSplit('careless', 12, 11), attentive = M.winSplit('attentive', 12, 11);
    check('careless play loses most games (' + careless.losses + ' losses, ' + careless.wins + ' wins)', careless.losses >= 10 && careless.wins <= 2);
    check('attentive play wins most games (' + attentive.wins + ' wins of ' + attentive.n + ')', attentive.wins >= 8);
    let maxSpent = 0;
    for (let i = 0; i < 16; i++) {
      const playedClock = M.create({ seed: 20 + i }); playedClock.clock = 90;
      M.callPlay(playedClock, ['inside', 'outside', 'quick', 'deep'][i % 4]);
      const before = { quarter: playedClock.quarter, clock: playedClock.clock, phase: playedClock.phase };
      M.finish(playedClock, M.policies.cpu);
      maxSpent = Math.max(maxSpent, M.clockSpent(before, playedClock));
    }
    check('one play never takes more than 14 seconds (' + maxSpent.toFixed(1) + ')', maxSpent > 0 && maxSpent <= 14);
    const rolled = M.create({ seed: 5 }); rolled.clock = 6; rolled.down = 1; rolled.toGo = 10; rolled.spot = 30;
    M.callPlay(rolled, 'inside'); M.finish(rolled, M.policies.neutral);
    check('a new quarter keeps the down and the ball', rolled.quarter === 2 && rolled.down === 2 && rolled.possession === 'home' && Math.round(rolled.toGo) !== 10);
    const spam = M.scriptedSeries(11, () => 'quick');
    const varied = M.scriptedSeries(11, (g, n) => ['inside', 'outside', 'quick', 'deep'][n % 4]);
    check('repeating one short pass loses (' + spam.score.home + '–' + spam.score.away + ')', spam.phase === 'final' && spam.score.home < spam.score.away && (spam.usage.quick || 0) > (spam.usage.inside || 0) + 8);
    check('a mixed call sheet wins (' + varied.score.home + '–' + varied.score.away + ')', varied.phase === 'final' && varied.score.home > varied.score.away);
    let earlyJuke = 0, timedJuke = 0, earlyDive = 0, timedDive = 0;
    for (let i = 0; i < 20; i++) {
      const tj = M.create({ seed: 400 + i }); M.callPlay(tj, 'inside'); M.finish(tj, M.jukePolicy); timedJuke += tj.lastGain || 0;
      const ej = M.create({ seed: 400 + i }); M.callPlay(ej, 'inside'); M.finish(ej, M.earlyJukePolicy); earlyJuke += ej.lastGain || 0;
      const td = M.create({ seed: 500 + i }); M.callPlay(td, 'inside'); M.finish(td, M.divePolicy); timedDive += td.lastGain || 0;
      const ed = M.create({ seed: 500 + i }); M.callPlay(ed, 'inside'); M.finish(ed, M.earlyDivePolicy); earlyDive += ed.lastGain || 0;
    }
    check('a juke as the defender arrives gains more than a juke at the snap (' + (timedJuke / 20).toFixed(1) + ' vs ' + (earlyJuke / 20).toFixed(1) + ')', timedJuke > earlyJuke + 20);
    check('a dive as the defender arrives gains more than a dive at the snap (' + (timedDive / 20).toFixed(1) + ' vs ' + (earlyDive / 20).toFixed(1) + ')', timedDive > earlyDive + 20);
    const dropped = M.create({ seed: 4 }); M.callPlay(dropped, 'quick'); M.finish(dropped, M.scriptedQuick);
    const dropText = M.currentMessage(dropped);
    check('a drop uses the cover that stopped it', /cannot bring it in/.test(dropText) && /The cover \(\d+\) stopped /.test(dropText) && !/beat the cover/.test(dropText) && !/beat The /.test(dropText));
    const caught = M.create({ seed: 1 }); M.callPlay(caught, 'quick'); M.finish(caught, M.scriptedQuick);
    check('a catch does not say the receiver could not bring it in', /catches it/.test(M.currentMessage(caught)) && !/cannot bring it in/.test(M.currentMessage(caught)));
    check('a rating line does not capitalise the middle', M.resultLine('the tackle', 62, 'The carry', 63) === 'The tackle (62) stopped the carry (63).');
    const half = M.create({ seed: 9 }); half.quarter = 2; half.clock = 4; half.down = 3; half.toGo = 6; half.spot = 42;
    M.callPlay(half, 'inside'); M.finish(half, M.policies.neutral);
    check('the second half opens with a kickoff to Millrace', half.quarter === 3 && half.possession === 'away' && half.down === 1 && Math.round(half.spot) === 25 && /Halftime/.test(half.last.text) && /Millrace receives/.test(half.last.text));
    const gun = M.create({ seed: 9 }); gun.quarter = 4; gun.clock = 4; gun.spot = 40; gun.score.home = 7;
    M.callPlay(gun, 'inside'); M.finish(gun, M.policies.neutral);
    check('the gun ends the game', gun.phase === 'final' && gun.clock === 0 && gun.quarter === 4);
    const ot = M.create({ seed: 9 }); ot.quarter = 4; ot.clock = 4; ot.spot = 40; ot.score.home = 7; ot.score.away = 7;
    M.callPlay(ot, 'inside'); M.finish(ot, M.policies.neutral);
    check('overtime gives Millrace one turn from the 25 and says so', ot.quarter === 5 && ot.possession === 'away' && ot.phase === 'cpu' && Math.round(ot.spot) === 75 && /Overtime/.test(ot.last.text) && /Millrace goes first/.test(ot.last.text) && /both turns/.test(ot.last.text));
    const told = text => /punt|Turnover|Intercept|Touchdown|Safety|Halftime|makes it|misses from|Overtime|ball, on the 25|ball again/i.test(text || '');
    const broken = M.create({ seed: 1 });
    broken.quarter = 1; broken.clock = 12; broken.down = 2; broken.toGo = 10; broken.spot = 81; broken.possession = 'away'; broken.phase = 'cpu';
    M.cpuDrive(broken);
    check('a quarter ending does not hand the ball back without a cause', (broken.phase === 'final' || broken.possession === 'home') && told(broken.log.join(' ')) && !(broken.quarter === 2 && broken.clock >= 119 && broken.possession === 'away'));
    const spotBug = M.create({ seed: 355 });
    spotBug.quarter = 1; spotBug.clock = 54; spotBug.down = 2; spotBug.toGo = 10; spotBug.spot = 81; spotBug.possession = 'away'; spotBug.phase = 'cpu';
    let spotSteps = 0, clockOk = true, causeOk = true;
    while (spotBug.possession === 'away' && spotBug.phase !== 'final' && spotSteps < 20) {
      const before = { quarter: spotBug.quarter, clock: spotBug.clock, possession: spotBug.possession };
      const from = spotBug.log.length;
      if (!M.cpuSnap(spotBug)) break;
      const spent = M.clockSpent(before, spotBug);
      if (spent > 14.01 || spent < -0.001 || spotBug.quarter > before.quarter + 1) clockOk = false;
      if (before.quarter === 1 && spotBug.quarter === 2) {
        const into = spent - before.clock;
        if (Math.abs(spotBug.clock - (M.QUARTER - into)) > 0.05) clockOk = false;
      }
      if (before.quarter === 1 && before.clock > 20 && spotBug.quarter === 2 && spotBug.clock >= 119.5) clockOk = false;
      if (spotBug.possession !== before.possession && !told(spotBug.log.slice(from).join(' '))) causeOk = false;
      spotSteps += 1;
    }
    check('from Q1 0:54, 2nd and 10 at their 19, the clock stays honest (' + spotSteps + ' snaps)', clockOk && causeOk && spotSteps > 0 && M.downWords(M.create({ seed: 1 })) !== '');
    const named = M.create({ seed: 355 }); named.quarter = 1; named.clock = 54; named.down = 2; named.toGo = 10; named.spot = 81;
    check('that spot is 2nd and 10 at their 19', M.downWords(named) === '2nd and 10 at their 19');
    function aimedPull(power, dirY) {
      return function (play) {
        if (!play || play.family !== 'pass' || play.thrown || play.flight) return M.policies.neutral();
        if (play.elapsed < 0.35) return M.policies.neutral();
        return { steer: 0, turbo: false, juke: 0, dive: false, throw: { dirX: 0.95, dirY: dirY, power: power } };
      };
    }
    let weakYards = 0, strongYards = 0;
    for (let i = 0; i < 12; i++) {
      const opts = { seed: 40 + i, home: { throw: 84, catch: 82 }, away: { cover: 36, rush: 40 } };
      const weakPull = M.create(opts); M.callPlay(weakPull, 'quick'); M.finish(weakPull, aimedPull(0.12, 0)); weakYards += weakPull.lastGain || 0;
      const strongPull = M.create(opts); M.callPlay(strongPull, 'quick'); M.finish(strongPull, aimedPull(0.75, 0)); strongYards += strongPull.lastGain || 0;
    }
    check('a stronger pull gains more yards (' + (weakYards / 12).toFixed(1) + ' vs ' + (strongYards / 12).toFixed(1) + ')', strongYards > weakYards + 60);
    const aimGame = M.create({ seed: 1 }); M.callPlay(aimGame, 'quick');
    const aimWeak = M.aimThrow(aimGame.play, { dirX: 0.95, dirY: 0, power: 0.12 });
    const aimStrong = M.aimThrow(aimGame.play, { dirX: 0.95, dirY: 0, power: 0.75 });
    const aimLeft = M.aimThrow(aimGame.play, { dirX: 0.6, dirY: -0.8, power: 0.7 });
    const aimRight = M.aimThrow(aimGame.play, { dirX: 0.6, dirY: 0.8, power: 0.7 });
    check('aim moves the preview from one side to the other', aimStrong.x > aimWeak.x + 4 && aimLeft.y < -2 && aimRight.y > 2 && aimLeft.target !== aimRight.target);
    let sawJuke = false;
    const cueGame = M.create({ seed: 2 }); M.callPlay(cueGame, 'inside');
    for (let i = 0; i < 180 && cueGame.phase === 'live'; i++) {
      M.step(cueGame, 1 / 30, M.policies.neutral());
      if (cueGame.play && cueGame.play.cue === 'juke') sawJuke = true;
    }
    check('a closing defender prompts a juke', sawJuke);
    const goalLine = M.create(); goalLine.spot = 100; goalLine.toGo = 0; goalLine.down = 1;
    check('the goal line is not their 0', M.spotWords(100) === 'the goal line' && M.spotWords(99) === 'their 1' && M.downWords(goalLine).indexOf('their 0') < 0);
    check('the goal sits closer when the offence is downfield', V.fieldLocal(80, 100) === 20 && V.fieldLocal(25, 100) === 75);
    check('sprite names follow id, view and pose', V.spriteFile('qb', 'back', 'run1') === 'qb_back_run1.png');
    const pen = { log: [] };
    ['save', 'restore', 'beginPath', 'moveTo', 'lineTo', 'ellipse', 'arc', 'fill', 'stroke', 'translate', 'scale', 'drawImage'].forEach(name => { pen[name] = () => { pen.log.push(name); }; });
    check('a missing sprite draws a figure', V.drawPlayer(pen, { x: 8, y: 8, scale: 2, id: 'qb', view: 'back', pose: 'run1', fill: '#c45a32', outline: '#fff' }) === 'figure' && pen.log.indexOf('drawImage') < 0 && pen.log.indexOf('fill') >= 0);
    V.drawPlayer.sprites['qb_back_run1.png'] = { width: 8, height: 12 };
    check('a loaded sprite is drawn instead of the figure', V.drawPlayer(pen, { x: 8, y: 8, scale: 2, id: 'qb', view: 'back', pose: 'run1' }) === 'sprite' && pen.log.indexOf('drawImage') >= 0);
    delete V.drawPlayer.sprites['qb_back_run1.png'];
    const look = { w: 400, h: 640 };
    const camNear = V.followBall({ x: 25, y: 0 }), camFar = V.followBall({ x: 55, y: 0 });
    const ballNear = V.project('behind', { x: 25, y: 0 }, camNear, look);
    const ballFar = V.project('behind', { x: 55, y: 0 }, camFar, look);
    const yardNear = V.project('behind', { x: 40, y: 0 }, camNear, look);
    const yardFar = V.project('behind', { x: 40, y: 0 }, camFar, look);
    check('the camera stays with the ball and the field scrolls', Math.abs(ballNear.y - ballFar.y) < 1 && Math.abs(yardNear.y - yardFar.y) > 8);
    const learned = M.create({ seed: 2 }); learned.usage.quick = 4;
    check('a save keeps what the defence has learned', M.restore(M.serialise(learned)).usage.quick === 4);
    const stale = M.create({ seed: 4 });
    stale.spot = 98; stale.down = 3; stale.toGo = 2; stale.possession = 'home';
    stale.last = { text: 'Mara Holt is stopped for 5.', serial: 1, quarter: 1, down: 2, toGo: 7, spot: 93, possession: 'home' };
    stale.playSerial = 3;
    check('3rd and Goal from the 2 hides a stale stopped-for-5 line', M.currentMessage(stale).indexOf('stopped for 5') < 0);
    M.callPlay(stale, 'inside'); M.finish(stale, M.policies.neutral);
    const fresh = M.currentMessage(stale);
    check('that snap\'s own message matches the down on the board', fresh.length > 0 && fresh.indexOf('stopped for 5') < 0 && stale.last.down === stale.down && Math.abs(stale.last.spot - stale.spot) < 0.25 && (stale.last.kind === 'score' ? /Touchdown/.test(fresh) : /Goal/.test(fresh)));
    const ring = V.fitCircle({ x: 200, y: 300 }, 250, { w: 400, h: 600 }, 8);
    check('an aim ring stays inside a 400px field', ring.x - ring.r >= 8 && ring.x + ring.r <= 392 && ring.y - ring.r >= 8 && ring.y + ring.r <= 592);
    const body = V.project('behind', { x: 0, y: 0 }, { x: -3, y: 0 }, { w: 400, h: 640 });
    check('players stay a readable size at 400px wide', body.scale >= 1.8);

    frame = document.createElement('iframe');
    frame.title = 'Lantern Bowl test instance';
    frame.src = '../games/lantern-bowl/index.html';
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Error('load timed out')), 20000);
      frame.onload = () => { clearTimeout(timer); resolve(); };
      document.querySelector('#game').appendChild(frame);
    });
    const w = frame.contentWindow, d = w.document;
    await wait();
    const H = w.__lantern;
    check('local test hook', !!H && H.M === w.LanternModel);
    check('shared settings row is on the page', !!d.querySelector('.arc-set-btn'));
    check('shared sound control is on the page', !!d.querySelector('#sound'));
    H.kickoff(5);
    await wait();
    check('kickoff starts a drive you can call', H.state && H.state.phase === 'call' && H.state.possession === 'home' && d.querySelectorAll('[data-play]').length >= 4);
    H.begin('inside');
    check('the snap is live before the picture is asked to move it', H.state.phase === 'live' && H.state.play.lanes.length === 3);
    H.finishLive();
    await wait();
    const saved = JSON.parse(localStorage.getItem('lantern-bowl-save-v1'));
    check('the play is saved through the shared engine', !!saved && saved.game === 'lantern-bowl' && saved.v === 1 && !!saved.match && saved.match.seed === 5);
    check('the save remembers the score', saved.match.score.home === H.state.score.home && saved.match.score.away === H.state.score.away);
    const spot = saved.match.spot, rng = saved.match.rng;
    frame.remove();
    frame = document.createElement('iframe');
    frame.title = 'Lantern Bowl resume';
    frame.src = '../games/lantern-bowl/index.html';
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Error('reload timed out')), 20000);
      frame.onload = () => { clearTimeout(timer); resolve(); };
      document.querySelector('#game').appendChild(frame);
    });
    const w2 = frame.contentWindow, d2 = w2.document;
    await wait();
    d2.querySelector('[data-continue]').click();
    await wait();
    check('continue loads the saved drive', w2.__lantern.state.spot === spot && w2.__lantern.state.rng === rng && w2.__lantern.state.seed === 5);
    const sheet = d2.querySelector('#sheet');
    const resumed = w2.__lantern.state;
    const offRatings = resumed[resumed.possession];
    const defRatings = resumed[resumed.possession === 'home' ? 'away' : 'home'];
    check('the ratings use plain words', !!sheet && /throwing/.test(sheet.textContent) && /catching/.test(sheet.textContent) && /blockers|rush is through/.test(sheet.textContent) && sheet.textContent.indexOf('vs rush') < 0);
    sheet.click();
    await wait();
    check('a tap on the ratings shows the numbers', sheet.textContent.indexOf('throw ' + offRatings.qb.throw) >= 0 && sheet.textContent.indexOf('hands ' + offRatings.wr[0].catch) >= 0 && sheet.textContent.indexOf('rush ' + defRatings.rush) >= 0);
    sheet.click();
    await wait();
    const spotOf = id => {
      const el = d2.querySelector('[data-play="' + id + '"]');
      const r = el.getBoundingClientRect();
      return { left: r.left, top: r.top, off: el.disabled };
    };
    const beforeDown = {};
    ['inside', 'outside', 'quick', 'deep', 'kick'].forEach(id => { beforeDown[id] = spotOf(id); });
    check('play buttons carry an icon and a short name', ['Inside', 'Outside', 'Quick', 'Deep', 'Kick'].every(word => {
      const btn = Array.from(d2.querySelectorAll('#dock button')).find(b => b.textContent.indexOf(word) >= 0);
      return btn && btn.querySelector('svg');
    }));
    check('kick keeps its seat before fourth down', beforeDown.kick.off === true);
    const kickBtn = d2.querySelector('[data-play="kick"]'), turboBtn = d2.querySelector('#turbo');
    check('a grey kick says it waits for fourth down', !!kickBtn && kickBtn.disabled && /fourth down/i.test(kickBtn.getAttribute('aria-label') || ''));
    check('a grey turbo says it waits for the play', !!turboBtn && turboBtn.disabled && /ball is moving/i.test(turboBtn.getAttribute('aria-label') || ''));
    resumed.down = 4;
    w2.__lantern.refresh();
    await wait();
    const stayed = ['inside', 'outside', 'quick', 'deep', 'kick'].every(id => {
      const now = spotOf(id);
      return Math.abs(now.left - beforeDown[id].left) < 2 && Math.abs(now.top - beforeDown[id].top) < 2;
    });
    check('fourth down does not move the play buttons', stayed && spotOf('kick').off === false);
    resumed.down = 1;
    w2.__lantern.refresh();
    await wait();
    w2.__lantern.begin('inside');
    await wait();
    check('a snap keeps only the score, the down and the clock', d2.querySelector('#sheet').hidden && !d2.querySelector('#windLabel') && !d2.querySelector('#gas') && d2.querySelector('#clock').textContent.length > 0 && d2.querySelector('#down').textContent.length > 0);
    const liveButtons = ['inside', 'outside', 'quick', 'deep', 'kick'].map(spotOf);
    check('the play buttons stay put during the snap', liveButtons.every((now, i) => Math.abs(now.left - beforeDown[['inside', 'outside', 'quick', 'deep', 'kick'][i]].left) < 2));
    w2.__lantern.finishLive();
    await wait();
    const carried = d2.querySelector('#sheet');
    check('the ratings follow the ball carrier', !!carried && !carried.hidden && carried.textContent.indexOf('Mara Holt') >= 0 && carried.textContent.indexOf('carry') >= 0 && carried.textContent.indexOf('throw') < 0);
    resumed.possession = 'home';
    resumed.phase = 'call';
    resumed.down = 1;
    const ours = d2.querySelector('[data-ours]');
    if (ours) ours.click();
    else w2.__lantern.refresh();
    await wait();

    for (const [width, height] of [[375, 812], [400, 700], [420, 780], [667, 375], [1366, 768]]) {
      frame.style.width = width + 'px'; frame.style.height = height + 'px';
      await wait();
      check(width + '×' + height + ' stays on the screen', d2.documentElement.scrollWidth <= width + 1 && d2.documentElement.scrollHeight <= height + 1);
      check(width + '×' + height + ' play buttons are thumb sized', Array.from(d2.querySelectorAll('#dock button, #settingsMount button, .home')).every(b => b.getBoundingClientRect().height >= 40));
      if (width === 400) {
        const boxes = [d2.querySelector('h1'), d2.querySelector('.home'), d2.querySelector('#settingsMount button')].map(el => el.getBoundingClientRect());
        const mids = boxes.map(r => (r.top + r.bottom) / 2);
        check('the 400px header stays on one line', d2.querySelector('header').getBoundingClientRect().height < 72 && Math.max.apply(null, mids) - Math.min.apply(null, mids) < 8);
        const titleEl = d2.querySelector('h1');
        check('the 400px title reads Lantern Bowl', titleEl.textContent === 'Lantern Bowl' && titleEl.scrollWidth <= titleEl.clientWidth + 1);
        const lefts = {};
        ['inside', 'outside', 'quick', 'deep', 'kick'].forEach(id => {
          const r = d2.querySelector('[data-play="' + id + '"]').getBoundingClientRect();
          lefts[id] = { left: r.left, top: r.top };
        });
        resumed.down = 4;
        w2.__lantern.refresh();
        await wait();
        const held = ['inside', 'outside', 'quick', 'deep', 'kick'].every(id => {
          const r = d2.querySelector('[data-play="' + id + '"]').getBoundingClientRect();
          return Math.abs(r.left - lefts[id].left) < 2 && Math.abs(r.top - lefts[id].top) < 2;
        });
        check('at 400px the kick does not move the other plays', held && d2.querySelector('[data-play="kick"]').disabled === false);
        check('at 400px fourth down still fits', d2.documentElement.scrollWidth <= 401 && d2.documentElement.scrollHeight <= 701);
        resumed.down = 1;
        w2.__lantern.refresh();
        await wait();
        const field = d2.querySelector('.screen').getBoundingClientRect();
        const ratings = d2.querySelector('#sheet').getBoundingClientRect();
        check('the 400px ratings stay on the field', ratings.width > 0 && ratings.left >= field.left - 1 && ratings.right <= field.right + 1 && ratings.bottom <= field.bottom + 1);
      }
      if (width === 420) {
        const home = d2.querySelector('.home'), gear = d2.querySelector('.arc-set-btn'), sound = d2.querySelector('#sound');
        const homeBox = home.getBoundingClientRect(), gearBox = gear.getBoundingClientRect(), soundBox = sound.getBoundingClientRect();
        check('at 420px Arcade, Settings and Sound stay whole', home.textContent.indexOf('Arcade') >= 0 && gear.textContent.indexOf('Settings') >= 0 && sound.textContent.indexOf('Sound') >= 0 && home.scrollWidth <= home.clientWidth + 2 && gear.scrollWidth <= gear.clientWidth + 2 && sound.scrollWidth <= sound.clientWidth + 2 && soundBox.height <= 52 && homeBox.top < 80 && gearBox.top < 80);
        const ratings420 = d2.querySelector('#sheet').getBoundingClientRect();
        const field420 = d2.querySelector('.screen').getBoundingClientRect();
        check('at 420px the stats line stays on the field', ratings420.width > 40 && ratings420.left >= field420.left - 1 && ratings420.right <= field420.right + 1 && ratings420.bottom <= field420.bottom + 1);
        const banner = d2.querySelector('#banner');
        banner.hidden = false; banner.textContent = 'The result sits low.';
        const players = field420.top + field420.height * 0.45;
        const bannerBox = banner.getBoundingClientRect();
        check('at 420px the result sits below the players', bannerBox.top > players);
        banner.hidden = true; banner.textContent = '';
      }
    }
    frame.style.width = '375px'; frame.style.height = '812px';
    d2.documentElement.style.setProperty('--arc-text', '1');
    await wait();
    const baseTitle = parseFloat(w2.getComputedStyle(d2.querySelector('h1')).fontSize);
    d2.documentElement.style.setProperty('--arc-text', '1.3');
    await wait();
    const bigTitle = parseFloat(w2.getComputedStyle(d2.querySelector('h1')).fontSize);
    check('the title follows the text size', bigTitle > baseTitle * 1.2 && bigTitle < baseTitle * 1.45);
    check('larger text stays on a phone', d2.documentElement.scrollWidth <= 376 && d2.documentElement.scrollHeight <= 813);

    const again = w2.__lantern;
    again.state.quarter = 4; again.state.clock = 3; again.state.down = 1; again.state.toGo = 10; again.state.spot = 40; again.state.possession = 'home'; again.state.phase = 'call';
    again.state.score.home = 7; again.state.score.away = 0;
    again.begin('inside'); again.finishLive();
    await wait();
    check('a finished game offers play again', again.state.phase === 'final' && !!d2.querySelector('[data-again]'));
    d2.querySelector('[data-again]').click();
    await wait();
    check('play again comes back to the kickoff', !!d2.querySelector('[data-kick]') && !d2.querySelector('[data-play]'));
    check('play again clears the last play', (d2.querySelector('#banner').textContent || '') === '' && (d2.querySelector('#sheet').textContent || '') === '');
    check('the version is visible', (d2.querySelector('#build').textContent || '') === 'v' + again.VERSION);
    check('the field and the dialog do not select text', w2.getComputedStyle(d2.querySelector('#field')).userSelect === 'none' && w2.getComputedStyle(d2.querySelector('.panel')).userSelect === 'none');
    d2.querySelector('[data-kick]').click();
    await wait();
    check('the new kickoff is 1st and 10 at the 25', again.state.quarter === 1 && again.state.down === 1 && again.state.score.home === 0 && again.state.score.away === 0 && Math.round(again.state.spot) === 25);
    check('a v1 save still loads', again.migrateSave({ v: 1, game: 'lantern-bowl', sound: 0, match: null }).v === 1);
    check('a save newer than this game is refused', again.migrateSave({ v: 2, game: 'lantern-bowl', sound: 0, match: null }) === null);
    const savedVersion = again.migrateSave.SAVE_V;
    again.migrateSave.SAVE_V = 2;
    again.migrateSave.steps[1] = o => { const next = Object.assign({}, o); next.v = 2; next.stepped = true; return next; };
    const climbed = again.migrateSave({ v: 1, game: 'lantern-bowl', sound: 1, match: { score: { home: 3, away: 0 }, home: { qb: { name: 'Wren Talley' } }, away: { qb: { name: 'Ned Harrow' } } } });
    check('a v1 save steps up through steps[1] when the game is v2', !!climbed && climbed.v === 2 && climbed.stepped === true && climbed.sound === 1 && climbed.match.score.home === 3);
    check('a v3 save is refused while the game is v2', again.migrateSave({ v: 3, game: 'lantern-bowl', sound: 0, match: null }) === null);
    delete again.migrateSave.steps[1];
    again.migrateSave.SAVE_V = savedVersion;
    d2.querySelector('#field').dispatchEvent(new w2.PointerEvent('pointerdown', { clientX: 30, clientY: 80, pointerId: 7, bubbles: true }));
    await wait();
    check('a drag before a play asks for one', (d2.querySelector('#banner').textContent || '').indexOf('Pick a play') >= 0);
    again.rush(true);
    again.state.down = 4; again.state.spot = 28; again.state.toGo = 10; again.state.phase = 'call'; again.state.possession = 'home';
    again.state.quarter = 1; again.state.clock = 120; again.state.seed = 1; again.state.rng = 1;
    again.begin('kick');
    let driveDone = false;
    for (let i = 0; i < 40 && !driveDone; i++) {
      await wait();
      driveDone = again.state.possession === 'home' || again.state.phase === 'final';
    }
    const driveText = (again.state.log || []).join(' ');
    check('Millrace\'s drive plays on the field and names why the ball changed', driveDone && !d2.querySelector('.cpu-log') && /punt|Turnover|Intercept|Touchdown|Safety|Halftime|makes it|misses from|Overtime/.test(driveText) && d2.querySelector('#field'));
    again.state.quarter = 4; again.state.clock = 3; again.state.possession = 'away'; again.state.phase = 'cpu'; again.state.down = 1; again.state.toGo = 10; again.state.spot = 30; again.state.score.home = 14; again.state.score.away = 0;
    again.playCpu();
    let sawFinal = false;
    for (let i = 0; i < 40 && !sawFinal; i++) {
      await wait();
      sawFinal = again.state.phase === 'final';
    }
    check('the end of the game is the final screen', sawFinal && d2.querySelector('#panelTitle').textContent === 'Final' && !d2.querySelector('.cpu-log'));
    sum.textContent = 'PASS — ' + n + ' checks.';
  } catch (e) {
    sum.textContent = 'FAIL — ' + e.message;
  } finally {
    if (frame) frame.remove();
    Object.keys(localStorage).filter(managed).forEach(k => localStorage.removeItem(k));
    for (const [k, v] of backup) localStorage.setItem(k, v);
    button.disabled = false;
  }
};
</script>
</html>
