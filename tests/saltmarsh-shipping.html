<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Saltmarsh Shipping checks</title>
<style>
  body{font:16px system-ui,sans-serif;background:#23394c;color:#d4e5e4;max-width:900px;margin:32px auto;padding:0 20px}
  button{font:inherit;padding:10px 18px;cursor:pointer}
  li{padding:5px 0;overflow-wrap:anywhere}
  .pass{color:#9ee7ba}.fail{color:#ff9a9a}#summary{font-weight:bold}
  iframe{width:375px;height:700px;border:0;background:#e7f0ef}
</style>
<h1>Saltmarsh Shipping checks</h1>
<p>Boats, routes, lighthouses, the ending, and a save that fails safe.</p>
<button id="run">Run checks</button>
<p id="summary">Ready.</p>
<ol id="results"></ol>
<div id="game"></div>
<script src="../shared/engine.js"></script>
<script src="../shared/idle-core.js"></script>
<script src="../shared/roster.js"></script>
<script src="../games/saltmarsh-shipping/model.js"></script>
<script src="../games/saltmarsh-shipping/phase.js"></script>
<script src="../tools/saltmarsh-pacing.cjs"></script>
<script>
'use strict';
document.querySelector('#run').onclick = async function () {
  var sum = document.querySelector('#summary');
  var list = document.querySelector('#results');
  var button = document.querySelector('#run');
  button.disabled = true;
  list.replaceChildren();
  sum.textContent = 'Running…';
  var n = 0;
  var M = window.Saltmarsh;
  var P = window.SaltmarshPhase;
  var KEY = M.SAVE_KEY;
  var storedKeys = Object.keys(localStorage).slice().sort().join('|');
  function check(name, ok) {
    n++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + name;
    list.appendChild(li);
    if (!ok) throw Error(name);
  }
  function near(a, b) {
    var d = Math.abs(a - b);
    return d <= 1e-6 || d <= 1e-8 * Math.max(1, Math.abs(a), Math.abs(b));
  }
  function ready(trips) {
    var state = M.fresh();
    state.trips = trips == null ? M.HAND_TRIPS : trips;
    return state;
  }
  var frame = null;
  try {
    check('four boats, and the first three match the spec',
      M.BOATS.length === 4 &&
      M.BOATS[0].base === 8 && M.BOATS[0].growth === 1.07 && M.BOATS[0].rate === 0.6 &&
      M.BOATS[1].base === 120 && M.BOATS[1].growth === 1.08 && M.BOATS[1].rate === 5 &&
      M.BOATS[2].base === 1800 && M.BOATS[2].growth === 1.10 && M.BOATS[2].rate === 40);
    check('the bark stays inside the gentle growth band', M.BOATS[3].id === 'bark' && M.BOATS[3].base === 28000 && M.BOATS[3].growth === 1.08 && M.BOATS[3].rate === 800 && M.BOATS[3].growth >= 1.05 && M.BOATS[3].growth <= 1.15);
    check('milestones are the shared doubles', Idle.milestoneMult(24) === 1 && Idle.milestoneMult(25) === 2 && Idle.milestoneMult(50) === 4 && Idle.milestoneMult(100) === 8);
    check('a hand cargo pays 5', (function () { var s = M.fresh(); return M.handSell(s, 0).ok && s.cash === 5 && s.trips === 1; })());

    var early = M.fresh();
    early.cash = 1000;
    check('two cargoes are not enough to buy a boat', M.handSell(early).ok && M.handSell(early).ok && M.buy(early, 0, 1).ok === false && early.boats[0].owned === 0 && M.quote(early, 0, 1).blocked === 'trips');
    M.handSell(early);
    check('the third cargo lets you buy, and the first rowboat costs 8', M.unlocked(early, 0) && near(M.quote(early, 0, 1).cost, 8) && M.buy(early, 0, 1).ok && early.boats[0].owned === 1 && early.cash === 1007);
    check('one rowboat earns 0.6 a second, with no extra bonus', M.production(early, 0) === 0.6 && M.income(early) === 0.6);
    check('a sloop stays shut until the rowboats are ready', M.unlocked(early, 1) === false && M.buy(early, 1, 'max').ok === false && (function () {
      var shut = ready();
      shut.boats[0].owned = M.SLOOP_AT - 1;
      var open = ready();
      open.boats[0].owned = M.SLOOP_AT;
      return M.unlocked(shut, 1) === false && M.unlocked(open, 1) === true;
    })());

    var bulk = ready();
    bulk.cash = 1000;
    var ten = Idle.bulkCost(8, 1.07, 0, 10);
    check('buy 10 uses the shared bulk price', M.buy(bulk, 0, 10).ok && bulk.boats[0].owned === 10 && near(1000 - bulk.cash, ten));
    var room = bulk.cash;
    var afford = Idle.maxAffordable(8, 1.07, 10, room);
    var spent = Idle.bulkCost(8, 1.07, 10, afford);
    check('buy max never overspends and leaves the next one out of reach', M.buy(bulk, 0, 'max').ok && bulk.boats[0].owned === 10 + afford && near(room - bulk.cash, spent) && bulk.cash >= 0 && M.quote(bulk, 0, 1).count === 0);

    var mile = ready();
    mile.boats[0].owned = 24;
    mile.cash = 1000;
    var before = M.production(mile, 0);
    check('the 25th rowboat doubles the row', before === 0.6 * 24 && M.buy(mile, 0, 1).ok && M.production(mile, 0) === 0.6 * 25 * 2 && M.production(mile, 0) > before + 0.6);
    check('the first rowboat pays for itself in about 13 seconds', near(M.paybackSeconds(ready(), 0), 8 / 0.6));
    var pays = ready();
    pays.boats[0].owned = M.SLOOP_AT;
    check('the sloop pays for itself in 24s once the rowboats are tied up', M.unlocked(pays, 1) && near(M.paybackSeconds(pays, 1), 24) && M.paybackSeconds(pays, 2) === Infinity);
    var schoon = ready();
    schoon.boats[0].owned = 10;
    schoon.boats[1].owned = 10;
    check('the first schooner pays for itself in 45s', M.unlocked(schoon, 2) && near(M.paybackSeconds(schoon, 2), 45));

    var fresh = M.fresh();
    check('a new office starts on the water, with one shed and the sound off', fresh.trips === 0 && fresh.warehouses === 1 && fresh.sound === 0 && fresh.boats.every(function (b) { return b.owned === 0; }) && fresh.captains.every(function (c) { return !c.hired; }) && P.goal(fresh) === 'Row 3 cargoes yourself. Then a second boat can tie up.');
    check('hiring waits until the boats are real', M.canHire(fresh, 0) === false && M.hire(fresh, 0).ok === false);
    var phase = P.read(fresh);
    check('trade routes stay shut on a new office', phase.boats === false && phase.captain === false && phase.fleet === false && phase.routesReady === false && phase.routesOpen === false && P.routesOpen() === true);

    var pier = ready();
    pier.boats[0].owned = M.WREN_AT - 1;
    check('the captain waits one boat early', M.canHire(pier, 0) === false && P.read(pier).captain === false);
    pier.boats[0].owned = M.WREN_AT;
    check('enough rowboats open the captain, not the fleet', P.read(pier).captain && P.read(pier).fleet === false && M.canHire(pier, 0) && M.hire(pier, 0).ok && pier.captains[0].hired && /179 coins every 20 seconds/.test(pier.log[0].text));
    check('the goal names Capt. Wren before the hire and a sloop after', (function () {
      var s = ready();
      s.boats[0].owned = M.WREN_AT - 1;
      var before = P.goal(s);
      s.boats[0].owned = M.WREN_AT;
      var ask = P.goal(s);
      M.hire(s, 0, 1000);
      return /rowboat/.test(before) && ask === M.askLine(0) && /sloop/.test(P.goal(s));
    })());
    var fleet = ready();
    fleet.boats[0].owned = M.SLOOP_AT;
    fleet.boats[1].owned = 10;
    M.hire(fleet, 0, 1000);
    check('ten sloops unroll the fleet', (function () {
      if (!(P.read(fleet).fleet && P.name(fleet) === 'fleet')) return false;
      if (P.goal(fleet) !== 'Choose a lighter sloop hull, or another shed.') return false;
      if (!M.noteFleet(fleet) || !/unrolls on the desk/.test(fleet.log[0].text)) return false;
      fleet.cash = 700;
      if (!M.chooseFork(fleet, 'sloop', 'fit').ok) return false;
      return P.goal(fleet) === M.askLine(1) && M.settledForks(fleet).some(function (row) { return /locked/.test(row.lockedName) === false && row.lockedName === 'Another shed'; });
    })());
    var marked = ready();
    marked.boats[0].owned = M.SLOOP_AT;
    marked.boats[1].owned = 10;
    marked.boats[2].owned = 9;
    marked.cash = 700;
    M.hire(marked, 0, 1000);
    M.hire(marked, 1, 1000);
    M.chooseFork(marked, 'sloop', 'shed');
    var almost = P.goal(marked);
    marked.boats[2].owned = 10;
    check('ten schooners open the routes', /next tide/.test(almost) && /furled/.test(almost) === false && P.read(marked).routesReady && P.read(marked).routesOpen === true && P.routesOpen() === true && P.goal(marked) === 'Choose a deeper schooner hold, or another shed.');

    var clock = 1700000000000;
    var haul = ready();
    haul.boats[0].owned = M.WREN_AT;
    check('a captain is hired onto a clock', M.hire(haul, 0, clock).ok && haul.jobs.wren && haul.jobs.wren.since === clock);
    var firstPay = haul.cash;
    var once = M.collectCaptains(haul, clock + 20000, 1);
    var paid = haul.cash;
    var again = M.collectCaptains(haul, clock + 20000, 1);
    var later = M.collectCaptains(haul, clock + 40000, 1);
    check('the same stretch pays Capt. Wren once, one coin short', once.length === 1 && once[0].units === 1 && again.length === 0 && paid - firstPay === 179 && later.length === 1 && later[0].units === 1 && haul.cash - paid === 179 && haul.log.some(function (line) { return /gull/i.test(line.text); }));
    check('a short gap pays nothing', (function () {
      var s = ready();
      s.boats[0].owned = M.WREN_AT;
      M.hire(s, 0, clock);
      var beforeCash = s.cash;
      var none = M.collectCaptains(s, clock + 19999, 1);
      return none.length === 0 && s.cash === beforeCash;
    })());
    check('away hauls pay half, and only from the clock', (function () {
      var s = ready();
      s.boats[0].owned = M.WREN_AT;
      M.hire(s, 0, clock);
      var beforeCash = s.cash;
      var rows = M.collectCaptains(s, clock + 20000, 0.5);
      var replay = M.collectCaptains(s, clock + 20000, 0.5);
      return rows.length === 1 && near(s.cash - beforeCash, 89) && replay.length === 0;
    })());

    check('one shed holds 2h and four sheds hold 8h, at half pay', M.offlineCap(ready()) === 2 * 3600 && M.OFFLINE_RATE === 0.5 && (function () { var s = ready(); s.warehouses = 4; return M.offlineCap(s) === 8 * 3600; })());
    check('the away line names the half rate and the sheds', M.awayRule(ready()) === 'Closed: 50% up to 2h (1 shed). Open page: full rate.');
    check('the mooring line pluralises', (function () {
      var s = ready();
      s.boats[0].owned = 2;
      s.boats[1].owned = 2;
      s.boats[2].owned = 2;
      s.boats[3].owned = 2;
      return M.lookLine(s, 0) === '2 boats tied at the dock.' && M.lookLine(s, 1) === '2 sloops on the mooring.' && M.lookLine(s, 2) === '2 schooners outside the bar.' && M.lookLine(s, 3) === '2 barks on the deep mooring.';
    })());
    check('the skiff keeps paying after Wren arrives', (function () {
      var s = ready();
      s.boats[0].owned = 10;
      var pay = M.handPay(s);
      var sold = M.handSell(s, 0);
      var hired = ready();
      hired.boats[0].owned = M.WREN_AT;
      M.hire(hired, 0, 1000);
      var again = M.handSell(hired, 0);
      var expected = Math.max(5, Math.round((M.income(hired) + M.captainRate(hired)) * 3));
      return pay === 18 && sold.ok && sold.pay === 18 && again.ok && again.pay === expected;
    })());
    check('a lighter hull is a one-off and each sloop earns one more coin', (function () {
      var s = ready();
      s.boats[0].owned = M.SLOOP_AT;
      s.boats[1].owned = 10;
      s.cash = 50;
      if (M.buyFitting(s, 'sloop-hull').ok) return false;
      s.cash = 700;
      var before = M.production(s, 1);
      if (!M.buyFitting(s, 'sloop-hull').ok) return false;
      return before === 50 && M.production(s, 1) === 60 && M.buyFitting(s, 'sloop-hull').ok === false && s.forks.sloop === 'fit';
    })());
    check('the hull and the shed lock each other', (function () {
      var hull = ready();
      hull.boats[0].owned = M.SLOOP_AT;
      hull.boats[1].owned = 10;
      hull.cash = 700;
      var offer = M.choiceOffer(hull);
      if (!offer || offer.goal !== 'Choose a lighter sloop hull, or another shed.') return false;
      if (!M.chooseFork(hull, 'sloop', 'fit').ok) return false;
      if (M.chooseFork(hull, 'sloop', 'shed').ok) return false;
      var shed = ready();
      shed.boats[0].owned = M.SLOOP_AT;
      shed.boats[1].owned = 10;
      shed.cash = 480;
      if (!M.chooseFork(shed, 'sloop', 'shed').ok) return false;
      return shed.warehouses === 2 && M.buyFitting(shed, 'sloop-hull').ok === false && M.choiceOffer(shed) == null;
    })());
    check('twelve barks grow the quay, and the log says so', (function () {
      var s = ready();
      s.boats[0].owned = M.SLOOP_AT;
      s.boats[1].owned = 10;
      s.boats[2].owned = 10;
      s.boats[3].owned = 11;
      s.cash = 1000000;
      var bought = M.buy(s, 3, 1);
      return bought.ok && s.boats[3].owned === 12 && bought.notes.length === 1 && /quay grows longer/.test(s.log[0].text);
    })());
    check('a full shed yard does not pretend to cost nothing', M.shedChoiceText(null) === 'The sheds are full' && M.shedChoiceText(480) === 'Another shed · 480 coins');
    check('a closed-game captain line gives the haul total', (function () {
      var s = ready();
      s.captains[0].hired = true;
      s.captains[0].hauls = 4;
      s.captains[0].brought = 696;
      return M.captainAwayLines(s, [0, 0, 0, 0], [0, 0, 0, 0])[0] === 'Capt. Wren: 4 hauls, 696 coins.';
    })());
    check('the hull bonus stays flat when the row doubles', (function () {
      var s = ready();
      s.boats[1].owned = 25;
      s.fittings['sloop-hull'] = true;
      return M.production(s, 1) === 5 * 25 * 2 + 25;
    })());
    check('each captain\'s habit shows on the log', (function () {
      var s = ready();
      s.boats[0].owned = M.WREN_AT;
      s.boats[1].owned = 10;
      s.boats[2].owned = 10;
      s.boats[3].owned = 10;
      var t = 1700000000000;
      M.hire(s, 0, t);
      M.hire(s, 1, t);
      M.hire(s, 2, t);
      M.hire(s, 3, t);
      M.collectCaptains(s, t + 36000, 1);
      var log = s.log.map(function (line) { return line.text; }).join(' ');
      return s.marks >= 1 && /gull/i.test(log) && /kettle/i.test(log) && /chart/.test(log) && /Grey Lark|Kettle|Whelk|Reed/.test(log);
    })());
    check('the away log shows the coins you left and the coins you came back to', (function () {
      var s = ready();
      s.boats[0].owned = M.WREN_AT;
      M.hire(s, 0, 1000);
      var books = M.captainBooks(s);
      var copy = M.awayCopy(s, { away: 188, credited: 188, gained: 771000, capped: false }, {
        before: 219000, after: 990000, boatGain: 771000,
        captains: M.captainAwayLines(s, books), openPage: false
      });
      var open = M.awayCopy(s, { away: 188, credited: 188, gained: 1540000, capped: false }, {
        before: 219000, after: 1759000, boatGain: 1540000,
        captains: ['Capt. Wren added 0 coins.'], openPage: true
      });
      var text = copy.lead + ' ' + copy.box;
      var openText = open.lead + ' ' + open.box;
      return /closed/.test(text) && /50%/.test(text) && /219K/.test(text) && /771K/.test(text) && /990K/.test(text) && /Wren was out/.test(text) && /stayed open/.test(openText) && /full rate/.test(openText) && /shed/.test(text) === false;
    })());

    var wall = 1700000000000;
    var realNow = Date.now;
    var realSet = window.setInterval;
    var realClear = window.clearInterval;
    var title = document.title;
    Date.now = function () { return wall; };
    window.setInterval = function () { return 1; };
    window.clearInterval = function () {};
    try {
      var office = ready();
      office.boats[0].owned = 10;
      var idle = M.createIdle(office, function () {});
      var away = idle.start(wall - 30 * 3600 * 1000);
      check('the tab title carries the income', document.title === '+' + Arcade.fmt(6) + '/s · Saltmarsh Shipping');
      idle.stop();
      check('thirty hours away with one shed pays two hours at half rate', away && away.capped && away.credited === 2 * 3600 && near(away.gained, 6 * 2 * 3600 * 0.5));
      check('the welcome back names the shed and the half rate', /While you were away/.test(M.awayCopy(office, away).title) && /2 hours/.test(M.awayCopy(office, away).lead) && /50%/.test(M.awayCopy(office, away).lead));

      office = ready();
      office.boats[0].owned = 10;
      office.warehouses = 4;
      idle = M.createIdle(office, function () {});
      var long = idle.start(wall - 30 * 3600 * 1000);
      idle.stop();
      check('four sheds raise the cap to eight hours', long && long.capped && long.credited === 8 * 3600 && near(long.gained, 6 * 8 * 3600 * 0.5));

      office = ready();
      office.boats[0].owned = 10;
      idle = M.createIdle(office, function () {});
      var hour = idle.start(wall - 3600 * 1000);
      idle.stop();
      check('one hour away is inside the shed and still half', hour && hour.capped === false && hour.credited === 3600 && near(hour.gained, 6 * 3600 * 0.5));
    } finally {
      Date.now = realNow;
      window.setInterval = realSet;
      window.clearInterval = realClear;
      if (document.title !== title) document.title = title;
    }

    var round = ready();
    round.cash = 42.5;
    round.lifetime = 80;
    round.sound = 1;
    round.boats[0].owned = 4;
    round.boats[1].owned = 10;
    M.hire(round, 1, 12345);
    round.log.push({ t: 50, text: 'A gull on the ledger.' });
    var raw = M.serialize(round, 999);
    var back = M.restore(raw);
    check('a save round-trip keeps the office', M.valid(raw) && JSON.stringify(M.serialize(back, 999)) === JSON.stringify(raw) && back.jobs.bramble.since === 12345 && back.captains[1].hired && back.sound === 1);

    var threw = false;
    var broken = null;
    try { broken = M.openSave(null); } catch (e) { threw = true; }
    try { broken = M.openSave({ game: 'other' }); } catch (e) { threw = true; }
    try { broken = M.restore('not-a-save'); } catch (e) { threw = true; }
    try { JSON.parse('{'); } catch (e) { /* the engine meets this; the office must not */ }
    var junk = M.openSave('{');
    check('a missing or corrupt save starts fresh and does not throw', threw === false && broken.trips === 0 && broken.cash === 0 && broken.boats[0].owned === 0 && junk.trips === 0 && junk.cash === 0);
    var oldShape = { v: 1, game: 'saltmarsh-shipping', cash: 12, lifetime: 12, trips: 3, warehouses: 1, sound: 0, boats: [{ owned: 4 }, { owned: 0 }, { owned: 0 }, { owned: 0 }], captains: [{ hired: false }, { hired: false }, { hired: false }, { hired: false }] };
    var kept = M.openSave(oldShape);
    var rotten = Object.assign({}, M.serialize(M.fresh(), 1), { routes: 'nope' });
    check('an older office save still loads, and a rotten routes field does not', kept.cash === 12 && kept.boats[0].owned === 4 && kept.routes.kelp === 0 && M.openSave(rotten).cash === 0);

    check('one coin is singular and a fraction of a coin stays a fraction', M.rateWords(1) === '1 coin a second' && M.rateWords(0.6) === '0.6 coins a second' && M.rateWords(6) === '6 coins a second');
    var fifty = ready();
    fifty.boats[0].owned = M.SLOOP_AT;
    fifty.boats[1].owned = 50;
    check('sloop payback follows the four-times milestone', near(M.paybackSeconds(fifty, 1), Idle.bulkCost(120, 1.08, 50, 1) / 20) && /Adds 20\/s \(×4\)/.test(M.paybackLine(fifty, 1)) && /Pays back in/.test(M.paybackLine(fifty, 1)));
    var waived = ready();
    waived.boats[0].owned = M.SLOOP_AT;
    waived.boats[1].owned = 10;
    waived.cash = 700;
    M.chooseFork(waived, 'sloop', 'fit');
    check('passing on a shed raises its price and does not build it', waived.warehouses === 1 && M.warehousePrice(waived) === 8400 && /further down the list/.test(M.shedNote(waived)) && /480/.test(M.shedNote(waived)) && /8\.40K/.test(M.shedNote(waived)) && /17\.5 times/.test(M.shedNote(waived)) && /lighter sloop hulls/.test(M.shedNote(waived)));
    waived.cash = 8400;
    check('buying the dearer shed adds one shed', M.buyWarehouse(waived).ok && waived.warehouses === 2);
    var yard = ready();
    yard.boats[0].owned = M.SLOOP_AT;
    yard.boats[1].owned = 10;
    yard.boats[2].owned = 10;
    yard.cash = 1e9;
    M.chooseFork(yard, 'sloop', 'fit');
    M.chooseFork(yard, 'schooner', 'fit');
    check('two passed sheds leave the 125K price, and buying it ends the list', M.warehousePrice(yard) === 125000 && (yard.cash = 125000) >= 0 && M.buyWarehouse(yard).ok && yard.warehouses === 2 && M.warehousePrice(yard) == null && /no third shed/.test(M.shedNote(yard)) && /locked/i.test(M.shedNote(yard)) === false);
    var step = ready();
    step.trips = 3;
    step.boats[0].owned = M.SLOOP_AT;
    step.boats[1].owned = 8;
    step.captains[0].hired = true;
    step.cash = 1e15;
    check('the goal cap stops at ten sloops while an uncapped max does not', M.goalCap(step, 1) === 10 && M.quote(step, 1, 'max').count > 2);
    var eight = ready();
    eight.trips = 3;
    eight.boats[0].owned = M.SLOOP_AT;
    eight.boats[1].owned = 2;
    eight.captains[0].hired = true;
    eight.cash = 1e9;
    check('eight sloops to the goal are eight boats, not one', P.boatNeed(eight).tier === 1 && P.boatNeed(eight).at === 10 && M.quote(eight, 1, 8).count === 8);
    var priced = ready();
    priced.trips = 3;
    priced.boats[0].owned = M.SLOOP_AT;
    priced.boats[1].owned = 10;
    priced.boats[2].owned = 10;
    priced.captains[0].hired = true;
    priced.captains[1].hired = true;
    priced.captains[2].hired = true;
    priced.forks = { sloop: 'fit', schooner: 'fit', quay: null };
    priced.cash = 1e15;
    var teaWas = M.routeOffers(priced, true).filter(function (o) { return o.id === 'tea'; })[0].cost;
    M.signRoute(priced, 'kelp', 1);
    var teaNow = M.routeOffers(priced, true).filter(function (o) { return o.id === 'tea'; })[0].cost;
    check('each route keeps its own contract count, and signing one does not raise the others', M.routeContract(priced, 'kelp').label === '1 signed · contract 2 of 4' && M.routeContract(priced, 'gull').label === '0 signed · contract 1 of 4' && M.routeContract(priced, 'tea').label === '0 signed · contract 1 of 4' && teaNow === teaWas);
    M.signRoute(priced, 'gull', 1);
    check('Gull Rock moves to contract 2 when Gull Rock is signed', M.routeContract(priced, 'gull').label === '1 signed · contract 2 of 4' && M.routeContract(priced, 'tea').label === '0 signed · contract 1 of 4');

    function readHarbour(canvas, width) {
      var rect = canvas.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      if (Math.abs(w - width) > 2) return { ok: false, why: 'canvas is ' + Math.round(w) + ' wide' };
      var dpr = canvas.width / w;
      var img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
      function px(x, y) {
        var ix = Math.round(x * dpr), iy = Math.round(y * dpr);
        var i = (iy * canvas.width + ix) * 4;
        return [img.data[i], img.data[i + 1], img.data[i + 2]];
      }
      function near(c, r, g, b, tol) {
        return c && Math.abs(c[0] - r) <= tol && Math.abs(c[1] - g) <= tol && Math.abs(c[2] - b) <= tol;
      }
      var y0 = h * 0.78 - 18, y1 = h * 0.78, lamp = [], sand = [], hull = [], y, x, c;
      for (y = y0; y <= y1; y += 1) {
        for (x = 0; x < w; x += 1) {
          c = px(x, y);
          if (near(c, 242, 208, 128, 18)) lamp.push([x, y]);
          if (near(c, 200, 197, 160, 16) && y < h * 0.78 - 2 && x > w * 0.28) sand.push([x, y]);
        }
      }
      var rowY = h * 0.74;
      for (y = rowY; y <= rowY + 8; y += 1) {
        for (x = 0; x < w; x += 1) if (near(px(x, y), 110, 88, 64, 18)) hull.push(x);
      }
      lamp.sort(function (a, b) { return a[0] - b[0]; });
      var flags = [];
      lamp.forEach(function (p) {
        var last = flags[flags.length - 1];
        if (!last || p[0] - last.maxX > 8) flags.push({ minX: p[0], maxX: p[0], minY: p[1], maxY: p[1] });
        else {
          last.maxX = Math.max(last.maxX, p[0]);
          last.minY = Math.min(last.minY, p[1]);
          last.maxY = Math.max(last.maxY, p[1]);
        }
      });
      if (flags.length !== 4) return { ok: false, why: flags.length + ' flags' };
      var cap = null;
      sand.forEach(function (p) {
        if (!cap) cap = { minX: p[0], maxX: p[0], minY: p[1], maxY: p[1] };
        else {
          cap.minX = Math.min(cap.minX, p[0]); cap.maxX = Math.max(cap.maxX, p[0]);
          cap.minY = Math.min(cap.minY, p[1]); cap.maxY = Math.max(cap.maxY, p[1]);
        }
      });
      if (!cap) return { ok: false, why: 'no captain' };
      var hit = flags.some(function (flag) {
        return cap.minX <= flag.maxX && cap.maxX >= flag.minX && cap.minY <= flag.maxY && cap.maxY >= flag.minY;
      });
      if (hit) return { ok: false, why: 'captain covers a flag' };
      if (cap.maxX > w * 0.60 + 1) return { ok: false, why: 'captain is past the pier' };
      var textRight = 0;
      for (y = rowY - 12; y <= rowY + 6; y += 1) {
        for (x = 0; x < w * 0.7; x += 1) if (near(px(x, y), 212, 229, 228, 28)) textRight = Math.max(textRight, x);
      }
      if (!(textRight + 4 < flags[0].minX)) return { ok: false, why: 'count meets the first flag' };
      var span = flags.every(function (flag) {
        var best = 0;
        for (x = flag.minX; x <= flag.minX + 2; x += 1) {
          var n = 0;
          for (y = y0; y <= y1; y += 1) if (near(px(x, y), 242, 208, 128, 18)) n += 1;
          best = Math.max(best, n);
        }
        return best >= 14;
      });
      if (!span) return { ok: false, why: 'a count plate cuts a flag' };
      var hullLeft = Math.min.apply(null, hull);
      if (!(hullLeft - flags[3].maxX >= 7)) return { ok: false, why: 'a flag meets a rowboat' };
      return { ok: true };
    }

      if (labelYs[li] < waterLine - 0.5 || labelYs[li] + 8 > labelH * 0.86 + 0.5) hullsOnWater = false;
    }
    check(labelsClear && hullsOnWater ? 'at 844 by 390 the boat labels do not overlap and every boat sits on the water' : 'at 844 by 390 harbour, height ' + Math.round(labelH) + ', water ' + waterLine.toFixed(1) + ', ys ' + labelYs.join(','), labelsClear && hullsOnWater);

    /* Open water is the sea itself, past every label plate, boat and the quay.
       A plate is already painted the water colour, so a sample on a plate cannot fail. */
    function openWater(win, label) {
      var canvas = win.document.querySelector('#harbour');
      var rect = canvas.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      var dpr = canvas.width / w;
      var img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
      var ctx = canvas.getContext('2d');
      function px(x, y) {
        var ix = Math.max(0, Math.min(canvas.width - 1, Math.round(x * dpr)));
        var iy = Math.max(0, Math.min(canvas.height - 1, Math.round(y * dpr)));
        var i = (iy * canvas.width + ix) * 4;
        return [img.data[i], img.data[i + 1], img.data[i + 2]];
      }
      function near(c, r, g, b, tol) {
        return c && Math.abs(c[0] - r) <= tol && Math.abs(c[1] - g) <= tol && Math.abs(c[2] - b) <= tol;
      }
      function isWater(c) { return near(c, 35, 57, 76, 6); }
      function isHull(c) { return near(c, 110, 88, 64, 16); }
      var state = win.__saltmarsh.state;
      var kinds = [['rowboat', 0], ['sloop', 1], ['schooner', 2], ['bark', 3]].filter(function (lane) {
        return state.boats[lane[1]].owned > 0;
      });
      var lay = win.SaltmarshHarbour.sceneLayout(h, kinds.length);
      ctx.font = '14px Georgia, Palatino, serif';
      var plates = kinds.map(function (lane, index) {
        var n = state.boats[lane[1]].owned;
        var word = n === 1 ? lane[0] : lane[0] + 's';
        var y = lay.ys[index];
        return { x1: ctx.measureText(n + ' ' + word).width + 20, y0: y - 14, y1: y + 8 };
      });
      function blocked(x, y) {
        if (y < lay.waterLine + 2 || y > h * 0.84 - 3) return true;
        if (x >= 24 && x <= 86 && y >= h * 0.70) return true;
        if (y >= lay.quayY - 2 && y <= lay.quayY + 10 && x >= w * 0.16) return true;
        var p;
        for (p = 0; p < plates.length; p++) {
          if (x <= plates[p].x1 && y >= plates[p].y0 && y <= plates[p].y1) return true;
        }
        var dx, dy;
        for (dx = -28; dx <= 28; dx += 4) {
          for (dy = -18; dy <= 12; dy += 4) {
            if (isHull(px(x + dx, y + dy))) return true;
          }
        }
        return false;
      }
      var hits = 0, skyHits = 0, sample = null;
      var y, x;
      /* Only the strip the risen waterline claims. A sea that starts at a fixed
         fraction of the canvas leaves this strip dry on a short harbour. */
      for (y = Math.ceil(lay.waterLine + 2); y <= lay.waterLine + 12; y += 2) {
        for (x = 8; x < w - 8; x += 4) {
          if (blocked(x, y)) continue;
          if (isWater(px(x, y))) { hits += 1; if (!sample) sample = [Math.round(x), Math.round(y)]; }
        }
      }
      for (x = 8; x < w * 0.3; x += 6) {
        if (isWater(px(x, Math.max(2, lay.waterLine - 10)))) skyHits += 1;
      }
      var ok = hits >= 12 && skyHits === 0;
      check(ok ? label + ' the open water is the sea, past the labels, boats and quay' : label + ' open water missed (' + hits + ' sea, ' + skyHits + ' sea-in-sky, sample ' + sample + ')', ok);
      return ok;
    }
    openWater(labelWin, 'at 844 by 390');
    async function openWaterAt(width, height) {
      wipe();
      localStorage.setItem(KEY, JSON.stringify(M.serialize(labelState, Date.now())));
      var frame = await loadFrame('open water ' + width + 'x' + height);
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      var win = frame.contentWindow;
      await new Promise(function (resolve) { win.requestAnimationFrame(function () { win.requestAnimationFrame(resolve); }); });
      openWater(win, 'at ' + width + ' by ' + height);
      if (width === 390 && height === 844) {
        var portraitGoal = win.document.querySelector('#goal').getBoundingClientRect().height;
        check('at 390 by 844 the goal is at least 44px tall', portraitGoal >= 44);
      }
    }
    await openWaterAt(390, 844);
    await openWaterAt(375, 812);

    wipe();
    var quayState = ready();
    quayState.boats[0].owned = 20;
    quayState.boats[1].owned = 12;
    quayState.boats[2].owned = 8;
    quayState.boats[3].owned = 16;
    localStorage.setItem(KEY, JSON.stringify(M.serialize(quayState, Date.now())));
    var quayFrame = await loadFrame('quay and lamp');
    quayFrame.style.width = '844px';
    quayFrame.style.height = '390px';
    var quayWin = quayFrame.contentWindow;
    await new Promise(function (resolve) { quayWin.requestAnimationFrame(function () { quayWin.requestAnimationFrame(resolve); }); });
    var quayCanvas = quayWin.document.querySelector('#harbour');
    var quayBox = quayCanvas.getBoundingClientRect();
    var quayLay = quayWin.SaltmarshHarbour.sceneLayout(quayBox.height, 4);
    var quayImg = quayCanvas.getContext('2d').getImageData(0, 0, quayCanvas.width, quayCanvas.height);
    var quayDpr = quayCanvas.width / quayBox.width;
    function quayPx(x, y) {
      var ix = Math.max(0, Math.min(quayCanvas.width - 1, Math.round(x * quayDpr)));
      var iy = Math.max(0, Math.min(quayCanvas.height - 1, Math.round(y * quayDpr)));
      var i = (iy * quayCanvas.width + ix) * 4;
      return [quayImg.data[i], quayImg.data[i + 1], quayImg.data[i + 2]];
    }
    var quayClear = true;
    var lane;
    for (lane = 0; lane < quayLay.ys.length; lane++) {
      if (quayLay.ys[lane] + 8 > quayLay.quayY - 3) quayClear = false;
    }
    var lampClear = quayLay.lampY + quayLay.lampR < quayLay.topLane - 10;
    function nearPaint(c, r, g, b, tol) {
      return c && Math.abs(c[0] - r) <= tol && Math.abs(c[1] - g) <= tol && Math.abs(c[2] - b) <= tol;
    }
    var timber = quayPx(quayBox.width * 0.3, quayLay.quayY + 2);
    var lampDot = quayPx(quayBox.width * 0.72, quayLay.lampY);
    check(quayClear && lampClear && nearPaint(timber, 141, 122, 82, 20) && nearPaint(lampDot, 242, 208, 128, 20) ? 'the quay and the bar lamp stay clear of the boats' : 'quay ' + quayLay.quayY.toFixed(1) + ' lamp ' + quayLay.lampY.toFixed(1) + ' top ' + quayLay.topLane.toFixed(1) + ' timber ' + timber + ' lamp ' + lampDot, quayClear && lampClear && nearPaint(timber, 141, 122, 82, 20) && nearPaint(lampDot, 242, 208, 128, 20));

    wipe();
    var touchFrame = await loadFrame('touch');
    var touchDoc = touchFrame.contentDocument;
    var row = touchDoc.querySelector('#row');
    var touch = new Touch({ identifier: 7, target: row, clientX: 48, clientY: 90 });
    row.dispatchEvent(new TouchEvent('touchstart', { bubbles: true, cancelable: true, touches: [touch], targetTouches: [touch], changedTouches: [touch] }));
    row.dispatchEvent(new TouchEvent('touchend', { bubbles: true, cancelable: true, changedTouches: [touch] }));
    row.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: 3, clientY: 4 }));
    var taps = touchFrame.contentWindow.__saltmarsh.taps;
    check('a tap uses the touch point and ignores the click after it', touchFrame.contentWindow.__saltmarsh.state.trips === 1 && taps.length === 1 && taps[0].source === 'touch' && taps[0].x === 48 && taps[0].y === 90);

    wipe();
    var keptOffice = ready();
    keptOffice.cash = 77;
    keptOffice.trips = 3;
    var keptRaw = JSON.stringify(M.serialize(keptOffice, 5));
    localStorage.setItem(KEY, keptRaw);
    async function presetFrame(name) {
      var box = await loadFrame('preset ' + name, '&state=' + name);
      await new Promise(function (resolve) { setTimeout(resolve, 500); });
      return box;
    }
    var fleetBox = await presetFrame('fleet');
    var fleetState = fleetBox.contentWindow.__saltmarsh.state;
    check('?state=fleet opens the routes and does not write the real save', localStorage.getItem(KEY) === keptRaw && fleetBox.contentWindow.__saltmarsh.preview === 'fleet' && fleetState.boats[2].owned >= 10 && fleetBox.contentWindow.SaltmarshPhase.read(fleetState).routesOpen && fleetBox.contentDocument.querySelector('#routes').hidden === false);
    var lampsBox = await presetFrame('lamps');
    check('?state=lamps lights three lamps and leaves the real save alone', localStorage.getItem(KEY) === keptRaw && lampsBox.contentWindow.Saltmarsh.lightsLit(lampsBox.contentWindow.__saltmarsh.state) === 3);
    var lampWin = lampsBox.contentWindow;
    var lampState = lampWin.__saltmarsh.state;
    lampState.cash = 1e18;
    lampState.played = 2000;
    var lampGuard = 0;
    while (lampWin.Saltmarsh.lightOffers(lampState, false).length && lampGuard++ < 8) {
      lampWin.Saltmarsh.buildLight(lampState, lampWin.Saltmarsh.lightOffers(lampState, false)[0].id, 1);
    }
    lampWin.__saltmarsh.view.freshPrices = true;
    lampWin.__saltmarsh.render();
    check('lighting every lighthouse on the lamps preset shows the last voyage and no open choice', lampWin.Saltmarsh.allLightsLit(lampState) && lampsBox.contentDocument.querySelector('#finale').hidden === false && /Send ·/.test(lampsBox.contentDocument.querySelector('#finale-go').textContent) && lampsBox.contentDocument.querySelector('#choice').hidden === true);
    var finalBox = await presetFrame('final');
    var finalState = finalBox.contentWindow.__saltmarsh.state;
    check('?state=final stops before the last voyage and leaves the real save alone', localStorage.getItem(KEY) === keptRaw && finalState.ended === false && finalBox.contentDocument.querySelector('#finale').hidden === false);
    async function holdLayout(preset, width, height, boatIndex) {
      var box = await loadFrame(preset + ' layout ' + width, '&state=' + preset);
      box.style.width = width + 'px';
      box.style.height = height + 'px';
      var win = box.contentWindow;
      var doc = box.contentDocument;
      await new Promise(function (resolve) { setTimeout(resolve, 150); });
      function pins() {
        var boat = doc.querySelector('#boats [data-i="' + boatIndex + '"]');
        var buy = boat && boat.querySelector('[data-act="buy"]');
        var routes = doc.querySelector('#routes');
        var buyTop = buy ? buy.getBoundingClientRect().top : null;
        var routesBottom = routes && routes.hidden === false ? routes.getBoundingClientRect().bottom : null;
        var routesH = routes && routes.hidden === false ? routes.offsetHeight : null;
        function h(sel, root) {
          var el = (root || doc).querySelector(sel);
          return el ? Math.round(el.getBoundingClientRect().height) : 0;
        }
        return {
          buyTop: buyTop, routesBottom: routesBottom, routesH: routesH,
          rate: h('#rate'), coins: h('.coins'), habit: h('.habit', boat), facts: h('.facts', boat), wait: h('.wait', boat)
        };
      }
      if (preset === 'fleet' && width === 1280 && height === 800) {
        win.__saltmarsh.render();
        var pageH = doc.documentElement.scrollHeight;
        var maxBtn = 0;
        var tooTall = false;
        var actionButtons = doc.querySelectorAll('.actions button');
        var bi;
        for (bi = 0; bi < actionButtons.length; bi++) {
          if (actionButtons[bi].hidden || actionButtons[bi].offsetParent === null) continue;
          var bh = actionButtons[bi].getBoundingClientRect().height;
          if (bh > maxBtn) maxBtn = bh;
          if (bh > 60) tooTall = true;
        }
        check('at 1280 by 800 the fleet page stays under about 5,100px, near the old 4,636px layout, and action buttons stay under 60px (' + pageH + 'px, button ' + Math.round(maxBtn) + 'px)', pageH <= 4636 * 1.10 && pageH >= 3200 && tooTall === false);
      }
      if (preset === 'lamps' && width === 1280 && height === 800) {
        win.__saltmarsh.render();
        var lampsWide = doc.documentElement.scrollHeight;
        check('at 1280 by 800 the lamps page stays within about 10% of 4,834px (' + lampsWide + 'px)', lampsWide <= 4834 * 1.10 && lampsWide >= 4834 * 0.90);
      }
      if (preset === 'lamps' && width === 390 && height === 844) {
        win.__saltmarsh.render();
        var lampsPhone = doc.documentElement.scrollHeight;
        check('at 390 by 844 the lamps page stays within about 10% of 5,700px (' + lampsPhone + 'px)', lampsPhone <= 5700 * 1.10 && lampsPhone >= 5700 * 0.90);
      }
      var st = win.__saltmarsh.state;
      st.boats[boatIndex].owned = 10;
      st.cash = 0;
      win.__saltmarsh.render();
      var shortLine = pins();
      st.boats[boatIndex].owned = 50;
      st.cash = 1e18;
      win.__saltmarsh.render();
      var longLine = pins();
      var buyShift = shortLine.buyTop == null || longLine.buyTop == null ? 999 : Math.abs(longLine.buyTop - shortLine.buyTop);
      var routeShift = shortLine.routesBottom == null || longLine.routesBottom == null ? 999 : Math.abs(longLine.routesBottom - shortLine.routesBottom);
      check('at ' + width + ' by ' + height + ' the ' + preset + ' routes panel and Buy button stay put when the lines wrap (routes ' + routeShift.toFixed(1) + 'px, buy ' + buyShift.toFixed(1) + 'px)', buyShift < 2 && routeShift < 2);
      var signBtn = doc.querySelector('#route-cards [data-act="route"]');
      if (signBtn) {
        st.cash = 1e18;
        win.__saltmarsh.render();
        var hostBox = doc.querySelector('#route-cards').getBoundingClientRect().top;
        var beforeTops = {};
        var beforeOrder = [];
        Array.prototype.forEach.call(doc.querySelectorAll('#route-cards .route-card'), function (card) {
          beforeTops[card.dataset.route] = card.getBoundingClientRect().top - hostBox;
          beforeOrder.push(card.dataset.route);
        });
        signBtn = doc.querySelector('#route-cards [data-act="route"]');
        if (signBtn) signBtn.click();
        var afterHost = doc.querySelector('#route-cards').getBoundingClientRect().top;
        var cardMove = 0;
        var cardWhere = '';
        var afterOrder = [];
        Array.prototype.forEach.call(doc.querySelectorAll('#route-cards .route-card'), function (card) {
          afterOrder.push(card.dataset.route);
          if (!(card.dataset.route in beforeTops)) return;
          var delta = Math.abs((card.getBoundingClientRect().top - afterHost) - beforeTops[card.dataset.route]);
          if (delta > cardMove) { cardMove = delta; cardWhere = card.dataset.route; }
        });
        var sameOrder = beforeOrder.join('|') === afterOrder.filter(function (id) { return beforeOrder.indexOf(id) >= 0; }).join('|');
        check('at ' + width + ' by ' + height + ' signing a ' + preset + ' route keeps each card in place (' + cardWhere + ' ' + cardMove.toFixed(1) + 'px)', cardMove < 2 && sameOrder);
      }
      var gearCard = doc.querySelector('#route-gear');
      var lightsPanel = doc.querySelector('#lights');
      if (gearCard && gearCard.hidden === false && lightsPanel && lightsPanel.hidden === false) {
        var lightsBefore = lightsPanel.getBoundingClientRect().top;
        M.ROUTES.forEach(function (spec) { st.routeGear[spec.id] = true; });
        st.gearQuote = null;
        win.__saltmarsh.render();
        var lightsAfter = lightsPanel.getBoundingClientRect().top;
        var sailShift = Math.abs(lightsAfter - lightsBefore);
        check('at ' + width + ' by ' + height + ' removing the ' + preset + ' spare sail does not jump the lighthouses (' + sailShift.toFixed(1) + 'px)', sailShift < 2);
      }
    }
    var layoutSizes = [[1280, 800], [390, 844], [375, 812], [320, 568]];
    var layoutAt;
    for (layoutAt = 0; layoutAt < layoutSizes.length; layoutAt++) {
      await holdLayout('fleet', layoutSizes[layoutAt][0], layoutSizes[layoutAt][1], 1);
      await holdLayout('lamps', layoutSizes[layoutAt][0], layoutSizes[layoutAt][1], 3);
    }
    function hiddenOverflow(doc) {
      var nodes = doc.querySelectorAll('button, .wait, .habit, .facts, .route-card h3, .light-card h3, #rate, #away-rule, #goal');
      var bad = [];
      var i;
      for (i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.closest('[hidden]')) continue;
        if (!el.getClientRects().length) continue;
        if (el.scrollWidth > el.clientWidth + 1) bad.push((el.id || el.className || el.tagName) + ' ' + el.scrollWidth + '>' + el.clientWidth + ' "' + (el.textContent || '').slice(0, 48) + '"');
      }
      return bad;
    }
    async function overflowAt(preset, width, height) {
      var box = await loadFrame(preset + ' overflow ' + width, '&state=' + preset);
      box.style.width = width + 'px';
      box.style.height = height + 'px';
      var win = box.contentWindow;
      var doc = box.contentDocument;
      await new Promise(function (resolve) { setTimeout(resolve, 150); });
      win.__saltmarsh.render();
      var bad = hiddenOverflow(doc);
      win.__saltmarsh.state.ended = true;
      win.__saltmarsh.state.ending = win.Saltmarsh.statsOf(win.__saltmarsh.state, Date.now());
      win.__saltmarsh.render();
      var endingButtons = doc.querySelectorAll('#ending button');
      var bi;
      for (bi = 0; bi < endingButtons.length; bi++) {
        var endBtn = endingButtons[bi];
        if (endBtn.scrollWidth > endBtn.clientWidth + 1) bad.push('ending ' + endBtn.scrollWidth + '>' + endBtn.clientWidth + ' "' + (endBtn.textContent || '').slice(0, 48) + '"');
      }
      check('at ' + width + ' by ' + height + ' ' + preset + ' buttons and status lines hide no overflow' + (bad.length ? ' (' + bad.slice(0, 3).join('; ') + ')' : ''), bad.length === 0 && endingButtons.length >= 4);
    }
    var overflowSizes = [[320, 568], [375, 812], [390, 844]];
    var overflowPresets = ['fleet', 'lamps', 'final'];
    var overflowAtSize;
    var overflowPresetAt;
    for (overflowAtSize = 0; overflowAtSize < overflowSizes.length; overflowAtSize++) {
      for (overflowPresetAt = 0; overflowPresetAt < overflowPresets.length; overflowPresetAt++) {
        await overflowAt(overflowPresets[overflowPresetAt], overflowSizes[overflowAtSize][0], overflowSizes[overflowAtSize][1]);
      }
    }
    async function choiceFits(width, height) {
      var box = await loadFrame('choice fit ' + width, '&state=fleet');
      box.style.width = width + 'px';
      box.style.height = height + 'px';
      var win = box.contentWindow;
      var doc = box.contentDocument;
      await new Promise(function (resolve) { setTimeout(resolve, 150); });
      var st = win.__saltmarsh.state;
      st.boats[1].owned = 10;
      st.forks.sloop = null;
      delete st.fittings['sloop-hull'];
      st.cash = 1e9;
      win.__saltmarsh.render();
      var choice = doc.querySelector('#choice');
      var buttons = choice.querySelectorAll('button');
      var viewH = box.clientHeight;
      var bothIn = buttons.length === 2;
      var b;
      for (b = 0; b < buttons.length; b++) {
        var rect = buttons[b].getBoundingClientRect();
        if (rect.top < 0 || rect.bottom > viewH + 1) bothIn = false;
      }
      var clipped = choice.scrollHeight > choice.clientHeight + 2;
      check('at ' + width + ' by ' + height + ' both desk choices are on screen without scrolling', choice.hidden === false && bothIn && clipped === false);
    }
    await choiceFits(1280, 800);
    await choiceFits(390, 844);
    await choiceFits(320, 568);
    var quayBox = await loadFrame('quay block', '&state=fleet');
    quayBox.style.width = '390px';
    quayBox.style.height = '844px';
    var quayWin = quayBox.contentWindow;
    var quayDoc = quayBox.contentDocument;
    await new Promise(function (resolve) { setTimeout(resolve, 150); });
    var quayState = quayWin.__saltmarsh.state;
    quayState.boats[3].owned = 16;
    quayState.captains[3].hired = true;
    ['kelp', 'gull', 'tea', 'headland', 'reed'].forEach(function (id) { quayState.routes[id] = 1; });
    quayState.voyages = 5;
    quayState.forks.quay = null;
    quayState.cash = 1e18;
    quayWin.__saltmarsh.render();
    var quayLight = quayDoc.querySelector('[data-act="light"][data-light="quay"]');
    var lightsBeforeClick = quayState.lights.quay || 0;
    if (quayLight) quayLight.click();
    check('the quay lighthouse says to choose the quay first and does not raise', !!quayLight && quayLight.disabled === true && /Choose the quay first/.test(quayLight.textContent) && (quayState.lights.quay || 0) === lightsBeforeClick);
    wipe();
    check('other saves are untouched', Object.keys(localStorage).slice().sort().join('|') === storedKeys);
    sum.textContent = 'PASS — ' + n + ' checks';
  } catch (err) {
    sum.textContent = 'FAIL — ' + (err && err.message ? err.message : err);
  } finally {
    button.disabled = false;
  }
};
