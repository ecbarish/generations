<!doctype html><html lang="en"><meta charset="utf-8"><title>Tell us checks (AR2.11)</title><style>body{font:16px system-ui;background:#16202c;color:#eef1f7;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:1024px;height:720px;border:0}</style><h1>"Tell us" checks (AR2.11)</h1><p>Every browser game's Settings has a "Tell us" row that opens a prefilled GitHub issue; Little Ranch has none.</p><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div><script>
'use strict';
const GAMES=[['../index.html','The arcade homepage'],['../games/wildbond/index.html','Wildbond'],['../games/realmbound/index.html','Realmbound'],['../games/starfall-guild/index.html','Starfall Guild'],['../games/otherworld/index.html','Otherworld'],['../games/diamond-career/index.html','Diamond Career'],['../games/diamond-manager/index.html','Diamond Manager'],['../games/storm-front/index.html','Storm Front'],['../games/lighthouse-watch/index.html','Lighthouse Watch'],['../games/briskets-crossing/index.html',"Brisket's Crossing"]];
document.querySelector('#run').onclick=async()=>{const sum=document.querySelector('#summary'),list=document.querySelector('#results'),button=document.querySelector('#run');button.disabled=true;list.replaceChildren();sum.textContent='Running…';
 const backup=new Map(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)]));let n=0,frame;
 const check=(name,ok)=>{n++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name;list.appendChild(li);if(!ok)throw Error(name);};
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const load=src=>new Promise((r,j)=>{if(frame)frame.remove();frame=document.createElement('iframe');frame.title='game under test';const t=setTimeout(()=>j(Error('load timed out: '+src)),30000);frame.onload=()=>{clearTimeout(t);r(frame.contentWindow);};frame.src=src;document.querySelector('#game').appendChild(frame);});
 const until=async(f,ms=8000)=>{const end=Date.now()+ms;while(Date.now()<end){try{const v=f();if(v)return v;}catch(e){}await sleep(100);}return null;};
 try{
  const options={};for(const f of ['feedback','bug','suggestion']){const y=await (await fetch('../.github/ISSUE_TEMPLATE/'+f+'.yml')).text();options[f+'.yml']=(y.match(/options: \[([^\]]*)\]/)||['',''])[1].split(',').map(s=>s.trim().replace(/^"|"$/g,''));}
  check('issue forms list their games',options['feedback.yml'].length>5);
  for(const [src,name] of GAMES){
   const w=await load(src),d=w.document;const btn=await until(()=>d.querySelector('.arc-set-btn'));check(name+': has a ⚙ Settings button',!!btn);
   await until(()=>w.Feedback&&w.Feedback.current);btn.click();const row=await until(()=>d.querySelector('.arc-tell'),3000);check(name+': Settings shows a "Tell us" row',!!row);
   const links=[...row.querySelectorAll('a[data-tell]')];check(name+': three Tell us links',links.length===3);
   for(const a of links){const u=new URL(a.href),form=u.searchParams.get('template'),game=u.searchParams.get('game'),ctx=u.searchParams.get('context')||'';
    check(name+' '+form+': opens a new issue on the arcade repo in a new tab',u.origin+u.pathname==='https://github.com/ecbarish/idle-arcade/issues/new'&&a.target==='_blank'&&/noopener/.test(a.rel));
    check(name+' '+form+': game is prefilled and matches the form',game===name&&(options[form]||[]).includes(game));
    check(name+' '+form+': version is prefilled',/^(v\d+\.\d+|test version)/.test(ctx));
    check(name+' '+form+': no save data in the link',ctx.length<200&&!/[{}]/.test(ctx));}
   const play=row.querySelector('.arc-set-note a');check(name+': links to the ten-minute playtest',!!play&&new URL(play.href).pathname.endsWith('/playtest.html')&&new URL(play.href).hash==='#script');
   d.querySelector('.arc-set-bg [data-close]').click();
  }
  {const w=await load('../games/little-ranch/index.html'),d=w.document;await sleep(800);check('Little Ranch: no Tell us, no feedback script, no GitHub links (toddler toy, no links out)',!w.Feedback&&!d.querySelector('.arc-tell')&&![...d.querySelectorAll('a')].some(a=>/github\.com/.test(a.href)));}
  {const w=await load('../playtest.html'),d=w.document,sec=d.querySelector('#script');check('Come Play has the ten-minute playtest',!!sec&&/ten-minute/i.test(sec.textContent));check('playtest asks exactly three questions',sec.querySelectorAll('ol li').length===3);check('playtest is in the page menu',!!d.querySelector('nav a[href="#script"]'));}
  sum.textContent='PASS — '+n+' checks.';
 }catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();localStorage.clear();for(const[k,v]of backup)localStorage.setItem(k,v);button.disabled=false;}};
</script></html>
