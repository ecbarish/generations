<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Little Ranch · Generations</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#lock{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:0;padding:0;
  background:rgba(255,255,255,.35);touch-action:none;cursor:pointer}
#lock svg{width:48px;height:48px;display:block}
#grown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:rgba(22,28,52,.58);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font:700 17px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3a2a20;animation:fade .18s ease-out}
#grown[hidden]{display:none}
#grown .card{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff8ec;border-radius:28px;padding:22px 20px 20px;
  box-shadow:0 22px 60px rgba(10,14,30,.45),0 0 0 4px rgba(242,193,78,.55) inset;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
#grown .ttl{margin:2px 52px 16px;text-align:center;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#a07c58}
#grown .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;border-radius:50%;background:#f1e4cf;color:#6a4a36;display:grid;place-items:center;cursor:pointer}
#grown .x svg{width:20px;height:20px}
#grown .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#grown.app .acts{grid-template-columns:repeat(3,1fr)}
#grown .act{min-width:0;min-height:112px;border:0;border-radius:22px;background:#fff;color:inherit;font:inherit;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;cursor:pointer;box-shadow:0 3px 0 rgba(120,90,60,.16),0 6px 16px rgba(120,90,60,.12);transition:transform .08s}
#grown .act:active,#grown .x:active{transform:scale(.95)}
#grown .act:focus-visible,#grown .x:focus-visible{outline:4px solid #50a8ff;outline-offset:2px}
#grown .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 -4px 0 rgba(0,0,0,.12) inset}
#grown .disc svg{width:32px;height:32px}
#grown .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
#grown .sun .disc{background:#f2b632}#grown .sky .disc{background:#4fa6e8}#grown .grass .disc{background:#5fb34a}#grown .ember .disc{background:#e06a32}
#grown .off .disc{background:#b8ab98}
#grown .app-only,#grown.app .web-only{display:none}#grown.app .app-only{display:flex}
@media (max-width:520px){#grown:not(.app) .acts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:360px){#grown .card{padding:18px 14px 14px}#grown .acts{gap:9px}#grown .act{min-height:100px}#grown .disc{width:54px;height:54px}#grown{font-size:15px}}
@media (max-height:430px){#grown .ttl{margin-bottom:10px}#grown .act{min-height:92px;padding:10px 6px;gap:7px}#grown .disc{width:50px;height:50px}#grown .disc svg{width:26px;height:26px}#grown:not(.app) .acts{grid-template-columns:repeat(4,1fr)}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.92);opacity:0}}
@media (prefers-reduced-motion:reduce){#grown,#grown .card{animation:none}#grown .act{transition:none}}
</style></head>
<body>
<canvas id="ranch" role="img" aria-label="A baby Cindercub in a sunny ranch corner, with a food bowl, a sponge and a bush"></canvas>
<button id="lock" aria-label="Grown-ups: hold for three seconds"><svg viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="24" r="19" fill="none" stroke="rgba(60,60,90,.25)" stroke-width="4"/>
  <circle id="lockRing" cx="24" cy="24" r="19" fill="none" stroke="#f2c14e" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 24 24)"/>
  <path d="M17 23v-4a7 7 0 0 1 14 0v4" fill="none" stroke="rgba(60,60,90,.55)" stroke-width="3"/><rect x="14" y="22" width="20" height="14" rx="3" fill="rgba(60,60,90,.55)"/></svg></button>
<div id="grown" hidden role="dialog" aria-modal="true" aria-labelledby="gTitle"><div class="card">
  <button id="gX" class="x" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  <p class="ttl" id="gTitle">For grown-ups</p>
  <div class="acts">
    <button id="gNew" class="act sun"><span class="disc"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="5.5" fill="currentColor"/><path d="M16 3.5v3M16 25.5v3M3.5 16h3M25.5 16h3M7.2 7.2l2.1 2.1M22.7 22.7l2.1 2.1M7.2 24.8l2.1-2.1M22.7 9.3l2.1-2.1"/></svg></span><span class="lbl" id="gNewLabel">New visit</span></button>
    <button id="gSound" class="act sky" aria-pressed="true"><span class="disc"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5h4.5L15 7v18l-6.5-5.5H4z" fill="currentColor"/><path id="gWaves" d="M20 12.5a4.5 4.5 0 0 1 0 7M23.5 9a9 9 0 0 1 0 14"/><path id="gMute" d="M20.5 12.5l7 7M27.5 12.5l-7 7" style="display:none"/></svg></span><span class="lbl" id="gSoundLabel">Sound on</span></button>
    <a id="gHome" class="act grass web-only" href="../../index.html" aria-label="Back to the arcade"><span class="disc"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15L16 6l11 9"/><path d="M8.5 13v12.5h15V13"/><path d="M14 25.5v-6h4v6" fill="currentColor"/></svg></span><span class="lbl">Arcade</span></a>
    <button id="gClose" class="act ember web-only"><span class="disc"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5l12 7.5-12 7.5z" fill="currentColor"/></svg></span><span class="lbl">Back to play</span></button>
    <button id="gExit" class="act ember app-only"><span class="disc"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6H7.5v20H13"/><path d="M14 16h13M22 10.5l5.5 5.5-5.5 5.5"/></svg></span><span class="lbl">Exit</span></button>
  </div>
</div></div>
<script src="game.js"></script>
</body></html>
