<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realmbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="field-window.css">
<link rel="stylesheet" href="road-places.css">
<link rel="stylesheet" href="phone.css">
<link rel="stylesheet" href="../../shared/accessibility.css">

<div class="app" id="app">
  <header class="frame top">
    <div class="brand"><h1>Realmbound</h1><a class="home" href="../../index.html">← Arcade</a><button class="btn sm alt" data-act="chars">Characters</button><button class="btn sm alt" id="gfxBtn" data-act="gfx" title="Graphics quality: High (soft shadows, bloom) or Low (faster)">Graphics</button><button class="btn sm alt" id="sndBtn" data-act="sound" aria-pressed="false" title="Sound: off, effects, or effects and music">Sound: off</button><button class="btn sm alt" data-road="replay">Watch arrival</button><button class="btn sm alt" data-road="reset" title="Show or reset optional road guidance for this hero">Road help</button><span class="version-label" style="font-size:12px;color:var(--dim);margin:0 4px;">v1.9.1</span><div class="feedback-container"><button class="btn sm alt" aria-haspopup="true" aria-expanded="false">Feedback</button></div></div>
    <div class="who" id="who"></div>
  </header>

  <div class="grid">
    <section class="frame world">
      <div class="zonebar">
        <div><h2 id="zoneName">Thornvale</h2><div class="zsub" id="zoneSub"></div><p class="zlore" id="zoneLore"></p></div>
        <div class="zbtns" id="zoneBtns"></div>
      </div>
      <div class="scene"><canvas id="scene" aria-label="Your hero in the world"></canvas><div class="errtext" id="err"></div><div class="statusline" id="status"></div></div>
      <div id="arrivalControls" class="road-acts" aria-label="Arrival controls" hidden><button class="btn sm" data-road="advance">Continue (Enter)</button><button class="btn sm alt" data-road="skip">Skip arrival (Esc)</button></div>
      <aside id="roadGuide" class="road-guide" aria-label="Road guide" hidden></aside>
      <div class="units">
        <div class="unit" id="pframe">
          <div class="portrait" id="pPort">?<span class="lvl" id="pLvl">1</span></div>
          <div style="min-width:0"><div class="uname" id="pName"></div>
            <div class="bar b-hp"><i id="pHp"></i><span id="pHpT"></span></div>
            <div class="bar" id="pResBar"><i id="pRes"></i><span id="pResT"></span></div>
            <div class="cps" id="pCps" hidden><b></b><b></b><b></b><b></b><b></b></div></div>
        </div>
        <div class="unit target" id="tframe">
          <div style="min-width:0;text-align:right"><div class="uname" id="tName">No target</div>
            <div class="bar b-hp"><i id="tHp"></i><span id="tHpT"></span></div>
            <div class="bar b-cast" id="castBar" hidden><i id="castI"></i><span id="castT"></span></div>
            <button class="tamebtn" data-act="tame" id="tameBtn" hidden>Tame Beast</button></div>
          <div class="portrait" id="tPort">–<span class="lvl" id="tLvl">?</span></div>
        </div>
      </div>
      <div class="party" id="partyframes" hidden></div>
      <div class="enccard" id="enccard" hidden><div class="who2" id="encText"></div><div class="acts2" id="encActs"></div></div>
      <div class="petframe" id="petframe" hidden>
        <span class="pn" id="pfName"></span>
        <div class="bar b-hp"><i id="pfHp"></i><span id="pfHpT"></span></div>
        <span class="mood" id="pfMood"></span>
      </div>
      <div class="lootwin" id="lootwin" hidden><ul id="lootList"></ul><button class="btn" data-act="loot">Loot all (L)</button></div>
      <div class="abar">
        <div class="slots" id="slots"></div>
        <div class="slots"><button class="ab special combo" data-act="combo" id="comboBtn" hidden><span class="key">C</span><span class="ic" id="comboTxt">Combo</span></button>
          <button class="ab special dodge" data-act="dodge" id="dodgeBtn" hidden><span class="key">D</span><span class="ic">Dodge!</span></button>
          <button class="ab special dodge" data-act="raidcall" data-arg="swap" id="call-swap" hidden><span class="key">S</span><span class="ic">Swap!</span></button><button class="ab special dodge" data-act="raidcall" data-arg="adds" id="call-adds" hidden><span class="key">A</span><span class="ic">Adds!</span></button><button class="ab special combo" data-act="raidcall" data-arg="spread" id="call-spread" hidden><span class="key">Q</span><span class="ic">Spread!</span></button><button class="ab special combo" data-act="raidcall" data-arg="stack" id="call-stack" hidden><span class="key">W</span><span class="ic">Stack!</span></button></div>
        <div class="mode">
          <button class="btn sm" data-act="fight" id="fightBtn" hidden>Fight</button>
          <div class="seg" role="group" aria-label="Play mode"><button data-act="mode" data-arg="focus" id="mFocus">Focus</button><button data-act="mode" data-arg="auto" id="mAuto">Auto</button></div>
          <div class="modehint" id="modeHint"></div>
        </div>
      </div>
      <div class="xp" title="Experience. The blue marker is rested experience: kills give double XP until it runs out."><i id="xpI"></i><em id="xpR"></em><div class="xpticks"></div><span id="xpT"></span></div>
      <div class="log" id="log" aria-live="off"></div>
    </section>

    <section class="frame menu">
      <nav class="tabs" role="tablist" aria-label="Game menus">
        <button role="tab" data-act="tab" data-arg="quests">Quests <span class="badge" id="qBadge" hidden>!</span></button>
        <button role="tab" data-act="tab" data-arg="char">Character</button>
        <button role="tab" data-act="tab" data-arg="friends">Friends <span class="badge" id="fBadge" hidden>!</span></button>
        <button role="tab" data-act="tab" data-arg="bags">Bags <span class="badge" id="bBadge" hidden></span></button>
        <button role="tab" data-act="tab" data-arg="mounts">Mounts <span class="badge" id="mBadge" hidden>!</span></button>
        <button role="tab" data-act="tab" data-arg="pets" id="petsTab" hidden>Pets <span class="badge" id="pBadge" hidden>!</span></button>
        <button role="tab" data-act="tab" data-arg="talents">Talents <span class="badge" id="tBadge" hidden></span></button>
        <button role="tab" data-act="tab" data-arg="addons">Addons <span class="badge" id="aBadge" hidden>new</span></button>
        <button role="tab" data-act="tab" data-arg="supplies">Guild</button>
        <button role="tab" data-act="tab" data-arg="journal">Journal</button>
      </nav>
      <div class="tb" id="tabbody"></div>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="frame sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="tip" id="tip" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
