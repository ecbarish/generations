<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Bowl · Generations</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cabinet">
<header>
  <a class="home" href="../../index.html"><span class="wide">← Arcade</span><span class="narrow">←</span></a>
  <h1>Lantern Bowl</h1>
  <div id="settingsMount"><button id="sound" type="button" aria-label="Change sound setting">Sound off</button></div>
</header>
<section class="screen" aria-label="Lamplight Field">
  <div class="hud">
    <span><small>LANTERNS</small><b id="homeScore">0</b></span>
    <span class="mid"><small id="clock">Q1 2m 0s</small><b id="down">1st and 10</b></span>
    <span class="right"><small>MILLRACE</small><b id="awayScore">0</b></span>
  </div>
  <div class="pitch">
    <canvas id="field" tabindex="0" aria-label="The field, seen from the side."></canvas>
    <small id="build" class="build">v0.1.4</small>
  </div>
  <div class="under">
    <p id="cue" class="field-cue" hidden></p>
    <p id="sheet" class="sheet" hidden></p>
    <p class="banner" id="banner" hidden></p>
  </div>
  <div class="curtain" id="curtain"><section class="panel" id="panel" role="dialog" aria-labelledby="panelTitle"></section></div>
</section>
<footer>
  <div class="dock" id="dock" role="group" aria-label="Play call"></div>
  <p class="hint" id="hint"></p>
  <p id="held" class="held" hidden></p>
</footer>
</main>
<script src="../../shared/engine.js"></script>
<script src="../../shared/settings.js"></script>
<script src="../../shared/sound.js"></script>
<script src="../../shared/feedback.js"></script>
<script src="model.js"></script>
<script src="view.js"></script>
<script src="game.js"></script>
</body>
</html>
