<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Market Stalls</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="window">
  <header>
    <a class="home" href="../../index.html">Back to the arcade</a>
    <h1>Night Market Stalls</h1>
    <p class="scene">Lanterns over a short lane of stalls. You work a stall yourself before anyone will run it.</p>
    <p class="coins"><span id="coins">0</span> coins</p>
    <p class="rate" id="rate"></p>
    <p class="goal" id="goal"></p>
  </header>
  <div class="bulk" id="bulk" hidden role="group" aria-label="How many to buy at once">
    <button type="button" data-bulk="1" aria-pressed="true">Buy 1</button>
    <button type="button" data-bulk="10" aria-pressed="false">Buy 10</button>
    <button type="button" data-bulk="max" aria-pressed="false">Buy max</button>
  </div>
  <section id="away" hidden></section>
  <ol class="stalls" id="stalls"></ol>
  <details class="save">
    <summary>Your save</summary>
    <div id="tools"></div>
  </details>
  <p class="foot"><a href="../../index.html">Back to the arcade</a></p>
</main>
<script src="../../shared/engine.js"></script>
<script src="../../shared/idle-core.js"></script>
<script src="model.js"></script>
<script src="game.js"></script>
</body>
</html>
